<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Mortalidad a 30 días por puntaje de CURB-65 (Lim 2003, resumen) y grupos de riesgo y conducta de NICE NG250.
const D = [[0, 0.7], [1, 3.2], [2, 3], [3, 17], [4, 41.5], [5, 57]];
const col = (p) => (p <= 1 ? TEAL : p === 2 ? AZUL : ROJO);
const X0 = 70, W = 560, Y0 = 300, H = 250, MAX = 60;
const bw = 62, paso = W / 6;
const y = (v) => Y0 - (v / MAX) * H;
const barras = D.map(([p, m], i) => {
  const x = X0 + i * paso + (paso - bw) / 2;
  return `<rect x="${x}" y="${y(m)}" width="${bw}" height="${Y0 - y(m)}" rx="8" fill="${col(p)}"/>
    <text x="${x + bw / 2}" y="${y(m) - 8}" text-anchor="middle" font-size="15" font-weight="800" fill="${col(p)}">${String(m).replace(".", ",")} %</text>
    <text x="${x + bw / 2}" y="${Y0 + 22}" text-anchor="middle" font-size="16" font-weight="800" fill="${TINTA}">${p}</text>`;
}).join("");
const ejes = [0, 20, 40, 60].map((v) => `<line x1="${X0 - 6}" y1="${y(v)}" x2="${X0 + W}" y2="${y(v)}" stroke="#E5E7EB"/>
  <text x="${X0 - 12}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#6B7280">${v} %</text>`).join("");
const grupo = (a, b, c, t1, t2) => `<rect x="${X0 + a * paso + 6}" y="${Y0 + 34}" width="${(b - a + 1) * paso - 12}" height="46" rx="10" fill="${tinte(c, 14)}" stroke="${tinte(c, 55)}"/>
  <text x="${X0 + (a + b + 1) / 2 * paso}" y="${Y0 + 53}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${c}">${t1}</text>
  <text x="${X0 + (a + b + 1) / 2 * paso}" y="${Y0 + 71}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${TINTA}">${t2}</text>`;
lienzo("Mortalidad según el CURB-65", "Muerte a 30 días por puntaje y sitio de atención",
  `<svg width="668" height="392" viewBox="0 0 668 392">${ejes}${barras}
    <text x="${X0 + W / 2}" y="${Y0 + 22}" font-size="1" fill="#fff">.</text>
    ${grupo(0, 1, TEAL, "Bajo: menos del 3 %", "Casa")}${grupo(2, 2, AZUL, "3-15 %", "Hospital")}${grupo(3, 5, ROJO, "Alto: más del 15 %", "Hospital y valorar la UCI")}
    <text x="12" y="${Y0 + 24}" font-size="12.5" font-weight="700" fill="#6B7280">Puntos</text></svg>`,
  "Gráfico. Fuente: Lim et al., Thorax 2003 (mortalidad por puntaje, resumen del estudio); NICE NG250, 2025 (grupos de riesgo y sitio de atención).");
</script></body></html>
