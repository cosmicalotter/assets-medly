<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
  .col{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 7%,white);padding:10px;display:flex;flex-direction:column;gap:8px}
  .col h3{font-size:19px;color:var(--c)}
  .f{background:#fff;border-radius:10px;padding:7px 8px;font-size:13.5px;line-height:1.3;border:1px solid #E5E7EB}
  .f b{color:var(--tinta)}
  .r{margin-top:auto;font-size:13px;color:#475569}
</style></head><body>
<script>
const COLS = [
  [VERDE, "Leve", ["<b>Salbutamol 2-4 pulsaciones</b> con cámara"], "Reevaluar a los 15 min: responde → alta; no → moderada."],
  [NARANJA, "Moderada", ["<b>Salbutamol 6-8 pulsaciones</b> con cámara cada 20 min, hasta 3 dosis", "Nebulizado <b>0,15 mg/kg</b> (máx. 5 mg) sólo si necesita oxígeno", "<b>Prednisolona 1-2 mg/kg</b> (máx. 40 mg)", "Oxígeno si SaO2 <94 %"], "Reevaluar 15 min tras la última dosis."],
  [ROJO, "Grave", ["<b>Oxígeno</b>: SaO2 94-98 %", "<b>Salbutamol 10 pulsaciones + ipratropio 2-4</b> con cámara cada 20 min, hasta 3 dosis", "o nebulizados: salbutamol 0,15 mg/kg (máx. 5 mg) + ipratropio 250-500 mcg", "<b>Prednisona 2 mg/kg</b> oral o IV (máx. 40 mg)", "Sin respuesta: <b>sulfato de magnesio IV</b>"], "Hospital; muy grave: UCI."],
];
lienzo("Tratamiento de la crisis", "Dosis según la gravedad; salbutamol de 100 mcg por pulsación",
  `<div class="cols">${COLS.map(([c, t, fs, r]) => `<div class="col" style="--c:${c}"><h3>${t}</h3>${fs.map((f) => `<div class="f">${f}</div>`).join("")}<div class="r">${r}</div></div>`).join("")}</div>`,
  FUENTE_GEMA + ", figura 5.2 (p. 127) y p. 126 (corticoide y magnesio).");
</script></body></html>
