<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Fases del trabajo de parto: OMS 2018 (recomendaciones 5, 6 y 33), NICE NG235 1.8.1 y 1.10.20, ACOG CPG 8 (2024).
// Las dos primeras columnas miden lo mismo: la regla de dilatación va a escala debajo de ellas (0-5 y 5-10 cm).
const COL = [188, 188, 146, 128], G = 6;
const F = [
  ["Fase latente", CELESTE, "Contracciones dolorosas y cambios del cuello <b>hasta los 5 cm</b>", "<b>Sin duración estándar</b>: puede ser larga"],
  ["Fase activa", AZUL, "Contracciones regulares, de <b>5 cm</b> a la dilatación <b>completa</b>", "<b>≤12 h</b> primer parto<br><b>≤10 h</b> siguientes"],
  ["Expulsivo", MORADO, "De la dilatación completa al <b>nacimiento</b>", "<b>≤3 h</b> primer parto<br><b>≤2 h</b> siguientes"],
  ["Alumbramiento", VERDE, "Del nacimiento a la <b>placenta</b>", "<b>≤30 min</b> con manejo activo"],
];
const rejilla = `display:grid;grid-template-columns:${COL.map((c) => c + "px").join(" ")};gap:${G}px`;
const cab = `<div style="${rejilla}">${F.map(([t, c]) => `<div style="background:${c};color:#fff;border-radius:10px;padding:8px 6px;font-weight:700;font-size:14.5px;text-align:center;white-space:nowrap">${t}</div>`).join("")}</div>`;
// Regla 0-10 cm a escala bajo latente + activa
const ANCHO = COL[0] + COL[1] + G, cm = (v) => 8 + (v / 10) * (ANCHO - 16);
const XE = ANCHO + G, XA = XE + COL[2] + G;
let r = `<svg width="668" height="92" viewBox="0 0 668 92" style="flex:none">`;
// cortes de cada guía (encima de la regla)
const cortes = [[4, "NICE", GRIS], [5, "OMS", AZUL], [6, "ACOG", GRIS]];
cortes.forEach(([v, g, c]) => {
  r += `<line x1="${cm(v)}" y1="${v === 5 ? 18 : 26}" x2="${cm(v)}" y2="56" stroke="${c}" stroke-width="${v === 5 ? 2.5 : 1.5}" ${v === 5 ? "" : `stroke-dasharray="4 3"`}/>`;
  r += `<text x="${cm(v) + (v === 4 ? -4 : v === 6 ? 4 : 0)}" y="${v === 5 ? 13 : 21}" text-anchor="${v === 4 ? "end" : v === 6 ? "start" : "middle"}" font-size="${v === 5 ? 13 : 12}" font-weight="700" fill="${c}">${g} ${v} cm</text>`;
});
r += `<rect x="${cm(0)}" y="34" width="${cm(5) - cm(0)}" height="20" rx="10" fill="${tinte(CELESTE, 40)}"/>`;
r += `<rect x="${cm(5)}" y="34" width="${cm(10) - cm(5)}" height="20" rx="10" fill="${tinte(AZUL, 50)}"/>`;
for (let v = 0; v <= 10; v++) {
  r += `<line x1="${cm(v)}" y1="58" x2="${cm(v)}" y2="${v % 5 ? 63 : 68}" stroke="${GRIS}" stroke-width="1.5"/>`;
  r += `<text x="${cm(v)}" y="82" text-anchor="middle" font-size="12.5" ${v % 5 ? `fill="${GRIS}"` : `font-weight="700" fill="${TINTA}"`}>${v === 10 ? "10 cm" : v}</text>`;
}
// expulsivo y alumbramiento: de qué a qué
const hito = (x0, w, a, b, c) => `<rect x="${x0}" y="34" width="${w}" height="20" rx="10" fill="${tinte(c, 40)}"/>
  <circle cx="${x0 + 10}" cy="44" r="6" fill="#fff" stroke="${c}" stroke-width="3"/><circle cx="${x0 + w - 10}" cy="44" r="6" fill="${c}"/>
  <text x="${x0 + w - 2}" y="76" text-anchor="end" font-size="11.5" font-weight="700" fill="${TINTA}">${b}</text>`;
r += hito(XE, COL[2], "10 cm", "nacimiento", MORADO);
r += hito(XA, COL[3], "nacimiento", "placenta", VERDE);
r += `</svg>`;
const fila = (k, fondo, borde, alto) => `<div style="${rejilla}">${F.map((f) => `<div class="caja" style="background:${tinte(f[1], fondo)};border:1.5px solid ${tinte(f[1], borde)};min-height:${alto}px;font-size:13px"><span>${f[k]}</span></div>`).join("")}</div>`;
const rotulo = (t) => `<div style="font-size:12px;font-weight:700;color:${GRIS};letter-spacing:.04em;text-transform:uppercase;margin-bottom:-4px">${t}</div>`;
const nota = `<div class="caja" style="background:#F8FAFC;border:1px solid var(--linea);font-size:12.5px;color:#475569">
  Las guías ponen el inicio de la fase activa en <b>4</b>, <b>5</b> o <b>6 cm</b>: antes de los <b>6 cm</b> no se diagnostica una <b>detención</b>.</div>`;
lienzo("Fases del trabajo de parto", "Dónde empieza cada fase y cuánto puede durar", cab + r + fila(2, 8, 35, 68) + rotulo("Cuánto suele durar") + fila(3, 16, 50, 62) + nota,
  "Esquema. Fuente: OMS 2018, recomendaciones 5, 6 y 33; NICE NG235 (2023), 1.8.1 y 1.10.20; ACOG CPG n.º 8 (2024).");
</script></body></html>
