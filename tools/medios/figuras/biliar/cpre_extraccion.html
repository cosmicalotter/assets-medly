<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .paso{display:flex;gap:10px;align-items:center;background:#1F2A37;color:#fff;border-radius:12px;padding:8px 12px;min-height:46px}
  .paso .n{font-size:22px;font-weight:800;color:var(--teal);min-width:22px;text-align:center}
  .paso .d{font-size:15px;font-weight:700;line-height:1.25}
  .esq{flex:1;border-radius:14px;background:#F7F8FA}
  .pie{display:flex;gap:8px}
  .pie div{flex:1;border-radius:10px;background:#F3F4F6;padding:7px 10px;font-size:12.5px;line-height:1.3}
</style></head><body>
<script>
// Esquema de la CPRE: duodeno, papila, colédoco con un cálculo (no es una imagen real).
const PASOS = [
  [0.00, "Cálculo en el colédoco distal: la bilis no drena"],
  [0.14, "Canulación del colédoco con una guía"],
  [0.28, "Esfinterotomía endoscópica de la papila"],
  [0.42, "Balón por encima del cálculo; se infla"],
  [0.56, "Barrido: el balón arrastra el cálculo al duodeno"],
  [0.74, "Vía biliar libre: la bilis vuelve a drenar"],
];
// Línea media del colédoco: Bézier cuadrática desde el hilio hasta la papila.
const P0 = [250, 6], P1 = [270, 160], P2 = [398, 206];
const enCol = (u) => [(1 - u) ** 2 * P0[0] + 2 * (1 - u) * u * P1[0] + u * u * P2[0], (1 - u) ** 2 * P0[1] + 2 * (1 - u) * u * P1[1] + u * u * P2[1]];
const COLEDOCO = `M${P0} Q${P1} ${P2}`;
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.6;
  const k = PASOS.filter(([a]) => t >= a).length;
  const guia = tramo(t, 0.15, 0.26);
  const corte = tramo(t, 0.29, 0.38);
  const infla = tramo(t, 0.43, 0.52);
  const barre = tramo(t, 0.57, 0.72);
  const libre = tramo(t, 0.74, 0.86);
  let s = "";
  // Duodeno (segunda porción) y pared medial con la papila.
  s += `<rect x="398" y="-10" width="150" height="360" fill="#F6CFC9"/><rect x="398" y="-10" width="10" height="360" fill="#E0A49C"/><rect x="538" y="-10" width="10" height="360" fill="#E0A49C"/>`;
  s += `<text x="530" y="318" font-size="13" font-weight="800" fill="#B4534A" text-anchor="end">duodeno</text>`;
  // Conducto pancreático.
  s += `<path d="M398 210 Q330 238 210 250" fill="none" stroke="#E9B93A" stroke-width="7" stroke-linecap="round"/><text x="214" y="274" font-size="12" font-weight="700" fill="#A16207">conducto pancreático</text>`;
  // Colédoco: dilatado y con bilis estancada hasta que se libera.
  const bilis = libre > 0 ? "#7FB84A" : "#4F6B2C";
  s += `<path d="${COLEDOCO}" fill="none" stroke="#5E8C2E" stroke-width="34" stroke-linecap="round"/><path d="${COLEDOCO}" fill="none" stroke="${bilis}" stroke-width="27" stroke-linecap="round"/>`;
  s += `<text x="226" y="60" font-size="13" font-weight="800" fill="#3F6212" text-anchor="end">colédoco dilatado</text>`;
  // Papila.
  s += `<ellipse cx="404" cy="206" rx="12" ry="16" fill="#E78F86" stroke="#B4534A" stroke-width="2"/>`;
  if (corte > 0) s += `<path d="M404 206 L${404 - 22 * corte} ${200 - 10 * corte}" stroke="#EF5454" stroke-width="4" stroke-linecap="round"/>`;
  // Duodenoscopio de visión lateral.
  s += `<rect x="452" y="-10" width="46" height="232" rx="18" fill="#1F2A37"/><rect x="452" y="186" width="18" height="30" rx="5" fill="#4B5563"/>`;
  s += `<text x="475" y="70" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" transform="rotate(90 475 70)">duodenoscopio</text>`;
  // Guía por el colédoco.
  if (guia > 0) {
    const pts = [];
    for (let u = 1; u >= 1 - 0.95 * guia; u -= 0.02) pts.push(enCol(u));
    s += `<path d="M452 202 L404 206 ${pts.map((p) => "L" + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}" fill="none" stroke="#111827" stroke-width="2.5"/>`;
  }
  // Cálculo y balón.
  const uPiedra0 = 0.78;
  const uBalon = barre > 0 ? lerp(0.62, 1.12, barre) : 0.62;
  let piedra;
  if (barre <= 0) piedra = enCol(uPiedra0);
  else {
    const uP = Math.min(1, Math.max(uPiedra0, uBalon + 0.12));
    piedra = uBalon + 0.12 <= 1 ? enCol(uP) : [lerp(398, 470, Math.min(1, (uBalon + 0.12 - 1) / 0.24)), lerp(206, 300, Math.min(1, (uBalon + 0.12 - 1) / 0.24))];
  }
  if (k >= 4) {
    const b = uBalon <= 1 ? enCol(uBalon) : [lerp(398, 430, uBalon - 1), 206];
    s += `<ellipse cx="${b[0]}" cy="${b[1]}" rx="${6 + 9 * infla}" ry="${6 + 9 * infla}" fill="#93C5FD" stroke="#1D4ED8" stroke-width="2" opacity=".95"/>`;
  }
  s += `<ellipse cx="${piedra[0]}" cy="${piedra[1]}" rx="15" ry="12" fill="#E9D9A6" stroke="#9A7B2F" stroke-width="2.5"/>`;
  if (k === 1) s += `<text x="${piedra[0] - 64}" y="${piedra[1] - 22}" font-size="13" font-weight="800" fill="#FDE68A">cálculo</text>`;
  s += `<text x="412" y="244" font-size="12.5" font-weight="800" fill="#B4534A">papila</text>`;
  // Bilis que drena al duodeno.
  if (libre > 0) for (let j = 0; j < 6; j++) {
    const u = (t * 5 + j / 6) % 1;
    s += `<circle cx="${lerp(410, 470, u)}" cy="${lerp(208, 250, u)}" r="4" fill="#7FB84A" opacity="${libre}"/>`;
  }
  lienzo(
    "CPRE: extracción del cálculo con balón",
    "Esfinterotomía y barrido del colédoco",
    `<div class="paso"><div class="n">${k}</div><div class="d">${PASOS[k - 1][1]}</div></div>
     <svg class="esq" viewBox="40 0 600 330">${s}</svg>
     <div class="pie"><div>Cálculo grande: esfinterotomía limitada + <b>dilatación con balón grande</b>.</div><div>Difícil: colangioscopia con litotricia; si no sale, <b>stent plástico</b> temporal.</div><div>Después: colecistectomía en <b>≤2 semanas</b>.</div></div>`,
    "Esquema, no una imagen endoscópica real. Fuente: ESGE 2019 y ASGE 2019 sobre coledocolitiasis."
  );
};
window.cuadro(0, 1);
</script></body></html>
