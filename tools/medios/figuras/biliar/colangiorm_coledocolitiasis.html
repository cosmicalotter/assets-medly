<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:12px;flex:1;min-height:0}
  .visor{width:390px;height:416px;border-radius:14px;overflow:hidden;background:#000;flex:none}
  .pasos{flex:1;display:flex;flex-direction:column;gap:6px}
  .p{display:flex;gap:8px;align-items:center;border-radius:10px;padding:7px 9px;background:#F3F4F6;font-size:13px;line-height:1.25;color:#9CA3AF}
  .p .n{width:22px;height:22px;border-radius:7px;background:#D1D5DB;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .p.hecho{color:var(--tinta)}
  .p.hecho .n{background:var(--suave)}
  .p.ya{background:#1F2A37;color:#fff;font-weight:700}
  .p.ya .n{background:var(--teal)}
</style></head><body>
<script>
// Colangio-RM real (Hellerhoff, Wikimedia Commons, CC BY-SA 3.0) editada por
// Empirica: se tapan las flechas y letras originales y se superponen trazos,
// rótulos y un zoom que recorren la imagen paso a paso.
const IMG = "../../../../data/imagenes/algoritmo/biliar/biliar_colangiorm_coledocolitiasis.jpg";
const PASOS = [
  [0.00, "Bilis y líquido = <b>blanco</b>; cálculo = <b>hueco oscuro</b>"],
  [0.12, "Vesícula con cálculos"],
  [0.28, "Seguir la vía biliar: hepático común y colédoco"],
  [0.44, "Huecos oscuros en el colédoco distal: <b>cálculos</b>"],
  [0.68, "Conducto pancreático y duodeno"],
  [0.83, "Cálculo confirmado → <b>CPRE</b>"],
];
// Vista completa y vista ampliada del colédoco distal (coordenadas de la imagen, 1094 × 1012).
const VISTA = [90, 40, 900, 960], ZOOM = [288, 578, 266, 284];
const ANCHO_VISOR = 390;
// Curva suave (Catmull-Rom) por puntos medidos sobre el brillo de cada conducto.
const curva = (P) => P.slice(1).reduce((d, p, j) => {
  const a = P[Math.max(0, j - 1)], b = P[j], c = p, e = P[Math.min(P.length - 1, j + 2)];
  return d + ` C${b[0] + (c[0] - a[0]) / 6} ${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6} ${c[1] - (e[1] - b[1]) / 6} ${c[0]} ${c[1]}`;
}, `M${P[0][0]} ${P[0][1]}`);
const COLEDOCO = curva([[440, 290], [438, 340], [441, 390], [447, 420], [452, 445], [460, 478], [470, 505], [480, 530], [488, 560], [492, 585],
  [490, 610], [482, 628], [470, 648], [458, 668], [447, 688], [433, 708], [418, 728], [408, 746], [398, 768]]);
const CISTICO = curva([[352, 356], [372, 350], [389, 362], [398, 378], [400, 398], [404, 420], [414, 445], [422, 460], [432, 474], [446, 486]]);
const PANCREAS = curva([[428, 764], [450, 744], [470, 729], [487, 710], [498, 688], [508, 662], [513, 636], [514, 610], [517, 580], [528, 552],
  [550, 533], [580, 524], [610, 512], [640, 498], [680, 488], [720, 486], [780, 482], [850, 480], [905, 482]]);
const VESICULA = "M120 285 C120 238 175 216 238 225 C292 233 344 270 352 315 C357 350 340 375 310 373 C262 366 205 348 162 335 C132 325 120 308 120 285 Z";
const CALCULOS_VES = [[265, 296], [285, 316], [306, 337], [336, 331], [330, 356]];
// Flechas y letras a-d de la imagen original.
const TAPAS = ["150,360 240,360 240,495 150,495", "290,592 334,592 404,684 392,700 326,650 290,642",
  "596,538 618,532 660,610 660,664 620,664 616,612", "175,925 270,858 292,872 242,935 214,970 175,970"];

const largo = (d) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); return p.getTotalLength(); };
const L = { col: largo(COLEDOCO), cis: largo(CISTICO), pan: largo(PANCREAS), ves: largo(VESICULA) };
const trazo = (d, color, ancho, u, total, extra = "") =>
  u > 0 ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${ancho}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${total}" stroke-dashoffset="${total * (1 - u)}" ${extra}/>` : "";

window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.6;
  const k = PASOS.filter(([a]) => t >= a).length;
  // Cámara: acercar al colédoco distal y volver.
  const z = tramo(t, 0.45, 0.53) * (1 - tramo(t, 0.64, 0.71));
  const ease = z * z * (3 - 2 * z);
  const vb = VISTA.map((v, j) => lerp(v, ZOOM[j], ease));
  const e = vb[2] / ANCHO_VISOR; // unidades de imagen por píxel de pantalla
  const rotulo = (x, y, texto, color, ancla = "start", op = 1) =>
    `<text x="${x}" y="${y}" font-size="${14 * e}" font-weight="800" fill="${color}" text-anchor="${ancla}" opacity="${op}" stroke="#000" stroke-width="${3.5 * e}" paint-order="stroke">${texto}</text>`;
  let s = `<image href="${IMG}" x="0" y="0" width="1094" height="1012"/>`;
  s += TAPAS.map((p) => `<polygon points="${p}" fill="#000"/>`).join("");
  // Paso 1: brillo de la bilis (un velo teal sobre lo blanco).
  const velo = tramo(t, 0.02, 0.06) * (1 - tramo(t, 0.10, 0.13));
  if (velo > 0) s += `<rect x="0" y="0" width="1094" height="1012" fill="#18B9A9" opacity="${0.28 * velo}" style="mix-blend-mode:multiply"/>`;
  // Paso 2: vesícula y sus cálculos.
  const uVes = tramo(t, 0.13, 0.19);
  s += trazo(VESICULA, "#18B9A9", 4 * e, uVes, L.ves);
  if (uVes >= 1) s += `<path d="${VESICULA}" fill="#18B9A9" opacity="${0.18 * (1 - tramo(t, 0.44, 0.48))}"/>`;
  CALCULOS_VES.forEach(([x, y], j) => {
    const u = tramo(t, 0.19 + j * 0.015, 0.21 + j * 0.015);
    if (u > 0) s += `<circle cx="${x}" cy="${y}" r="${(9 + 8 * (1 - u)) }" fill="none" stroke="#FDE047" stroke-width="${2.2 * e}" opacity="${u}"/>`;
  });
  if (k >= 2) s += rotulo(150, 205, "vesícula: cálculos", "#5EEAD4", "start", tramo(t, 0.15, 0.19));
  // Paso 3: vía biliar principal y cístico.
  const uCol = tramo(t, 0.29, 0.40);
  s += trazo(COLEDOCO, "#84CC16", 9 * e, uCol, L.col, `opacity=".55"`);
  s += trazo(CISTICO, "#A3E635", 4 * e, tramo(t, 0.37, 0.42), L.cis, `opacity=".7"`);
  if (k >= 3) {
    s += rotulo(470, 335, "hepático común", "#BEF264", "start", tramo(t, 0.31, 0.34));
    s += rotulo(474, 600, "colédoco", "#BEF264", "end", tramo(t, 0.36, 0.39));
    s += rotulo(372, 470, "cístico", "#D9F99D", "end", tramo(t, 0.40, 0.42));
  }
  // Paso 4: cálculos del colédoco distal (latido).
  if (k >= 4) {
    const late = 1 + 0.12 * Math.sin((t - 0.44) * 90);
    const op = tramo(t, 0.50, 0.53);
    s += `<ellipse cx="421" cy="720" rx="${36 * late}" ry="${20 * late}" transform="rotate(-55 421 720)" fill="#EF5454" fill-opacity=".14" stroke="#EF5454" stroke-width="${3 * e}" opacity="${op}"/>`;
    if (z > 0.5) {
      s += rotulo(500, 815, "cálculos", "#FCA5A5", "middle", op);
      s += rotulo(500, 815 + 17 * e, "(huecos oscuros)", "#FCA5A5", "middle", op);
    } else s += rotulo(456, 772, "cálculos", "#FCA5A5", "start", tramo(t, 0.68, 0.71));
  }
  // Paso 5: conducto pancreático y duodeno.
  s += trazo(PANCREAS, "#F2A23A", 4 * e, tramo(t, 0.70, 0.78), L.pan, `opacity=".85"`);
  if (k >= 5) {
    const op = tramo(t, 0.74, 0.78);
    s += `<ellipse cx="338" cy="805" rx="28" ry="70" transform="rotate(-35 338 805)" fill="#4F8CF6" fill-opacity=".22" stroke="#93C5FD" stroke-width="${2.5 * e}" stroke-dasharray="${8 * e} ${5 * e}" opacity="${op}"/>`;
    s += rotulo(985, 462, "conducto pancreático", "#FCD34D", "end", op);
    s += rotulo(300, 742, "duodeno", "#BFDBFE", "end", op);
  }
  // Paso 6: conclusión.
  const fin = tramo(t, 0.84, 0.88);
  const tarjeta = fin > 0 ? `<div style="position:absolute;left:14px;right:14px;bottom:14px;opacity:${fin};background:rgba(31,42,55,.94);color:#fff;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;line-height:1.3">
      <span style="color:#FCA5A5">Cálculo en el colédoco confirmado</span> → extraerlo por <b>CPRE</b></div>` : "";
  const lista = PASOS.map(([, txt], j) => `<div class="p ${j + 1 < k ? "hecho" : j + 1 === k ? "ya" : ""}"><div class="n">${j + 1}</div><div>${txt}</div></div>`).join("");
  lienzo(
    "Colangio-RM: dónde está el cálculo",
    "Imagen real, recorrida paso a paso",
    `<div class="fila">
       <div class="visor" style="position:relative"><svg width="390" height="416" viewBox="${vb.join(" ")}" preserveAspectRatio="xMidYMid slice">${s}</svg>${tarjeta}</div>
       <div class="pasos">${lista}</div>
     </div>`,
    "Imagen: Hellerhoff, Wikimedia Commons, CC BY-SA 3.0. Editada por Empirica (flechas originales tapadas; trazos, rótulos y zoom añadidos)."
  );
};
window.cuadro(0, 1);
</script></body></html>
