<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="anatomia.js"></script>
<style>
  .cols{display:flex;gap:10px;flex:1}
  .col{flex:1;min-width:0;border-radius:14px;background:#F7F8FA;padding:8px;display:flex;flex-direction:column;gap:5px}
  .col h3{font-size:14.5px}
  .col h3 small{display:block;font-size:11px;color:var(--suave);font-weight:700}
  .col svg{background:#fff;border-radius:10px}
  .pt{font-size:12px;line-height:1.3;background:#fff;border-radius:8px;padding:5px 8px}
  .nota{background:#FEF3E2;color:#92400e;border-radius:10px;padding:7px 12px;font-size:12.5px;line-height:1.35}
</style></head><body>
<script>
const base = (extra, encima = "") => `<svg viewBox="0 0 240 260" width="196" height="190">${estomago()}${duodeno()}${higado()}${viaBiliar()}${vesicula(78, 134, calculos([[78, 150, 6], [70, 160, 5]]))}${extra}${encima}</svg>`;

// 1. Percutánea transhepática: catéter desde la piel, a través del hígado, hasta la vesícula.
const ptgbd = base(
  `<line x1="2" y1="40" x2="2" y2="250" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="6 4"/>
   <path d="M-10 70 L30 92 L66 118" fill="none" stroke="#1F2A37" stroke-width="3.5"/>
   <circle cx="72" cy="124" r="7" fill="none" stroke="#1F2A37" stroke-width="3"/>`,
  rotulo(6, 36, "piel") + rotulo(40, 70, "hígado", "start", "#fff") + rotulo(60, 190, "vesícula"));

// 2. USE: stent de aposición luminal (LAMS) entre el bulbo duodenal y la vesícula.
const eus = base(
  `<path d="M238 112 Q204 160 146 176" fill="none" stroke="#1F2A37" stroke-width="11" stroke-linecap="round"/>
   <g transform="rotate(45 113 165)">
     <rect x="95" y="160" width="36" height="10" rx="3" fill="#9CA3AF" stroke="#4B5563" stroke-width="1.5"/>
     <rect x="91" y="153" width="7" height="24" rx="3" fill="#6B7280"/><rect x="128" y="153" width="7" height="24" rx="3" fill="#6B7280"/>
   </g>`,
  rotulo(150, 222, "duodeno") + rotulo(236, 108, "ecoendoscopio", "end") + rotulo(30, 190, "vesícula"));

// 3. Transpapilar: por la papila, colédoco y cístico hasta la vesícula.
const etgbd = base(
  `<path d="M184 196 Q160 200 132 204" fill="none" stroke="#1F2A37" stroke-width="11" stroke-linecap="round"/>
   <path d="M126 202 Q131 176 130 150 L129 126 Q112 118 96 110 L84 128" fill="none" stroke="#4F8CF6" stroke-width="3"/>
   <circle cx="82" cy="134" r="6" fill="none" stroke="#4F8CF6" stroke-width="3"/>`,
  rotulo(138, 222, "papila") + rotulo(136, 140, "colédoco") + rotulo(60, 190, "vesícula"));

lienzo(
  "Drenaje vesicular: tres vías",
  "Para la colecistitis que no tolera la cirugía o no responde al tratamiento médico",
  `<div class="cols">
     <div class="col"><h3>Percutánea transhepática<small>PTGBD · colecistostomía</small></h3>${ptgbd}
       <div class="pt"><b>Estándar</b> en el paciente de alto riesgo quirúrgico (TG18).</div>
       <div class="pt">Cultivo de la bilis al drenar.</div></div>
     <div class="col"><h3>Transmural guiada por USE<small>EUS-GBD con stent metálico (LAMS)</small></h3>${eus}
       <div class="pt">Preferida sobre la transpapilar con endoscopista experto (WSES).</div>
       <div class="pt">Retirar el stent metálico en <b>≤4 semanas</b>.</div></div>
     <div class="col"><h3>Endoscópica transpapilar<small>ETGBD: sonda nasovesicular o stent</small></h3>${etgbd}
       <div class="pt">Alternativa en centros de alto volumen.</div>
       <div class="pt">Sonda o stent según el paciente y el endoscopista.</div></div>
   </div>
   <div class="nota">Después del drenaje: colecistectomía laparoscópica diferida cuando baje el riesgo; sin ella, <b>49 %</b> reingresa en 1 año (WSES).</div>`,
  "Esquema. Fuente: Guías de Tokio 2018 (Mori et al., Q1-Q2); WSES 2020 (recomendaciones 6.4-6.9)."
);
</script></body></html>
