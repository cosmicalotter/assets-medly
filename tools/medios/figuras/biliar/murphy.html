<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:14px;flex:1}
  .cuerpo{width:330px;flex:none;border-radius:14px;background:#F7F8FA}
  .lado{flex:1;display:flex;flex-direction:column;gap:8px}
  .paso{background:#1F2A37;color:#fff;border-radius:10px;padding:8px 10px;font-size:14.5px;font-weight:700;line-height:1.3;min-height:62px;display:flex;align-items:center}
  .graf{background:#F7F8FA;border-radius:12px;padding:6px}
  .graf h4{font-size:12.5px;color:var(--suave);margin:2px 4px 4px}
  .resul{border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;background:#F3F4F6}
</style></head><body>
<script>
// Signo de Murphy, vista frontal (el lado derecho del paciente queda a la izquierda).
const PASOS = [
  [0.00, "1 · Presionar con los dedos el hipocondrio derecho, bajo el reborde costal"],
  [0.30, "2 · Pedir una inspiración profunda sin soltar"],
  [0.62, "3 · La vesícula inflamada baja, choca con la mano y el dolor corta la inspiración: Murphy positivo"],
];
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.8;
  const k = PASOS.filter(([a]) => t >= a).length;
  const presiona = tramo(t, 0.04, 0.24);
  const inspira = tramo(t, 0.32, 0.62);        // inspiración hasta el choque
  const corta = t >= 0.62;
  const baja = 22 * inspira;                    // descenso del hígado y la vesícula
  const expande = 6 * inspira;
  let s = `<path d="M70 30 Q60 120 ${66 - expande} 230 Q70 330 90 390 L240 390 Q260 330 ${264 + expande} 230 Q270 120 260 30 Z" fill="#F3D2C1" stroke="#D9A88F" stroke-width="3"/>`;
  // Hígado y vesícula (debajo de las costillas).
  s += `<g transform="translate(0,${baja})"><path d="M78 120 Q150 96 236 130 Q214 186 160 196 Q110 206 82 190 Z" fill="#B5654D" opacity=".55"/>
        <ellipse cx="128" cy="204" rx="15" ry="22" fill="${corta ? "#EF5454" : "#9CC66B"}" stroke="#5E8C2E" stroke-width="2.5" transform="rotate(-18 128 204)"/></g>`;
  // Reborde costal.
  s += `<path d="M86 150 Q120 214 165 176 Q210 214 244 150" fill="none" stroke="#9C6B57" stroke-width="4" stroke-linecap="round"/>`;
  s += `<line x1="165" y1="60" x2="165" y2="176" stroke="#C99A85" stroke-width="2" stroke-dasharray="5 4"/>`;
  // Mano: cuatro dedos bajo el reborde costal derecho.
  const hy = 242 - 12 * presiona;
  s += `<g transform="translate(0,${hy})">${[0, 1, 2, 3].map((j) => `<rect x="${92 + j * 15}" y="0" width="13" height="58" rx="6.5" fill="#E9B48F" stroke="#B9805D" stroke-width="2"/>`).join("")}
        <rect x="84" y="46" width="76" height="70" rx="18" fill="#E9B48F" stroke="#B9805D" stroke-width="2"/></g>`;
  if (presiona > 0 && !corta) s += `<path d="M126 ${hy + 128} l0 -22 m0 0 l-8 10 m8 -10 l8 10" stroke="#F2A23A" stroke-width="4" fill="none"/>`;
  if (inspira > 0 && !corta) s += `<text x="232" y="${300}" font-size="15" font-weight="800" fill="#4F8CF6" text-anchor="middle">inspira</text><path d="M232 312 l0 22 m0 0 l-7 -9 m7 9 l7 -9" stroke="#4F8CF6" stroke-width="3.5" fill="none"/>`;
  if (corta) s += `<g transform="translate(180,226)"><path d="M0 -18 L7 -6 L20 -9 L11 2 L20 14 L6 10 L0 22 L-6 10 L-20 14 L-11 2 L-20 -9 L-7 -6 Z" fill="#EF5454"/><text x="26" y="7" font-size="17" font-weight="800" fill="#EF5454">¡ay!</text></g>`;
  s += `<text x="20" y="22" font-size="12" font-weight="700" fill="#9CA3AF">derecha</text><text x="310" y="22" font-size="12" font-weight="700" fill="#9CA3AF" text-anchor="end">izquierda</text>`;
  // Curva respiratoria: normal frente a la que se corta.
  const X = (u) => 12 + 300 * u, Y = (v) => 118 - 92 * v;
  const normal = [...Array(41)].map((_, j) => { const u = j / 40; return `${X(u)},${Y(Math.sin(Math.PI * u))}`; }).join(" ");
  const uAhora = Math.min(1, Math.max(0, (t - 0.32) / 0.6));
  const real = [...Array(41)].map((_, j) => { const u = j / 40; if (u > uAhora) return null;
    const v = u < 0.36 ? Math.sin(Math.PI * u) : Math.sin(Math.PI * 0.36) - 0.05 * (u - 0.36); return `${X(u)},${Y(v)}`; }).filter(Boolean).join(" ");
  const grafica = `<svg viewBox="0 0 324 130" width="100%" height="130">
      <line x1="12" y1="118" x2="312" y2="118" stroke="#D1D5DB"/>
      <polyline points="${normal}" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="6 5"/>
      ${real ? `<polyline points="${real}" fill="none" stroke="${corta ? "#EF5454" : "#18B9A9"}" stroke-width="4" stroke-linecap="round"/>` : ""}
      <text x="250" y="22" font-size="11.5" font-weight="700" fill="#9CA3AF">esperada</text>
      ${corta ? `<text x="${X(0.55)}" y="64" font-size="12.5" font-weight="800" fill="#EF5454" text-anchor="middle">se corta por el dolor</text>` : ""}</svg>`;
  lienzo(
    "Signo de Murphy",
    "Específico de la colecistitis aguda: criterio A de Tokio",
    `<div class="fila">
       <svg class="cuerpo" viewBox="0 0 330 400">${s}</svg>
       <div class="lado">
         <div class="paso">${PASOS[k - 1][1]}</div>
         <div class="graf"><h4>Inspiración (volumen en el tiempo)</h4>${grafica}</div>
         <div class="resul">Murphy <b>ecográfico</b>: el mismo dolor al presionar la vesícula con el transductor.</div>
         <div class="resul">Murphy solo no basta: se suma a la fiebre, la PCR o los leucocitos y a la imagen.</div>
       </div></div>`,
    "Esquema. Fuente: Guías de Tokio 2018 (Miura et al., signo de Murphy y Murphy ecográfico; Yokoe et al., Tabla 1)."
  );
};
window.cuadro(0, 1);
</script></body></html>
