<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:14px;flex:1}
  .eco{width:400px;flex:none;border-radius:14px;background:#0b0d10;display:flex;flex-direction:column;align-items:center;padding:6px}
  .lista{flex:1;display:flex;flex-direction:column;gap:7px}
  .h{display:flex;gap:8px;align-items:flex-start;background:#F7F8FA;border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.3;color:#9CA3AF}
  .h .n{width:22px;height:22px;border-radius:7px;background:#E5E7EB;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .h.on{color:var(--tinta);background:#E8F7F5}
  .h.on .n{background:var(--teal)}
  .h.ya{color:var(--tinta)}
  .h.ya .n{background:#9CA3AF}
  .paso{background:#1F2A37;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700;text-align:center;width:100%}
</style></head><body>
<script>
// Ecografía esquemática de la vesícula en eje largo (no es un paciente real).
const AX = 200, AY = 14, R = 340, A1 = 42, A2 = 138;   // abanico del transductor convexo
const rad = (g) => (g * Math.PI) / 180;
const pf = (a, r) => [AX + r * Math.cos(rad(a)), AY + r * Math.sin(rad(a))];
const abanico = (() => {
  const [x1, y1] = pf(A2, R), [x2, y2] = pf(A1, R), [x3, y3] = pf(A1, 30), [x4, y4] = pf(A2, 30);
  return `M${x4} ${y4} L${x1} ${y1} A${R} ${R} 0 0 0 ${x2} ${y2} L${x3} ${y3} A30 30 0 0 1 ${x4} ${y4} Z`;
})();
// Moteado fijo (semilla) para el parénquima.
let s = 7; const azar = () => (s = (s * 16807) % 2147483647) / 2147483647;
let moteado = "";
for (let i = 0; i < 520; i++) {
  const x = 40 + azar() * 320, y = 40 + azar() * 300, g = 70 + Math.floor(azar() * 70);
  moteado += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1 + azar() * 1.6).toFixed(1)}" fill="rgb(${g},${g},${g})"/>`;
}
const GX = 200, GY = 190, GRX = 112, GRY = 50;           // vesícula
const PIEDRAS = [[236, 228, 13], [266, 222, 10], [212, 232, 9]];
const PASOS = [
  [0.00, "Vesícula distendida", "Eje largo <b>≥8 cm</b>, eje corto <b>≥4 cm</b>"],
  [0.20, "Pared engrosada", "Pared <b>≥4 mm</b>, a veces con capa hipoecoica"],
  [0.40, "Cálculos o detritos", "Ecogénicos, con sombra acústica posterior"],
  [0.58, "Líquido perivesicular", "Banda anecoica alrededor de la pared"],
  [0.74, "Murphy ecográfico", "Dolor al presionar la vesícula con el transductor"],
];
function cota(x1, y1, x2, y2, txt, tx, ty) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FDE047" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="${x1}" cy="${y1}" r="3.5" fill="#FDE047"/><circle cx="${x2}" cy="${y2}" r="3.5" fill="#FDE047"/>
    <text x="${tx}" y="${ty}" font-size="14" font-weight="800" fill="#FDE047" text-anchor="middle">${txt}</text>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.9;
  const k = PASOS.filter(([a]) => t >= a).length;          // paso activo (1-5)
  const empuje = k === 5 ? 8 * Math.abs(Math.sin(t * 28)) : 0;
  let g = `<defs><clipPath id="ab"><path d="${abanico}"/></clipPath></defs>
    <path d="${abanico}" fill="#3a3a3a"/>
    <g clip-path="url(#ab)" transform="translate(0,${empuje * 0.5})">${moteado}
      <rect x="0" y="40" width="400" height="80" fill="#8a8a8a" opacity=".25"/>
      <!-- líquido perivesicular -->
      <path d="M${GX - GRX - 4} ${GY + 18} Q${GX - 60} ${GY + GRY + 34} ${GX + 40} ${GY + GRY + 22} Q${GX - 40} ${GY + GRY + 10} ${GX - GRX + 6} ${GY + 8} Z" fill="#050505" opacity="${k >= 4 ? 1 : 0.85}"/>
      <!-- pared: ecogénica externa, hipoecoica media, ecogénica interna -->
      <ellipse cx="${GX}" cy="${GY}" rx="${GRX + 11}" ry="${GRY + 11}" fill="#d9d9d9"/>
      <ellipse cx="${GX}" cy="${GY}" rx="${GRX + 7}" ry="${GRY + 7}" fill="#4a4a4a"/>
      <ellipse cx="${GX}" cy="${GY}" rx="${GRX + 3}" ry="${GRY + 3}" fill="#bdbdbd"/>
      <ellipse cx="${GX}" cy="${GY}" rx="${GRX}" ry="${GRY}" fill="#060606"/>
      <!-- sombras acústicas y cálculos -->
      ${PIEDRAS.map(([x, y, r]) => `<path d="M${x - r} ${y} L${x - r - 8} 360 L${x + r + 8} 360 L${x + r} ${y} Z" fill="#070707" opacity=".9"/>`).join("")}
      ${PIEDRAS.map(([x, y, r]) => `<path d="M${x - r} ${y + 2} A${r} ${r} 0 0 1 ${x + r} ${y + 2}" fill="none" stroke="#f5f5f5" stroke-width="7"/>`).join("")}
    </g>
    <path d="${abanico}" fill="none" stroke="#555" stroke-width="1"/>`;
  // Resaltados de cada paso.
  if (k === 1) g += cota(GX - GRX, GY, GX + GRX, GY, "eje largo ≥8 cm", GX, GY - 10) + cota(GX + 70, GY - GRY, GX + 70, GY + GRY, "≥4 cm", GX + 70, GY - GRY - 18);
  if (k === 2) g += cota(GX - 40, GY - GRY - 11, GX - 40, GY - GRY, "", 0, 0) + `<text x="${GX - 40}" y="${GY - GRY - 18}" font-size="14" font-weight="800" fill="#FDE047" text-anchor="middle">pared ≥4 mm</text>`;
  if (k === 3) g += PIEDRAS.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="#FDE047" stroke-width="2.5"/>`).join("") + `<text x="300" y="300" font-size="14" font-weight="800" fill="#FDE047" text-anchor="middle">sombra</text>`;
  if (k === 4) g += `<path d="M${GX - GRX - 4} ${GY + 18} Q${GX - 60} ${GY + GRY + 34} ${GX + 40} ${GY + GRY + 22}" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${GX - 70}" y="${GY + GRY + 50}" font-size="14" font-weight="800" fill="#FDE047" text-anchor="middle">líquido</text>`;
  // Transductor.
  const py = AY + 22 + empuje;
  g += `<rect x="${AX - 44}" y="${py - 22}" width="88" height="26" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><rect x="${AX - 14}" y="${py - 46}" width="28" height="26" rx="6" fill="#94a3b8"/>`;
  if (k === 5) g += `<g transform="translate(${AX + 70},${py + 2})"><path d="M0 -16 L6 -5 L18 -8 L10 2 L18 12 L5 9 L0 20 L-5 9 L-18 12 L-10 2 L-18 -8 L-6 -5 Z" fill="#EF5454"/><text x="26" y="6" font-size="15" font-weight="800" fill="#EF5454">¡dolor!</text></g>`;
  lienzo(
    "Ecografía de la colecistitis aguda",
    "Primer estudio de imagen: barato, rápido y sin radiación",
    `<div class="fila">
      <div class="eco"><svg viewBox="0 -50 400 410" width="388" height="396">${g}</svg></div>
      <div class="lista">
        <div class="paso">${PASOS[k - 1][1]}</div>
        ${PASOS.map(([, tit, det], j) => `<div class="h ${j === k - 1 ? "on" : j < k - 1 ? "ya" : ""}"><span class="n">${j + 1}</span><span><b>${tit}</b><br>${det}</span></div>`).join("")}
      </div></div>`,
    "Esquema, no un paciente real. Fuente: Guías de Tokio 2018 (Yokoe et al., hallazgos de imagen; Miura et al., Murphy ecográfico)."
  );
};
window.cuadro(0, 1);
</script></body></html>
