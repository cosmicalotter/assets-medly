<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:12px;flex:1;min-height:0}
  .visor{position:relative;width:390px;height:416px;border-radius:14px;overflow:hidden;background:#111;flex:none}
  .lado{flex:1;display:flex;flex-direction:column;gap:6px}
  .p{display:flex;gap:8px;align-items:center;border-radius:10px;padding:6px 9px;background:#F3F4F6;font-size:12.5px;line-height:1.25;color:#9CA3AF}
  .p .n{width:21px;height:21px;border-radius:7px;background:#D1D5DB;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .p.hecho{color:var(--tinta)} .p.hecho .n{background:var(--suave)}
  .p.ya{background:#1F2A37;color:#fff;font-weight:700} .p.ya .n{background:var(--teal)}
  .medidor{background:#F7F8FA;border-radius:10px;padding:8px 10px;font-size:12px}
  .medidor .barra{position:relative;height:16px;border-radius:8px;background:#E5E7EB;margin-top:5px;overflow:hidden}
  .medidor .esperada{position:absolute;inset:0;border:2px dashed #9CA3AF;border-radius:8px}
  .medidor .llena{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
</style></head><body>
<script>
// Foto real de dominio público (Musser, "A practical treatise on medical diagnosis", 1904:
// palpación del hipocondrio derecho con el pulgar bajo el reborde costal), editada por
// Empirica: tono neutro, reborde costal y línea medioclavicular, foco en el pulgar y
// medidor de inspiración que se corta con el dolor.
const IMG = "fuentes/palpacion_hipocondrio_1904.jpg"; // 800 × 980
const PASOS = [
  [0.00, "Dónde: bajo el <b>reborde costal derecho</b>"],
  [0.15, "En la <b>línea medioclavicular</b> derecha"],
  [0.30, "Presionar con los dedos o el pulgar, sin soltar"],
  [0.46, "Pedir una <b>inspiración profunda</b>"],
  [0.63, "El dolor <b>corta la inspiración</b>: Murphy positivo"],
  [0.80, "Murphy solo no basta: se suma a la inflamación y a la imagen"],
];
const VISTA = [35, 120, 731, 780], ZOOM = [95, 390, 300, 320];
const REBORDE = "M402 428 C352 452 302 476 264 505 C230 531 202 553 168 574";
const PUNTO = [233, 541], PULGAR = [240, 566];

window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.7;
  const k = PASOS.filter(([a]) => t >= a).length;
  const z = tramo(t, 0.31, 0.38) * (1 - tramo(t, 0.80, 0.86));
  const ease = z * z * (3 - 2 * z);
  const vb = VISTA.map((v, j) => lerp(v, ZOOM[j], ease));
  const e = vb[2] / 390;
  const rot = (x, y, txt, col, ancla = "start", op = 1, tam = 14) =>
    `<text x="${x}" y="${y}" font-size="${tam * e}" font-weight="800" fill="${col}" text-anchor="${ancla}" opacity="${op}" stroke="#111" stroke-width="${3.5 * e}" paint-order="stroke">${txt}</text>`;
  let s = `<image href="${IMG}" x="0" y="0" width="800" height="980" style="filter:grayscale(1) contrast(1.12) brightness(1.05)"/>`;
  // Foco: oscurecer todo menos el hipocondrio derecho desde el paso 3.
  const foco = tramo(t, 0.31, 0.37) * (1 - tramo(t, 0.86, 0.9));
  if (foco > 0) s += `<defs><radialGradient id="f" cx="${PULGAR[0]}" cy="${PULGAR[1] - 20}" r="230" gradientUnits="userSpaceOnUse">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient></defs>
      <rect x="0" y="0" width="800" height="980" fill="url(#f)" opacity="${foco}"/>`;
  // Paso 1: reborde costal.
  const uR = tramo(t, 0.02, 0.10);
  if (uR > 0) s += `<path d="${REBORDE}" fill="none" stroke="#2DD4BF" stroke-width="${4 * e}" stroke-linecap="round" stroke-dasharray="${12 * e} ${7 * e}" stroke-dashoffset="0" opacity="${uR}"/>`;
  s += rot(410, 420, "reborde costal", "#5EEAD4", "start", tramo(t, 0.06, 0.1));
  s += rot(60, 160, "derecha del paciente", "#E5E7EB", "start", tramo(t, 0.02, 0.06) * (1 - ease), 12);
  // Paso 2: línea medioclavicular y punto vesicular.
  const uL = tramo(t, 0.16, 0.24);
  if (uL > 0) s += `<line x1="233" y1="150" x2="233" y2="${lerp(150, 640, uL)}" stroke="#FDE047" stroke-width="${3 * e}" stroke-dasharray="${10 * e} ${7 * e}"/>`;
  s += rot(245, 250, "línea medioclavicular", "#FDE047", "start", tramo(t, 0.2, 0.24) * (1 - ease));
  if (k >= 2) {
    const op = tramo(t, 0.22, 0.26);
    s += `<circle cx="${PUNTO[0]}" cy="${PUNTO[1]}" r="${9}" fill="#FDE047" opacity="${op}"/>`;
    s += `<circle cx="${PUNTO[0]}" cy="${PUNTO[1]}" r="${16 + 6 * Math.sin(t * 60)}" fill="none" stroke="#FDE047" stroke-width="${2.5 * e}" opacity="${op * 0.8}"/>`;
  }
  // Paso 3: el pulgar presiona.
  if (k >= 3) {
    const op = tramo(t, 0.34, 0.39);
    const empuje = 6 * Math.sin(Math.min(1, tramo(t, 0.36, 0.44)) * Math.PI);
    s += `<path d="M${PULGAR[0] - 70} ${PULGAR[1] + 62 - empuje} L${PULGAR[0] - 18} ${PULGAR[1] + 14 - empuje}" stroke="#2DD4BF" stroke-width="${5 * e}" stroke-linecap="round" opacity="${op}"/>
          <path d="M${PULGAR[0] - 18} ${PULGAR[1] + 14 - empuje} l${-16 * e} ${2 * e} m${16 * e} ${-2 * e} l${-2 * e} ${16 * e}" stroke="#2DD4BF" stroke-width="${5 * e}" stroke-linecap="round" fill="none" opacity="${op}"/>`;
    s += rot(PULGAR[0] - 72, PULGAR[1] + 92, "presionar", "#5EEAD4", "middle", op);
  }
  // Paso 4-5: inspiración; el diafragma empuja la vesícula contra la mano.
  const insp = k >= 4 ? Math.min(tramo(t, 0.47, 0.6), k >= 5 ? 1 : 1) : 0;
  if (k >= 4) {
    const op = tramo(t, 0.47, 0.5);
    const dy = 22 * Math.min(insp, 0.45 / 0.45);
    s += `<path d="M${PUNTO[0] + 50} ${PUNTO[1] - 70 + dy * 0.4} l0 ${30} m${-9} ${-12} l9 12 l9 -12" stroke="#93C5FD" stroke-width="${4 * e}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
    s += rot(PUNTO[0] + 64, PUNTO[1] - 44, "inspira", "#BFDBFE", "start", op);
  }
  if (k >= 5) {
    const op = tramo(t, 0.64, 0.67);
    const pulso = 1 + 0.15 * Math.sin(t * 70);
    s += `<circle cx="${PULGAR[0]}" cy="${PULGAR[1] - 18}" r="${34 * pulso}" fill="#EF5454" fill-opacity=".22" stroke="#EF5454" stroke-width="${3.5 * e}" opacity="${op}"/>`;
    s += rot(PULGAR[0] + 46, PULGAR[1] - 8, "¡dolor!", "#FCA5A5", "start", op, 17);
  }
  // Medidor de inspiración (lado derecho).
  const nivel = k < 4 ? 0 : k === 4 ? 0.45 * tramo(t, 0.47, 0.6) / 1 : 0.45;
  const color = k >= 5 ? "#EF5454" : "#4F8CF6";
  const medidor = `<div class="medidor"><b>Inspiración</b> ${k >= 5 ? "· <b style=\"color:#EF5454\">se corta por el dolor</b>" : k >= 4 ? "· profunda" : ""}
     <div class="barra"><div class="esperada"></div><div class="llena" style="width:${Math.round(nivel * 100)}%;background:${color}"></div></div></div>`;
  const fin = tramo(t, 0.84, 0.88);
  const tarjeta = fin > 0 ? `<div style="position:absolute;left:12px;right:12px;bottom:12px;opacity:${fin};background:rgba(31,42,55,.95);color:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;line-height:1.3">
      <span style="color:#5EEAD4">Murphy ecográfico</span>: el mismo dolor al presionar la vesícula con el transductor.</div>` : "";
  const lista = PASOS.map(([, txt], j) => `<div class="p ${j + 1 < k ? "hecho" : j + 1 === k ? "ya" : ""}"><div class="n">${j + 1}</div><div>${txt}</div></div>`).join("");
  lienzo(
    "Signo de Murphy",
    "Específico de la colecistitis aguda: criterio A de Tokio",
    `<div class="fila"><div class="visor"><svg width="390" height="416" viewBox="${vb.join(" ")}" preserveAspectRatio="xMidYMid slice">${s}</svg>${tarjeta}</div>
       <div class="lado">${lista}${medidor}</div></div>`,
    "Foto: Musser, 1904 (dominio público), editada por Empirica. Fuente: Guías de Tokio 2018 (Yokoe et al., Tabla 1; Miura et al.)."
  );
};
window.cuadro(0, 1);
</script></body></html>
