<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="mapa_comun.js"></script></head><body><script>
// MinSalud 2016 (p. 50): número de controles al año de la TFG y la albuminuria.
const N = [["1*", "1", "2"], ["1*", "1", "2"], ["1", "2", "3"], ["2", "3", "3"], ["3", "3", "4+"], ["4+", "4+", "4+"]];
lienzo("Controles por año según la TFG y la albuminuria", "Veces al año que se miden la TFGe y la RACU en cada casilla.",
  mapa((i, j) => N[i][j]) + `<div class="item" style="background:#F7F8FA;font-size:12.5px"><b>1*</b>: una vez al año <b>si hay ERC</b> (algún marcador de daño). Más a menudo si el resultado <b>cambia el tratamiento</b>.</div>`,
  FUENTE("MinSalud 2016, recomendación 17 (p. 50); KDIGO 2024, PP 2.1.1-2.1.2 (S155)"));
</script></body></html>
