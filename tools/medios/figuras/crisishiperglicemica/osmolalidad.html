<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// EHH: la osmolalidad debe bajar 3-8 mOsm/kg/h (JBDS 2022, p. 15-16; ADA 2024, p. 1265). Curva ilustrativa.
const W = 668, H = 300, X0 = 54, X1 = 650, Y0 = 262, Y1 = 14, TMAX = 12, OMIN = 280, OMAX = 370, O0 = 360;
const x = (t) => X0 + (X1 - X0) * t / TMAX;
const y = (o) => Y0 - (Y0 - Y1) * (o - OMIN) / (OMAX - OMIN);
const lin = (r) => { const t2 = Math.min(TMAX, (O0 - OMIN) / r); return `${x(0)},${y(O0)} ${x(t2)},${y(O0 - r * t2)}`; };
const p3 = [[0, O0], [TMAX, O0 - 3 * TMAX]], p8end = Math.min(TMAX, (O0 - OMIN) / 8);
const banda = `<polygon points="${x(0)},${y(O0)} ${x(TMAX)},${y(O0 - 3 * TMAX)} ${x(TMAX)},${y(OMIN)} ${x(p8end)},${y(OMIN)}" fill="${tinte(VERDE, 20)}"/>`;
const lenta = `<polygon points="${x(0)},${y(O0)} ${x(0)},${y(OMAX)} ${x(TMAX)},${y(OMAX)} ${x(TMAX)},${y(O0 - 3 * TMAX)}" fill="${tinte(AMBAR, 16)}"/>`;
const rapida = `<polygon points="${x(0)},${y(O0)} ${x(p8end)},${y(OMIN)} ${x(0)},${y(OMIN)}" fill="${tinte(ROJO, 14)}"/>`;
const curva = (() => { let d = ""; for (let t = 0; t <= TMAX + 1e-6; t += 0.25) { const o = O0 - 5 * t - 1.2 * Math.sin(t * 1.3); d += `${d ? "L" : "M"}${x(t).toFixed(1)},${y(o).toFixed(1)}`; } return d; })();
const ejeX = [0, 2, 4, 6, 8, 10, 12].map((t) => `<line x1="${x(t)}" y1="${Y0}" x2="${x(t)}" y2="${Y0 + 5}" stroke="#9CA3AF"/><text x="${x(t)}" y="${Y0 + 18}" font-size="11" text-anchor="middle" fill="#6B7280">${t} h</text>`).join("");
const ejeY = [280, 300, 320, 340, 360].map((o) => `<text x="${X0 - 6}" y="${y(o) + 4}" font-size="11" text-anchor="end" fill="#6B7280">${o}</text>`).join("");
const r300 = `<line x1="${X0}" y1="${y(300)}" x2="${X1}" y2="${y(300)}" stroke="#334155" stroke-dasharray="5 4"/><text x="${x(0.25)}" y="${y(300) - 5}" font-size="11" font-weight="700" fill="#334155">Resolución: &lt;300 mOsm/kg</text>`;
const rot = `<text x="${x(7.4)}" y="${y(352)}" font-size="13" font-weight="700" fill="#B45309">Baja &lt;3 mOsm/kg/h o sube</text>
  <text x="${x(1.6)}" y="${y(287)}" font-size="13" font-weight="700" fill="#B91C1C">Baja &gt;8 mOsm/kg/h</text>
  <text x="${x(9.1)}" y="${y(290.5)}" font-size="12.5" font-weight="700" fill="#166534">Meta: 3-8 mOsm/kg/h</text>`;
const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${lenta}${banda}${rapida}${r300}
  <line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="#9CA3AF"/><line x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" stroke="#9CA3AF"/>
  ${ejeX}${ejeY}<text x="14" y="${(Y0 + Y1) / 2}" font-size="11" fill="#6B7280" transform="rotate(-90 14 ${(Y0 + Y1) / 2})" text-anchor="middle">mOsm/kg</text>
  <path d="${curva}" fill="none" stroke="${MORADO}" stroke-width="4" stroke-linecap="round"/>${rot}</svg>`;
const notas = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
  <div class="caja" style="background:${tinte(AMBAR, 12)};border:1px solid ${tinte(AMBAR, 50)}"><b>Lenta</b>: si el balance es escaso, más solución salina 0,9 %; si es adecuado, insulina si la glucosa se estanca, o 0,45 % si la osmolalidad sube.</div>
  <div class="caja" style="background:${tinte(ROJO, 10)};border:1px solid ${tinte(ROJO, 40)}"><b>Rápida</b>: reducir los líquidos IV y, si ya va, la insulina.</div></div>`;
lienzo("EHH: la osmolalidad tiene que bajar despacio", "Medirla cada hora las primeras 6 h y comparar su ritmo con la franja verde", svg + notas,
  "Esquema ilustrativo, no datos de un paciente. Fuente: JBDS 2022 (EHH), p. 15-16; ADA/EASD/JBDS/AACE/DTS 2024.");
</script></body></html>
