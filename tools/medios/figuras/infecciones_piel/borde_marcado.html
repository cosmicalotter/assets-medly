<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// GIF sobre una foto real (John Campbell, Wikimedia Commons, CC0): celulitis de la pierna con el borde del eritema marcado con
// rotulador. NICE NG141 (1.1.3 y 1.1.9): marcar la extensión para vigilar la evolución; revaluar si el eritema pasa la marca
// (algo de extensión inicial es esperable) o si no mejora a los 2-3 días; en la piel oscura el eritema se ve menos.
const SRC = "fuentes/commons_Cellulitis_leg_(44699140442).jpg", W = 1280, H = 960;
const LINEA = [[197,390],[165,405],[125,435],[110,465],[112,490],[130,510],[165,522],[185,540],[192,565],[200,587],[225,600],[260,625],[280,645],[300,662],[345,685],[365,697],[360,710],[352,717]];
const largo = LINEA.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - LINEA[i][0], p[1] - LINEA[i][1]), 0);
const AM = "#FDE047";
const PASOS = [
  [0.0, "Celulitis de la pierna", "Eritema, edema y calor; el borde se marca <b>al inicio</b>"],
  [0.22, "Marcar el borde", "Con un rotulador, por todo el borde del <b>eritema</b>, con fecha y hora"],
  [0.58, "Comparar en el control", "Si el eritema <b>pasa la marca</b>, la infección avanza: revaluar"],
  [0.8, "Revaluar también si…", "No mejora en <b>2-3 días</b> o hay dolor desproporcionado"],
];
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const z = suave(tramo(t, 0.18, 0.3)) * (1 - suave(tramo(t, 0.78, 0.88)));
  const vb = [lerp(0, 0, z), lerp(280, 345, z), lerp(1280, 820, z), lerp(600, 384, z)];  // misma proporción: la imagen no cambia de alto
  const k = vb[2] / 668;                                   // píxeles de la foto por píxel de pantalla
  const traz = suave(tramo(t, 0.26, 0.56));
  const pts = LINEA.map((p) => p.join(",")).join(" ");
  const rot = suave(tramo(t, 0.56, 0.62));
  const er = suave(tramo(t, 0.6, 0.66));
  const svg = `<svg width="668" height="313" viewBox="${vb.join(" ")}" style="display:block;border-radius:12px">
    <image href="${SRC}" x="0" y="0" width="${W}" height="${H}"/>
    <polyline points="${pts}" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="${13 * k}" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="${largo}" stroke-dashoffset="${largo * (1 - traz)}"/>
    <polyline points="${pts}" fill="none" stroke="${AM}" stroke-width="${7 * k}" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="${largo}" stroke-dashoffset="${largo * (1 - traz)}"/>
    <g opacity="${rot}"><text x="230" y="420" font-size="${17 * k}" font-weight="900" fill="${AM}" stroke="#111" stroke-width="${4 * k}" paint-order="stroke">Borde marcado</text></g>
    <g opacity="${er}">${flecha(330, 520, 430, 520, "#22D3EE", 5 * k, 16 * k)}
      <text x="440" y="${520 + 6 * k}" font-size="${17 * k}" font-weight="900" fill="#22D3EE" stroke="#111" stroke-width="${4 * k}" paint-order="stroke">Eritema</text></g>
  </svg>`;
  const p = PASOS.filter((e) => t >= e[0]).length - 1;
  const lista = PASOS.map((e, j) => `<div style="flex:1;border-radius:10px;padding:7px 9px;background:${j === p ? "#1F2A37" : "#F1F5F9"};color:${j === p ? "#fff" : "#6B7280"}">
      <div style="font-size:13px;font-weight:900">${j + 1}. ${e[1]}</div>${j === p ? `<div style="font-size:12.5px;line-height:1.3;margin-top:2px"><span>${e[2]}</span></div>` : ""}</div>`).join("");
  lienzo("Marcar el borde de la celulitis", "Sirve para ver en el control si la infección avanza o retrocede",
    `<div style="display:flex;justify-content:center">${svg}</div><div style="display:flex;gap:6px;align-items:stretch">${lista}</div>`,
    "Foto: John Campbell (Wikimedia Commons, CC0), animada por Empirica. Fuente: NICE NG141, recomendaciones 1.1.3 y 1.1.9.");
};
window.cuadro(40, 60);
</script></body></html>
