<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Gravedad de la celulitis y la erisipela (IDSA 2014, fig. 1 y recs. 14 y 18, p. e11, e15 y e16; ACIN 2019, recs. 12-14,
// p. 334-335; HUN 2025, apartado H, p. 48) y el tratamiento que corresponde a cada nivel.
const filas = [
  [VERDE, "Leve", "Sin signos sistémicos ni criterios de hospitalización", ["En casa", "<b>Cefalexina</b> 5 días", "Elevar la extremidad"]],
  [NARANJA, "Moderada", "SIRS (fiebre, taquicardia o taquipnea) o un criterio de hospitalización", ["<b>Hospitalizar</b>", "<b>Oxacilina</b> o cefazolina IV", "Vancomicina si hay riesgo de <b>SAMR</b>"]],
  [ROJO, "Grave", "Falla del oral, inmunosupresión, hipotensión, ampollas o disfunción de órganos",
   ["Cirujano <b>urgente</b>: descartar necrosis", "<b>Vancomicina + piperacilina-tazobactam</b>"]],
];
const html = filas.map(([c, tit, def, items]) => `<div style="display:flex;gap:10px;flex:1">
    <div style="width:210px;flex:none;border-radius:12px;background:${c};color:#fff;padding:10px 12px;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:21px;font-weight:900">${tit}</div><div style="font-size:13.5px;line-height:1.3;margin-top:3px;font-weight:600">${def}</div></div>
    ${tarjeta(c, "Qué hacer", items)}</div>`).join("") +
  banda("La celulitis grave puede ser una <b style=\"color:#FCA5A5\">infección necrosante</b> en sus inicios: ante la duda, explorar.");
lienzo("Gravedad de la celulitis y la erisipela", "Cada nivel cambia dónde y con qué se trata",
  `<div style="display:flex;flex-direction:column;gap:9px;flex:1 0 auto">${html}</div>`,
  "Esquema. Fuente: IDSA 2014, fig. 1 y recomendaciones 14 y 18, p. e11, e15-e16; ACIN 2019, recomendaciones 12-14, p. 334-335; HUN 2025, p. 48.");
</script></body></html>
