<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Gráfico de datos: incidencia de cicatriz renal según el número de ITU febriles (EAU 2026, 12.1).
const D = [["1 ITU febril", 2.8, AMBAR], ["2 ITU febriles", 25.7, NARANJA], ["3 o más", 28.6, ROJO]];
const W = 560, H = 290, x0 = 70, y0 = 30, max = 30;
const barras = D.map(([r, v, c], k) => { const bw = 110, x = x0 + 40 + k * 160, h = (H - 50) * v / max, y = y0 + (H - 50) - h;
  return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="8" fill="${c}"/>
    <text x="${x + bw / 2}" y="${y - 10}" text-anchor="middle" font-size="22" font-weight="900" fill="${c === AMBAR ? "#B26B10" : c}">${String(v).replace(".", ",")} %</text>
    <text x="${x + bw / 2}" y="${y0 + H - 22}" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">${r}</text>`; }).join("");
const ejes = [0, 10, 20, 30].map((v) => { const y = y0 + (H - 50) * (1 - v / max);
  return `<line x1="${x0}" y1="${y}" x2="${x0 + W - 60}" y2="${y}" stroke="#E5E7EB"/><text x="${x0 - 10}" y="${y + 5}" text-anchor="end" font-size="13" fill="#6B7280">${v} %</text>`; }).join("");
lienzo("Cicatriz renal tras cada ITU febril", "Porcentaje de niños con cicatriz según cuántas ITU febriles tuvieron",
  `<div style="display:flex;justify-content:center"><svg width="${W + 40}" height="${H + 20}">${ejes}${barras}</svg></div>
   <div class="caja" style="background:#1F2A37;color:#fff;font-weight:700;font-size:14px">El salto está en la <b style="color:#FCA5A5">segunda</b>: prevenir la recurrencia y tratar <b style="color:#5EEAD4">pronto</b> cada fiebre protegen el riñón.</div>`,
  "Gráfico de Empirica con los datos de la EAU 2026 (12.1).");
</script></body></html>
