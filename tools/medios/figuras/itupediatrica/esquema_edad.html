<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="tarjetas.js"></script></head><body><script>

    ["Cultivo", "<b>≥5</b> leucocitos o esterasa <b>≥1+</b>"],

], "Urocultivo positivo: <b style='color:#5EEAD4'>≥10.000 UFC/mL</b> por sonda o <b style='color:#5EEAD4'>≥100.000 UFC/mL</b> en chorro medio, de un uropatógeno.",
