<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// GIF de flujo: qué esperar tras empezar el antibiótico (EAU 2026, 12.6.6; consenso suizo 2021, rec. 7;
// ESPID 2025; Lashkar y Nahata 2026, tabla 2; AAP 2026, KAS 2 y 4).
const H = [
  { f: 0.00, r: "0 h", c: TEAL, tit: "Día 0", txt: "<b>Urocultivo</b> y luego el <b>antibiótico</b>" },
  { f: 0.16, r: "24 h", c: CELESTE, tit: "24 horas", txt: "La orina ya está <b>estéril</b>" },
  { f: 0.30, r: "48 h", c: VERDE, tit: "24 a 48 horas", txt: "Cede la <b>fiebre</b> en 9 de cada 10" },
  { f: 0.45, r: "72 h", c: AMBAR, tit: "48 a 72 horas", txt: "<b>Revisar</b> con el cultivo y el antibiograma" },
  { f: 0.62, r: "4 d", c: MORADO, tit: "3 a 4 días", txt: "Desaparece la <b>piuria</b>; afebril ≥24 h: pasar a <b>vía oral</b>" },
  { f: 0.94, r: "Fin", c: AZUL, tit: "Fin del tratamiento", txt: "Completar los <b>días de su grupo</b>; luego la <b>ecografía</b>" },
];
function caja(e, op, w) {
  const ct = e.c === AMBAR ? "#B26B10" : e.c;
  return `<div style="opacity:${op};border:2px solid ${e.c};background:${tinte(e.c, 12)};border-radius:12px;padding:9px 11px;width:${w}px;min-height:84px">
    <div style="font-weight:900;color:${ct};font-size:15.5px">${e.tit}</div><div style="font-size:13.5px;line-height:1.34;margin-top:3px">${e.txt}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const x0 = 40, x1 = 628, xm = x0 + (x1 - x0) * suave(tramo(t, 0.05, 0.85));
  const op = (f) => 0.16 + 0.84 * suave(tramo(t, 0.05 + f * 0.8 - 0.02, 0.05 + f * 0.8 + 0.06));
  const linea = `<svg width="668" height="80" viewBox="0 0 668 80">
    <rect x="${x0}" y="22" width="${x1 - x0}" height="20" rx="8" fill="#EEF2F7" stroke="#CBD5E1"/>
    <rect x="${x0}" y="22" width="${Math.max(0, xm - x0)}" height="20" rx="8" fill="${TINTA}" opacity=".14"/>
    ${H.map((h) => { const x = x0 + h.f * (x1 - x0); return `<circle cx="${x}" cy="32" r="9" fill="${h.c}"/>
      <text x="${x}" y="66" text-anchor="middle" font-size="13" font-weight="800" fill="#374151">${h.r}</text>`; }).join("")}
    <line x1="${xm}" y1="10" x2="${xm}" y2="54" stroke="${TINTA}" stroke-width="3"/><circle cx="${xm}" cy="32" r="7" fill="#fff" stroke="${TINTA}" stroke-width="3"/></svg>`;
  lienzo("Qué esperar con el antibiótico", "La evolución de la pielonefritis que responde, día a día",
    `${linea}
     <div style="display:flex;gap:9px;justify-content:center">${caja(H[0], op(H[0].f), 212)}${caja(H[1], op(H[1].f), 212)}${caja(H[2], op(H[2].f), 212)}</div>
     <div style="display:flex;gap:9px;justify-content:center">${caja(H[3], op(H[3].f), 212)}${caja(H[4], op(H[4].f), 212)}${caja(H[5], op(H[5].f), 212)}</div>
     <div class="caja" style="opacity:${0.16 + 0.84 * suave(tramo(t, 0.88, 0.95))};background:#1F2A37;color:#fff;font-weight:700;font-size:14px;padding:10px 13px">Fiebre a las <b style="color:#FCA5A5">48-72 horas</b>: buscar la causa con <b style="color:#5EEAD4">ecografía</b> y antibiograma.</div>`,
    "Esquema de Empirica. Fuentes: EAU 2026 (12.6.6); consenso suizo 2021 (recomendación 7); ESPID 2025; Lashkar y Nahata 2026 (tabla 2); AAP 2026.");
};
window.cuadro(39, 40);
</script></body></html>
