<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="tarjetas.js"></script></head><body><script>
// Las cuatro cadenas de tratamiento: AAP 2026 (KAS 2, 3A y 3B); consenso suizo 2021; ESPID 2025 (tabla 3).
tarjetas("Qué ITU vas a tratar", "Cada una con su vía y sus días", [
  { c: VERDE, t: "Cistitis", sub: "Sin fiebre, 2 años o más", filas: [
    ["Vía", "<b>Oral</b>"], ["Días", "<b>3 a 5</b>"], ["Ejemplos", "Trimetoprim-sulfametoxazol, nitrofurantoína"]] },
  { c: AZUL, t: "Pielonefritis oral", sub: "Buen aspecto, tolera", filas: [
    ["Vía", "<b>Oral</b> desde el inicio"], ["Días", "<b>5 a 7</b>"], ["Ejemplos", "Cefalexina, amoxicilina-clavulanato"]] },
  { c: NARANJA, t: "Pielonefritis IV", sub: "Menor de 2 meses o grave", filas: [
    ["Vía", "<b>IV</b> y paso temprano a oral"], ["Días", "<b>7 a 14</b>"], ["Ejemplos", "Ampicilina y gentamicina; ceftriaxona"]] },
  { c: MORADO, t: "Complicada", sub: "Anomalía o recurrencias", filas: [
    ["Vía", "Según el <b>subgrupo</b>"], ["Días", "<b>10 a 14</b>"], ["Ejemplos", "Según los <b>cultivos previos</b>"]] },
], "Revisar a todos a las <b style='color:#FCD34D'>48-72 horas</b> con el urocultivo y ajustar al antibiograma.",
  "Esquema de Empirica. Fuentes: AAP 2026 (KAS 2, 3A y 3B); consenso suizo 2021 (tablas 1 y 2); ESPID 2025 (tabla 3).");
</script></body></html>
