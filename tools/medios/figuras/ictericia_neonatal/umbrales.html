<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="tarjetas.js"></script></head><body><script>
// Escalera de umbrales de la AAP 2022 (KAS 10, 17, 20, 22-24) con su conducta.
tarjetas("La escalera de umbrales", "Dónde queda la bilirrubina sérica y qué se hace", [
  { c: VERDE, t: "Bajo el umbral", sub: "de fototerapia", filas: [
    ["Hacer", "<b>Seguimiento</b> según cuánto falta"],
    ["Control", "De <b>4 horas</b> a <b>3 días</b>"],
    ["Alta precoz", "Antes de <b>12 horas</b>: medir a las <b>24-48 horas</b>"]] },
  { c: AMBAR, t: "Fototerapia", sub: "En su umbral o más", filas: [
    ["Hacer", "Fototerapia <b>intensiva</b>"],
    ["Medir", "Sérica antes de <b>12 horas</b>"],
    ["Suspender", "A <b>2 mg/dL</b> o más bajo el umbral de inicio"]] },
  { c: NARANJA, t: "Escalada", sub: "2 mg/dL bajo la exanguinotransfusión", filas: [
    ["Hacer", "<b>UCIN</b>, líquidos IV y laboratorios"],
    ["Medir", "Cada <b>2 horas</b>"],
    ["Coombs +", "Considerar la <b>IGIV</b>"]] },
  { c: ROJO, t: "Exanguino&shy;transfusión", sub: "En su umbral o con encefalopatía", filas: [
    ["Hacer", "<b>Urgente</b>, de doble volumen"],
    ["Después", "Sérica antes de <b>2 horas</b>"],
    ["Durante", "Sin suspender la fototerapia <b>intensiva</b>"]] },
], "Cada umbral depende de la <b style='color:#FCD34D'>edad gestacional</b>, las <b style='color:#FCD34D'>horas de vida</b> y los factores de <b style='color:#FCA5A5'>neurotoxicidad</b>.",
  "Esquema de Empirica. Fuentes: AAP 2022 (KAS 10, 15, 17, 20-24; fig. 7); NICE CG98 (1.9.3 y 1.9.4).");
