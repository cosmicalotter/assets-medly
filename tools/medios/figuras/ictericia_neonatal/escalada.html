<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="tarjetas.js"></script></head><body><script>
// Escalada del cuidado (AAP 2022, fig. 4 y KAS 17-23).
tarjetas("La escalada del cuidado", "Bilirrubina a 2 mg/dL o menos del umbral de exanguinotransfusión", [
  { c: ROJO, t: "Ahora", sub: "Es una urgencia", filas: [
    ["Llamar", "<b>Neonatología</b>: traslado directo a la UCIN"],
    ["Enviar", "Bilirrubina total y directa, <b>hemograma</b>, albúmina, química y pruebas cruzadas"],
    ["Avisar", "Al <b>banco de sangre</b>"]] },
  { c: NARANJA, t: "Mientras tanto", sub: "También en el traslado", filas: [
    ["Dar", "Fototerapia <b>intensiva</b> y líquidos IV"],
    ["Medir", "Bilirrubina cada <b>2 horas</b>"],
    ["Coombs +", "Considerar <b>IGIV</b> 0,5-1 g/kg"]] },
  { c: MORADO, t: "Decidir", sub: "Con cada bilirrubina", filas: [
    ["Exanguino", "Si hay <b>encefalopatía</b> o llega a su umbral"],
    ["Fototerapia", "Si baja del umbral de <b>escalada</b>"],
    ["Seguir", "En escalada, bilirrubina cada <b>2 horas</b>"]] },
], "La <b style='color:#FCA5A5'>exanguinotransfusión</b> se difiere si la bilirrubina baja de su umbral y no hay <b style='color:#FCD34D'>encefalopatía</b>.",
  "Esquema de Empirica. Fuente: AAP 2022 (fig. 4; KAS 17-23).");
