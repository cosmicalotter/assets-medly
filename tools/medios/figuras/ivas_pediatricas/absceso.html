<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
  .p{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 6%,white);padding:8px;display:flex;flex-direction:column;align-items:center}
  .p h3{font-size:18px;color:var(--c)} .p svg{width:100%;flex:1;min-height:0}
  .nota{font-size:13.5px;color:#334155;text-align:center}
</style></head><body>
<script>
// Boca abierta vista de frente. lado: el absceso en la amígdala izquierda del paciente (derecha del dibujo).
function boca(absceso) {
  const ux = absceso ? -26 : 0, giro = absceso ? -12 : 0;
  const amig = (x, s) => `<ellipse cx="${x}" cy="150" rx="${30 * s}" ry="${46 * s}" fill="#F28B82" stroke="#B4443C" stroke-width="3"/>`;
  return `<svg viewBox="0 0 320 270">
    <path d="M20 40 Q160 -10 300 40 L300 230 Q160 280 20 230 Z" fill="#7F1D1D"/>
    <path d="M40 60 Q160 20 280 60 L280 220 Q160 250 40 220 Z" fill="#B91C1C" opacity=".55"/>
    <rect x="22" y="16" width="276" height="34" rx="14" fill="#FDE7D3"/>
    <path d="M70 230 Q160 190 250 230 L250 262 L70 262 Z" fill="#F87171"/>
    <path d="M86 70 Q100 150 96 220" stroke="#E57373" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M234 70 Q220 150 224 220" stroke="#E57373" stroke-width="12" fill="none" stroke-linecap="round"/>
    ${amig(108, 1)}
    ${absceso ? `<ellipse cx="200" cy="128" rx="58" ry="66" fill="${ROJO}" stroke="#991B1B" stroke-width="4"/>
       <ellipse cx="190" cy="112" rx="22" ry="18" fill="#fff" opacity=".35"/>` : amig(212, 1)}
    <g transform="rotate(${giro} 160 64)"><path d="M160 50 L${160 + ux} 120" stroke="#F9A8A8" stroke-width="22" stroke-linecap="round"/>
      <circle cx="${160 + ux}" cy="122" r="13" fill="#F9A8A8" stroke="${absceso ? AZUL : "#B4443C"}" stroke-width="${absceso ? 5 : 2}"/></g>
    ${absceso ? `<path d="M78 246 L128 140" stroke="${AZUL}" stroke-width="3"/><rect x="10" y="244" width="136" height="22" rx="6" fill="#fff"/>
      <text x="78" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="${AZUL}">úvula al lado sano</text>
      <text x="204" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">abombamiento</text>` : ""}
  </svg>`;
}
lienzo("Absceso periamigdalino", "Boca abierta, de frente: el absceso en la amígdala izquierda del paciente",
  `<div class="fila">
     <div class="p" style="--c:#64748B"><h3>Normal</h3>${boca(false)}</div>
     <div class="p" style="--c:${ROJO}"><h3>Absceso periamigdalino</h3>${boca(true)}</div>
   </div>
   <div class="nota">Además: voz gangosa, <b style="color:${NARANJA}">trismo</b> (no abre bien la boca) y deterioro general.</div>`,
  FUENTE_FAAB + " (p. 548).");
</script></body></html>
