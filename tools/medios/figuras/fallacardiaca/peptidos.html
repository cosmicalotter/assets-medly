<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Umbrales de NT-proBNP por edad: consulta (ESC 2026, fig. 4 y p. 5367) y descompensación (fig. 11 y p. 5387-5388).
const W = 668, X0 = 120, X1 = 650, LMIN = Math.log10(100), LMAX = Math.log10(7000);
const x = (v) => X0 + (Math.log10(v) - LMIN) / (LMAX - LMIN) * (X1 - X0);
const EDADES = [["Menor de 50", 125, 450], ["50 a 74 años", 250, 900], ["75 o más", 500, 1800]];
const VERDE_ = "#2FB36D", GRIS_ = "#CBD5E1";
let svg = `<svg width="${W}" height="370" viewBox="0 0 ${W} 370" style="font-family:Inter,Arial">`;
const ejes = [100, 300, 500, 1000, 2000, 5000];
const fila = (y, edad, tramos, marcas) => {
  let s = `<text x="${X0 - 10}" y="${y + 17}" text-anchor="end" font-size="13" font-weight="700" fill="#334155">${edad}</text>`;
  tramos.forEach(([a, b, c]) => { s += `<rect x="${x(a)}" y="${y}" width="${x(b) - x(a)}" height="24" fill="${c}"/>`; });
  marcas.forEach(([v, t, c]) => { s += `<line x1="${x(v)}" y1="${y - 4}" x2="${x(v)}" y2="${y + 28}" stroke="${c}" stroke-width="3"/>
    <text x="${x(v) + 5}" y="${y - 6}" font-size="12.5" font-weight="800" fill="${c}">${t}</text>`; });
  return s;
};
// Consulta
svg += `<text x="0" y="22" font-size="15" font-weight="800" fill="${AZUL}">En consulta: IC crónica</text>`;
EDADES.forEach(([e, u], i) => { const y = 48 + i * 44; svg += fila(y, e, [[100, u, VERDE_], [u, 7000, NARANJA]], [[u, `≥${u}`, "#9A3412"]]); });
// Descompensación
svg += `<text x="0" y="200" font-size="15" font-weight="800" fill="${ROJO}">En urgencias: IC descompensada</text>`;
EDADES.forEach(([e, , r], i) => { const y = 226 + i * 44;
  svg += fila(y, e, [[100, 300, VERDE_], [300, r, GRIS_], [r, 5000, ROJO], [5000, 7000, "#991B1B"]],
    [[300, i === 0 ? "300" : "", "#166534"], [r, `>${r}`, "#991B1B"]]); });
svg += `<line x1="${x(5000)}" y1="220" x2="${x(5000)}" y2="360" stroke="#111" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${x(5000) - 4}" y="215" text-anchor="end" font-size="12" font-weight="800" fill="#111">&gt;5000: hospitalizar</text>`;
ejes.forEach((v) => { svg += `<text x="${x(v)}" y="366" text-anchor="middle" font-size="11" fill="#64748B">${v}</text>`; });
svg += `</svg>`;
const ley = [[VERDE_, "IC poco probable"], [GRIS_, "Zona gris: decide la clínica y el eco"], [NARANJA, "IC probable en consulta"], [ROJO, "Descompensación probable"]]
  .map(([c, t]) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:12px;height:12px;border-radius:3px;background:${c};display:inline-block"></i>${t}</span>`).join("");
lienzo("NT-proBNP: cuándo es alto según la edad", "pg/mL en escala logarítmica. El umbral sube con la edad y es más alto en urgencias.",
  `${svg}<div style="font-size:12px;color:#334155">${ley}</div>`,
  "Esquema. Fuente: Guía ESC 2026 de insuficiencia cardíaca (Eur Heart J 2026;47:5346-5457), fig. 4 y 11. Con BNP: ≥35 en consulta y &lt;100 descarta en urgencias.");
</script></body></html>
