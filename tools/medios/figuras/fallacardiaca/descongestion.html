<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Manejo de la descongestión paso a paso (ESC 2026, fig. 15, p. 5394). Sodio urinario en mEq/L (= mmol/L).
// Respuesta buena en verde, insuficiente en rojo; el paso que toca en color lleno.
const C = "#4F46E5", GR = "#CBD5E1";
const PASOS = [
  "Empezar el diurético de asa IV",
  "Medir la respuesta a las 2 y a las 6 horas",
  "Si responde: repetir cada 12 h hasta descongestionar",
  "Si no responde: duplicar la dosis o añadir otro diurético",
  "Si sigue sin responder: llegar a la dosis máxima",
  "Si fracasa todo: valorar la ultrafiltración",
  "La descongestión completa, paso a paso",
];
const caja = (t, on, hecho, c = C, w = "100%") => `<div style="width:${w};border-radius:11px;padding:8px 10px;text-align:center;font-size:13px;line-height:1.3;
  background:${on ? c : hecho ? tinte(c, 16) : "#F8FAFC"};color:${on ? "#fff" : hecho ? "#1F2A37" : "#94A3B8"};border:2px solid ${on || hecho ? c : GR}">${t}</div>`;
const flechaV = (on) => `<div style="text-align:center;font-size:16px;line-height:14px;color:${on ? "#334155" : GR}">▼</div>`;
const pastilla = (t, c, on) => `<span style="display:inline-block;background:${on ? c : GR};color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800">${t}</span>`;
window.cuadro = function (i, n) {
  const p = n > 1 ? Math.min(6, Math.floor((i / n) * 7)) : 6;
  const todo = p === 6, on = (k) => todo || p === k, hecho = (k) => todo || p > k;
  const izq = `<div style="display:flex;flex-direction:column;gap:5px">
      ${caja("<b>Furosemida IV</b>: <b>40 mg</b> si no tomaba diurético, o el <b>doble</b> de su dosis oral diaria", on(0), hecho(0))}
      ${flechaV(hecho(0))}
      ${caja("A las <b>2 h</b>: sodio urinario <b>≥70 mEq/L</b><br>o a las <b>6 h</b>: diuresis <b>≥100 mL/h</b>", on(1), hecho(1))}
      <div style="display:flex;justify-content:space-around;margin-top:2px">${pastilla("Sí", VERDE, hecho(1))}${pastilla("No", ROJO, hecho(1))}</div>
      ${caja("<b>Repetir</b> el diurético cada <b>12 h</b> hasta la descongestión completa", on(2), hecho(2), VERDE)}
    </div>`;
  const der = `<div style="display:flex;flex-direction:column;gap:5px">
      ${caja("<b>Duplicar</b> el diurético de asa, o añadir <b>acetazolamida IV</b> o hidroclorotiazida según la TFG", on(3), hecho(3), ROJO)}
      ${flechaV(hecho(3))}
      ${caja("Nueva medida: sodio urinario a las <b>2-6 h</b> o diuresis a las <b>6 h</b>", on(3), hecho(3), ROJO)}
      ${flechaV(hecho(4))}
      ${caja("Subir el diurético de asa hasta la <b>dosis máxima</b> IV y añadir otro de <b>distinto mecanismo</b>", on(4), hecho(4), ROJO)}
      ${flechaV(hecho(5))}
      ${caja("<b>Ultrafiltración</b> si no se logra descongestionar con el máximo", on(5), hecho(5), "#991B1B")}
    </div>`;
  const pie = `<div class="caja" style="background:#F1F5F9;border:1.5px solid #CBD5E1;font-size:12.5px">Mientras tanto: iniciar o subir la <b>terapia de base</b>, vigilar la <b>hipotensión</b> y la hipoperfusión, y medir creatinina y electrolitos al menos cada <b>24 h</b>.</div>`;
  const ley = `<div style="display:flex;font-size:12.5px;color:#64748B"><span>Si la respuesta es buena en cualquier paso, se vuelve a la columna verde.</span><span style="margin-left:auto">Paso ${p + 1} de 7</span></div>`;
  lienzo("Descongestión con diuréticos", PASOS[p],
    ley + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">${izq}${der}</div>` + pie,
    "Esquema. Fuente: Guía ESC 2026 de insuficiencia cardíaca (Eur Heart J 2026;47:5346-5457), fig. 15 y p. 5393-5394.");
};
window.cuadro(6, 7);
</script></body></html>
