<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Signos, síntomas y laboratorio de la congestión y la hipoperfusión (ESC 2026, tabla 12, p. 5389).
// Izquierda en índigo y derecha en cian, como las ramas de la descompensación; hipoperfusión en rojo, como el choque.
const INDIGO = "#4F46E5", CIAN_ = "#0891B2";
const col = (c, tit, sub, xs) => `<div style="display:flex;flex-direction:column;gap:6px">
  <div style="background:${c};color:#fff;border-radius:11px;padding:9px 6px;text-align:center"><div style="font-size:16.5px;font-weight:800">${tit}</div><div style="font-size:12px;margin-top:1px">${sub}</div></div>
  ${xs.map((x) => `<div class="caja" style="background:${tinte(c, 9)};border:1.5px solid ${tinte(c, 40)};padding:6px 9px;font-size:12.8px">${x}</div>`).join("")}</div>`;
const html = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
  ${col(INDIGO, "Congestión izquierda", "El pulmón se encharca", ["<b>Disnea</b> y ortopnea", "Tos y taquipnea", "<b>Estertores</b> y tercer ruido", "Derrame pleural", "Péptido natriurético <b>elevado</b>"])}
  ${col(CIAN_, "Congestión derecha", "Se acumula en el cuerpo", ["<b>Edema</b> periférico", "Distensión abdominal y hepatomegalia", "<b>Yugulares</b> distendidas y reflujo hepatoyugular", "Derrame pleural", "Creatinina, bilirrubina, fosfatasa alcalina y GGT <b>altas</b>", "Péptido natriurético <b>algo elevado</b>"])}
  ${col(ROJO, "Hipoperfusión", "Le falta flujo a los órganos", ["Extremidades <b>frías</b> y sudorosas, piel pálida", "Mareo y <b>confusión</b>", "<b>Oliguria</b>", "Presión de pulso estrecha", "<b>Lactato</b>, creatinina y transaminasas altos"])}
</div>
<div class="caja" style="background:#F1F5F9;border:1.5px solid #CBD5E1">La hipoperfusión <b>no es lo mismo</b> que la hipotensión: puede haberla con la presión normal.</div>`;
lienzo("Congestión e hipoperfusión", "Qué buscar al llegar con la IC descompensada", html,
  "Esquema. Fuente: Guía ESC 2026 de insuficiencia cardíaca (Eur Heart J 2026;47:5346-5457), tabla 12 y p. 5387.");
</script></body></html>
