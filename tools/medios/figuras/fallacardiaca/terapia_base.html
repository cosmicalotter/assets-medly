<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Nueva nomenclatura de las terapias de la IC (ESC 2026, fig. 3 y p. 5363): terapia de base (FMT) por fenotipo,
// terapia adicional (AMT) y terapia intervencionista (GDIT). ICFEr en azul y ICFEp en morado, como sus ramas.
const capa = (c, tit, txt, extra = "") => `<div class="caja" style="background:${tinte(c, 12)};border:2px solid ${c};${extra}">
  <div style="font-weight:800;font-size:14.5px;color:${c};margin-bottom:3px">${tit}</div><div style="font-size:13px">${txt}</div></div>`;
const farm = (c, xs) => `<div style="display:grid;grid-template-columns:repeat(${xs.length},1fr);gap:6px;margin-top:6px">${xs.map((x) =>
  `<div style="background:${c};color:#fff;border-radius:9px;padding:8px 4px;text-align:center;font-weight:800;font-size:14px">${x}</div>`).join("")}</div>`;
const html = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${capa(AMBAR, "Terapia adicional", "Clase <b>IIa o IIb</b>, o clase I sólo para síntomas o en <b>subgrupos</b>: ivabradina, vericiguat, digitálicos, agonistas de GLP-1…")}
    ${capa(GRIS, "Terapia intervencionista", "<b>Dispositivos</b> implantables (DAI, TRC) e intervenciones recomendadas por la guía.")}
  </div>
  <div class="caja" style="background:#F8FAFC;border:2px solid #CBD5E1;padding:12px">
    <div style="font-weight:800;font-size:16px;text-align:center">Terapia de base: clase I, baja la mortalidad o las hospitalizaciones</div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:8px">
      <div><div style="font-weight:800;color:${AZUL};font-size:14.5px">IC con FE reducida (FEVI &lt;50 %)</div>${farm(AZUL, ["Beta-<br>bloqueador", "ARNI, IECA<br>o ARA II", "ARM", "iSGLT2"])}</div>
      <div><div style="font-weight:800;color:${MORADO};font-size:14.5px">IC con FE preservada</div>${farm(MORADO, ["ARM", "iSGLT2"])}</div>
    </div>
  </div>
  <div class="caja" style="background:#F1F5F9;border:1.5px solid #CBD5E1">En la ICFEr, los <b>cuatro</b> fármacos de base se inician juntos y se suben hasta la <b>dosis objetivo</b> o la máxima tolerada.</div>`;
lienzo("Terapia de base por fenotipo", "La base cambia el pronóstico; lo demás se añade según el perfil",
  html, "Esquema. Fuente: Guía ESC 2026 de insuficiencia cardíaca (Eur Heart J 2026;47:5346-5457), fig. 3 y p. 5363 y 5378.");
</script></body></html>
