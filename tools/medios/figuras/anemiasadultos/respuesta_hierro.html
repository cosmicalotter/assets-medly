<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.esc{flex:1;border:1px solid var(--linea);border-radius:16px;display:grid;place-items:center}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ps{border-radius:12px;background:#F3F4F6;color:var(--suave);padding:8px 10px;font-size:13px;line-height:1.3;min-height:70px}
.ps b{color:var(--tinta)} .ps .n{font-weight:800;font-size:12px;letter-spacing:.06em}
.ps.on{background:color-mix(in srgb,var(--teal) 14%,white);color:var(--tinta);outline:2px solid var(--teal)} .ps.hecho{background:#EEF7F5;color:var(--tinta)}</style></head><body><script>
const P=[["1 · EMPEZAR","<b>1 comprimido/día</b> de sal ferrosa, en ayunas"],["2 · 2-4 SEMANAS","Hb <b>↑ ≥10 g/L</b> a las 2 semanas o <b>≥20 g/L</b> a las 4"],["3 · SIN RESPUESTA","Revisar causas; pasar a hierro IV"],["4 · MANTENER","<b>3 meses</b> tras normalizar la Hb; hemograma cada <b>6 meses</b>"]];
const X=(s)=>60+s/20*500, Y=(hb)=>250-(hb-70)/80*210;
function curva(hasta){let p=[];for(let s=0;s<=hasta;s+=0.25){const hb=82+48*(1-Math.exp(-s/4.5));p.push(`${X(s).toFixed(1)},${Y(hb).toFixed(1)}`);}return p.join(" ");}
window.cuadro=function(i,total){const t=total>1?i/(total-1):1;
 const paso=t<0.2?0:t<0.45?1:t<0.65?2:3; const hasta=Math.min(20,Math.max(0.25,(t-0.05)/0.9*20));
 const sinresp=paso===2;
 const esc=`<svg width="620" height="290" viewBox="0 0 620 290">
  <line x1="60" y1="250" x2="570" y2="250" stroke="#9CA3AF"/><line x1="60" y1="30" x2="60" y2="250" stroke="#9CA3AF"/>
  ${[0,2,4,8,12,16,20].map(s=>`<text x="${X(s)}" y="270" text-anchor="middle" font-size="12" fill="#6B7280">${s}</text>`).join("")}
  <text x="570" y="286" text-anchor="end" font-size="12" fill="#6B7280">semanas</text>
  ${[80,100,120,140].map(h=>`<text x="52" y="${Y(h)+4}" text-anchor="end" font-size="12" fill="#6B7280">${h}</text>`).join("")}
  <text x="52" y="22" text-anchor="end" font-size="12" fill="#6B7280">Hb g/L</text>
  <line x1="60" x2="570" y1="${Y(120)}" y2="${Y(120)}" stroke="#2FB36D" stroke-dasharray="6 4"/><text x="568" y="${Y(120)-6}" text-anchor="end" font-size="12" fill="#2FB36D">normal</text>
  <rect x="${X(2)-1}" y="30" width="${X(4)-X(2)+2}" height="220" fill="#18B9A9" opacity=".08"/>
  ${sinresp?`<polyline points="${X(0)},${Y(82)} ${X(2)},${Y(85)}" fill="none" stroke="#EF5454" stroke-width="4"/><text x="${X(2)+10}" y="${Y(85)}" font-size="15" font-weight="800" fill="#EF5454">↑ &lt;10 g/L: no responde</text>`
   :`<polyline points="${curva(hasta)}" fill="none" stroke="#18B9A9" stroke-width="4"/>`}
  ${hasta>=2&&!sinresp?`<text x="${X(2)+8}" y="${Y(97)}" font-size="13" font-weight="700" fill="#18B9A9">+10 g/L</text>`:""}
  ${hasta>=12&&!sinresp?`<rect x="${X(10)}" y="${Y(140)}" width="${X(20)-X(10)}" height="22" rx="6" fill="#18B9A9" opacity=".15"/><text x="${X(15)}" y="${Y(140)+15}" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">3 meses más tras normalizar</text>`:""}
 </svg>`;
 lienzo("Respuesta al hierro oral","Cuándo mirar la Hb y qué hacer si no sube.",
  `<div class="esc">${esc}</div><div class="pasos">${P.map(([n,s],k)=>`<div class="ps ${k===paso?"on":k<paso?"hecho":""}"><div class="n">${n}</div>${s}</div>`).join("")}</div>`,
  "Esquema propio (curva ilustrativa). Fuente: BSG 2021, recomendaciones 18, 20, 21 y 23 (Snook et al., Gut 2021).");};
window.cuadro(39,40);
</script></body></html>
