<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Animación: la pérdida de peso de los primeros días (NICE NG75, 1.1.1, 1.1.2 y 1.1.4). Curvas de ejemplo.
const X0 = 70, X1 = 650, Y0 = 40, Y1 = 330, DMAX = 21, PMIN = -14;
const px = (d) => X0 + (X1 - X0) * d / DMAX, py = (p) => Y0 + (Y1 - Y0) * (-p) / (-PMIN);
const NORMAL = [[0, 0], [1, -3.5], [2, -5.6], [3, -6.6], [4, -6.8], [6, -5.6], [9, -3.6], [12, -2], [15, -0.9], [18, -0.2], [21, 0.3]];
const ALERTA = [[0, 0], [1, -4.5], [2, -7.5], [3, -9.6], [4, -11], [6, -11.8], [9, -11.6], [12, -10.8], [15, -10.1], [18, -9.6], [21, -9.2]];
function camino(p, f) {
  const n = Math.max(1, Math.round(f * (p.length - 1) * 20));
  const pts = [];
  for (let k = 0; k <= n; k++) {
    const u = k / 20, i = Math.min(p.length - 2, Math.floor(u)), r = u - i;
    pts.push([px(lerp(p[i][0], p[i + 1][0], r)), py(lerp(p[i][1], p[i + 1][1], r))]);
  }
  return pts;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.99;
  const f = suave(tramo(t, 0.04, 0.72));
  const a = camino(NORMAL, f), b = camino(ALERTA, f);
  const linea = (pts, c) => `<polyline points="${pts.map((q) => q.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const fin = (pts, c) => { const q = pts[pts.length - 1]; return `<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="${c}" stroke="#fff" stroke-width="2.5"/>`; };
  const o1 = suave(tramo(t, 0.22, 0.3)), o2 = suave(tramo(t, 0.72, 0.8)), o3 = suave(tramo(t, 0.84, 0.92));
  const ejeY = [0, -5, -10].map((p) => `<line x1="${X0}" y1="${py(p)}" x2="${X1}" y2="${py(p)}" stroke="#E5E7EB"/><text x="${X0 - 10}" y="${py(p) + 5}" text-anchor="end" font-size="14" fill="#6B7280">${p === 0 ? "0" : p + " %"}</text>`).join("");
  const ejeX = [0, 3, 7, 14, 21].map((d) => `<text x="${px(d)}" y="${Y1 + 22}" text-anchor="middle" font-size="14" fill="#6B7280">${d === 21 ? "3 sem" : d + " d"}</text>`).join("");
  const svg = `<svg width="668" height="370" viewBox="0 0 700 370">
    <rect x="${X0}" y="${py(-10)}" width="${X1 - X0}" height="${Y1 - py(-10)}" fill="${tinte(ROJO, 12)}"/>
    <line x1="${X0}" y1="${py(-10)}" x2="${X1}" y2="${py(-10)}" stroke="${ROJO}" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="${X1 - 6}" y="${py(-10) + 22}" text-anchor="end" font-size="15" font-weight="800" fill="${ROJO}">Más del 10 %: evaluar</text>
    ${ejeY}${ejeX}
    <line x1="${X0}" y1="${Y1}" x2="${X1}" y2="${Y1}" stroke="#9CA3AF"/>
    <g opacity="${o1}"><line x1="${px(3.5)}" y1="${Y0 - 6}" x2="${px(3.5)}" y2="${Y1}" stroke="${AZUL}" stroke-width="2" stroke-dasharray="4 5"/>
      <text x="${px(3.5) + 8}" y="${Y0 + 8}" font-size="14.5" font-weight="800" fill="${AZUL}">3-4 días: la pérdida se detiene</text></g>
    <g opacity="${o2}"><line x1="${px(21)}" y1="${Y0 - 6}" x2="${px(21)}" y2="${Y1}" stroke="${VERDE}" stroke-width="2" stroke-dasharray="4 5"/>
      <text x="${px(21) - 8}" y="${py(0) - 12}" text-anchor="end" font-size="14.5" font-weight="800" fill="${VERDE}">3 semanas: peso al nacer recuperado</text></g>
    ${linea(a, VERDE)}${linea(b, ROJO)}${fin(a, VERDE)}${fin(b, ROJO)}
  </svg>`;
  lienzo("La pérdida de peso de los primeros días", "Porcentaje del peso al nacer, día a día (curvas de ejemplo)",
    `${svg}<div style="display:flex;gap:8px;opacity:${0.25 + 0.75 * o3}">
      <div class="item" style="flex:1;background:${tinte(VERDE, 12)}"><b style="color:${VERDE}">●</b> <b>Esperada</b>: se detiene hacia los 3-4 días y recupera el peso al nacer a las <b>3 semanas</b>.</div>
      <div class="item" style="flex:1;background:${tinte(ROJO, 12)}"><b style="color:${ROJO}">●</b> <b>Preocupa</b>: pasa del <b>10 %</b> o no recupera el peso a las 3 semanas.</div></div>`,
    "Esquema de Empirica con curvas de ejemplo. Fuente: NICE NG75 (1.1.1, 1.1.2 y 1.1.4).");
};
window.cuadro(39, 40);
</script></body></html>
