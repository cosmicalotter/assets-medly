<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// GIF de flujo: cada cuánto pesar según la edad (NICE NG75, 1.2.27 a 1.2.30).
const H = [
  { f: 0.00, r: "0", c: ROSA_C, tit: "Menor de 1 mes", txt: "Pesar como mucho <b>cada día</b>" },
  { f: 0.12, r: "1 m", c: AZUL, tit: "1 a 6 meses", txt: "Como mucho <b>cada semana</b>" },
  { f: 0.42, r: "6 m", c: TEAL, tit: "6 a 12 meses", txt: "Como mucho <b>cada 2 semanas</b>" },
  { f: 0.72, r: "1 año", c: MORADO, tit: "Desde 1 año", txt: "Como mucho <b>cada mes</b>" },
];
function caja(e, op, w) {
  return `<div style="opacity:${op};border:2px solid ${e.c};background:${tinte(e.c, 12)};border-radius:12px;padding:10px 12px;width:${w}px;min-height:88px">
    <div style="font-weight:900;color:${e.c};font-size:16px">${e.tit}</div><div style="font-size:14.5px;line-height:1.34;margin-top:4px">${e.txt}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const x0 = 40, x1 = 628, xm = x0 + (x1 - x0) * suave(tramo(t, 0.05, 0.8));
  const op = (f) => 0.16 + 0.84 * suave(tramo(t, 0.05 + f * 0.75 - 0.02, 0.05 + f * 0.75 + 0.06));
  const linea = `<svg width="668" height="84" viewBox="0 0 668 84">
    <rect x="${x0}" y="22" width="${x1 - x0}" height="20" rx="8" fill="#EEF2F7" stroke="#CBD5E1"/>
    <rect x="${x0}" y="22" width="${Math.max(0, xm - x0)}" height="20" rx="8" fill="${TINTA}" opacity=".14"/>
    ${H.map((h) => { const x = x0 + h.f * (x1 - x0); return `<circle cx="${x}" cy="32" r="9" fill="${h.c}"/>
      <text x="${x}" y="68" text-anchor="middle" font-size="13.5" font-weight="800" fill="#374151">${h.r}</text>`; }).join("")}
    <text x="${x1}" y="68" text-anchor="end" font-size="13.5" font-weight="800" fill="#374151">2 años</text>
    <line x1="${xm}" y1="10" x2="${xm}" y2="54" stroke="${TINTA}" stroke-width="3"/><circle cx="${xm}" cy="32" r="7" fill="#fff" stroke="${TINTA}" stroke-width="3"/></svg>`;
  lienzo("Cada cuánto pesar", "La frecuencia máxima habitual según la edad", `${linea}
     <div style="display:flex;gap:9px;justify-content:center">${caja(H[0], op(H[0].f), 325)}${caja(H[1], op(H[1].f), 325)}</div>
     <div style="display:flex;gap:9px;justify-content:center">${caja(H[2], op(H[2].f), 325)}${caja(H[3], op(H[3].f), 325)}</div>
     <div style="display:flex;gap:9px;opacity:${0.16 + 0.84 * suave(tramo(t, 0.84, 0.94))}">
       <div class="caja" style="flex:1;background:#1F2A37;color:#fff;font-weight:700;font-size:13.5px">Talla: <b style="color:#5EEAD4">no más de cada 3 meses</b>.</div>
       <div class="caja" style="flex:1.4;background:#1F2A37;color:#fff;font-weight:700;font-size:13.5px">Si <b style="color:#FCA5A5">pierde peso</b>, pesar más seguido; si no, más pesadas dan <b style="color:#FCD34D">ansiedad</b>.</div></div>`,
    "Esquema de Empirica. Fuente: NICE NG75 (1.2.27 a 1.2.30).");
};
window.cuadro(39, 40);
</script></body></html>
