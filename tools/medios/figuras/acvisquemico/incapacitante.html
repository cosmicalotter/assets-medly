<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .pregunta{background:#F3F4F6;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.35}
  .bathe{display:flex;gap:6px;margin-top:8px}
  .bathe div{flex:1;text-align:center;background:#fff;border-radius:8px;padding:5px 2px;font-size:12px}
  .bathe b{display:block;font-size:17px;color:var(--teal)}
  .cols{display:flex;gap:12px;flex:1}
  .col{flex:1;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .col h3{font-size:15.5px;margin-bottom:2px}
  .col.si{background:color-mix(in srgb,var(--rojo) 11%,white);border:2px solid color-mix(in srgb,var(--rojo) 45%,white)}
  .col.no{background:#F7F8FA;border:2px solid #E5E7EB}
  .it{font-size:13.2px;line-height:1.3;display:flex;gap:8px;align-items:flex-start}
  .it span.n{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--rojo);border-radius:6px;padding:1px 5px;margin-top:1px}
  .it span.d{flex:none;width:7px;height:7px;border-radius:50%;background:#9CA3AF;margin-top:6px}
  .conducta{margin-top:auto;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;text-align:center}
  .si .conducta{background:var(--rojo);color:#fff}
  .no .conducta{background:#E5E7EB;color:var(--tinta)}
</style></head><body>
<script>
lienzo(
  "¿Es un déficit incapacitante?",
  "NIHSS 0-5 al llegar, dentro de las 4,5 h",
  `<div class="pregunta">Si el déficit persistiera, ¿podría hacer sus actividades básicas y volver a trabajar? Valorar <b>marcha y deglución</b> y decidir con el paciente y la familia.
     <div class="bathe"><div><b>B</b>bañarse y vestirse</div><div><b>A</b>caminar</div><div><b>T</b>ir al baño</div><div><b>H</b>higiene</div><div><b>E</b>comer</div></div></div>
   <div class="cols">
     <div class="col si"><h3>Suele ser incapacitante</h3>
       <div class="it"><span class="n">≥2</span><span>Hemianopsia completa (ítem visión)</span></div>
       <div class="it"><span class="n">≥2</span><span>Afasia grave (ítem lenguaje)</span></div>
       <div class="it"><span class="n">≥2</span><span>Heminegligencia grave o extinción a más de una modalidad</span></div>
       <div class="it"><span class="n">≥2</span><span>Debilidad que no sostiene el esfuerzo contra la gravedad (ítems motores)</span></div>
       <div class="conducta">→ Trombólisis</div></div>
     <div class="col no"><h3>Puede no serlo</h3>
       <div class="it"><span class="d"></span><span>Afasia leve aislada (se comunica bien)</span></div>
       <div class="it"><span class="d"></span><span>Desviación facial aislada</span></div>
       <div class="it"><span class="d"></span><span>Debilidad leve de la mano cortical</span></div>
       <div class="it"><span class="d"></span><span>Pérdida hemimotora o hemisensitivomotora leve</span></div>
       <div class="it"><span class="d"></span><span>Pérdida hemisensitiva</span></div>
       <div class="it"><span class="d"></span><span>Hemiataxia leve (aún camina)</span></div>
       <div class="conducta">→ Individualizar; leve no incapacitante: doble antiagregación</div></div>
   </div>`,
  "Esquema de la Tabla 4 de la guía AHA/ASA 2026 del ACV isquémico agudo (Prabhakaran et al., Stroke 2026)."
);
</script></body></html>
