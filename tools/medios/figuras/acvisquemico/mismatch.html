<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:14px;flex:1}
  .panel{border-radius:14px;background:#F7F8FA;padding:10px;display:flex;flex-direction:column;gap:6px}
  .panel h3{font-size:14px}
  .datos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .dato{background:#fff;border-radius:8px;padding:5px 6px;text-align:center;font-size:11.5px;color:var(--suave)}
  .dato b{display:block;font-size:19px;color:var(--tinta)}
  .crit{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
  .crit div{display:flex;gap:6px;align-items:center;background:#fff;border-radius:8px;padding:4px 8px}
  .ok{color:#2FB36D;font-weight:800}.mal{color:#EF5454;font-weight:800}
  .rm{display:flex;gap:8px;justify-content:center}
  .rm div{text-align:center;font-size:12px;font-weight:700;color:var(--suave);line-height:1.1}
  .reloj{background:#1F2A37;color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center}
</style></head><body>
<script>
const CX = 150, CY = 160, RX = 112, RY = 140;
const lerp = (a, b, u) => a + (b - a) * u;
function cerebro(cont, tono = "#8a8a8a") {
  return `<rect width="300" height="320" rx="14" fill="#0b0d10"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX + 8}" ry="${RY + 8}" fill="#e9e9e9"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX + 3}" ry="${RY + 3}" fill="#1a1a1a"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="${tono}"/>
    <line x1="${CX}" x2="${CX}" y1="${CY - RY}" y2="${CY + RY}" stroke="#5e5e5e" stroke-width="2"/>${cont}`;
}
// Penumbra (ámbar) fija; el núcleo (rojo) crece mientras no se reperfunde.
function perfusion(u) {
  const pen = sector(CX, CY, RX - 3, RY - 3, RX * 0.22, RY * 0.22, 142, 230);
  const a1 = lerp(176, 145, u), a2 = lerp(198, 227, u), k = lerp(0.55, 0.95, u);
  const nuc = sector(CX, CY, RX * k, RY * k, RX * 0.22, RY * 0.22, a1, a2);
  return `<svg width="214" height="228" viewBox="0 0 300 320">${cerebro(`<path d="${pen}" fill="#F2A23A" opacity=".9"/><path d="${nuc}" fill="#EF5454"/>`, "#3a7bd5")}
    <text x="14" y="24" font-size="12" fill="#cbd5e1" font-weight="700">D</text><text x="280" y="24" font-size="12" fill="#cbd5e1" font-weight="700">I</text></svg>`;
}
function rm(lesion) {
  const l = sector(CX, CY, RX - 3, RY - 3, RX * 0.4, RY * 0.4, 165, 205);
  return `<svg width="118" height="126" viewBox="0 0 300 320">${cerebro(lesion ? `<path d="${l}" fill="#f4f4f4"/>` : "", "#7d7d7d")}</svg>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0.15;
  const u = Math.min(1, Math.max(0, (t - 0.1) / 0.75));
  const nucleo = Math.round(lerp(18, 76, u)), total = 84, pen = total - nucleo, cociente = total / nucleo;
  const c1 = cociente > 1.2, c2 = total - nucleo > 10, c3 = nucleo < 70;
  const marca = (ok) => ok ? '<span class="ok">✓</span>' : '<span class="mal">✗</span>';
  lienzo(
    "Núcleo y penumbra: imagen avanzada",
    "Para decidir la reperfusión entre 4,5 y 24 h o al despertar",
    `<div class="fila">
      <div class="panel" style="width:500px;flex:none"><h3>Perfusión (TC o RM) con software automático</h3>
        <div style="display:flex;gap:10px">
          ${perfusion(u)}
          <div style="display:flex;flex-direction:column;gap:8px;flex:1">
            <div class="reloj">${u < 0.02 ? "Llegada" : u < 1 ? "Sin reperfusión…" : "Penumbra perdida"}</div>
            <div class="datos"><div class="dato"><b style="color:#EF5454">${nucleo}</b>núcleo mL</div><div class="dato"><b style="color:#F2A23A">${pen}</b>penumbra mL</div><div class="dato"><b>${cociente.toFixed(1).replace(".", ",")}</b>cociente</div></div>
            <div class="crit"><div>${marca(c1)} Hipoperfundido/núcleo <b>&gt;1,2</b></div><div>${marca(c2)} Diferencia <b>&gt;10 mL</b></div><div>${marca(c3)} Núcleo <b>&lt;70 mL</b></div></div>
            <div style="font-size:11.5px;color:var(--suave)">Criterios del ensayo EXTEND. Rojo: núcleo ya infartado. Ámbar: penumbra salvable.</div>
          </div></div>
        <div class="reloj" style="background:#FEF3E2;color:#92400e;margin-top:auto">Cada minuto sin reperfusión se pierde tejido salvable: la penumbra pasa a núcleo</div></div>
      <div class="panel" style="flex:1;min-width:0"><h3>RM: DWI frente a FLAIR</h3>
        <div class="rm"><div>${rm(true)}<br>DWI: lesión</div></div>
        <div class="rm"><div>${rm(false)}<br>FLAIR: sin cambio</div></div>
        <div style="font-size:11.5px;color:var(--suave)">«Reloj tisular» del ensayo WAKE-UP.</div></div>
    </div>`,
    "Esquema con valores ilustrativos, no un paciente real. Fuente: guía AHA/ASA 2026 (Tabla 3 y recomendaciones 3.2.6-3.2.9, 4.6.3)."
  );
};
window.cuadro(0, 1);
</script></body></html>
