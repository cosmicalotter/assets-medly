<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
  .bloque{border-radius:12px;background:#F7F8FA;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
  .bloque h3{font-size:14px;margin-bottom:1px}
  .bloque h3 small{font-weight:400;color:var(--suave);font-size:12px}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.6px;line-height:1.25;background:#fff;border-radius:8px;padding:5px 8px}
  .fila .pill{font-size:11.5px}
  .ancho{grid-column:1 / span 2}
</style></head><body>
<script>
const F = (txt, clase, rot) => `<div class="fila"><span>${txt}</span>${pill(clase, rot)}</div>`;
lienzo(
  "¿Trombectomía? Selección por imagen",
  "Adultos con NIHSS ≥6 (salvo basilar). ASPECTS en TC; mRS = discapacidad previa al ACV.",
  `<div class="grid">
    <div class="bloque"><h3>Carótida interna o M1 · <small>0-6 h</small></h3>
      ${F("ASPECTS 6-10 · mRS 0-1", "I")}
      ${F("ASPECTS 6-10 · mRS 2", "IIa")}
      ${F("ASPECTS 6-10 · mRS 3-4", "IIb")}
      ${F("ASPECTS 3-5 · mRS 0-1", "I")}
      ${F("ASPECTS 0-2 · mRS 0-1 · &lt;80 años · sin efecto de masa", "IIa")}
      ${F("mRS &gt;4, o ASPECTS 0-5 con mRS ≥2", "—", "Datos insuficientes")}</div>
    <div class="bloque"><h3>Carótida interna o M1 · <small>6-24 h</small></h3>
      ${F("ASPECTS 6-10 · mRS 0-1", "I")}
      ${F("ASPECTS 3-5 · mRS 0-1 · &lt;80 años · sin efecto de masa", "I")}
      ${F("mRS ≥2 o ASPECTS 0-2", "—", "Datos insuficientes")}
      <h3 style="margin-top:6px">Basilar · <small>0-24 h, PC-ASPECTS ≥6</small></h3>
      ${F("mRS 0-1 · NIHSS ≥10", "I")}
      ${F("mRS 0-1 · NIHSS 6-9", "IIb")}
      ${F("mRS ≥2", "—", "Datos insuficientes")}</div>
    <div class="bloque ancho"><h3>Vasos medianos y distales</h3>
      ${F("M2 dominante (irriga ≥50 % de la ACM) · 0-6 h · ASPECTS ≥6 · mRS 0-1", "IIa")}
      ${F("M2 dominante a más de 6 h", "—", "Datos insuficientes")}
      ${F("M2 no dominante o codominante, ACM distal, ACA o ACP", "III", "III: sin beneficio")}</div>
  </div>`,
  "Esquema de la Figura 3 de la guía AHA/ASA 2026 (Prabhakaran et al., Stroke 2026). Más de 24 h: datos insuficientes."
);
</script></body></html>
