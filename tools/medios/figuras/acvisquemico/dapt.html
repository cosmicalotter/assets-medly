<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .inicio{background:#1F2A37;color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;text-align:center}
  .inicio small{display:block;font-weight:400;font-size:12px;opacity:.85}
  .ramas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;flex:1}
  .r{border-radius:12px;background:#F7F8FA;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
  .cond{font-size:13px;font-weight:700;line-height:1.3;padding-bottom:6px;border-bottom:2px solid #E5E7EB}
  .cond small{display:block;font-weight:400;color:var(--suave);font-size:11.5px}
  .op{background:#fff;border-radius:9px;padding:6px 8px;font-size:12.3px;line-height:1.3;display:flex;flex-direction:column;gap:4px}
  .op .pill{align-self:flex-start;font-size:11px}
  .no{background:#E5E7EB;border-radius:9px;padding:6px 8px;font-size:12px;margin-top:auto}
  .flecha{text-align:center;color:var(--suave);font-size:18px;line-height:1}
</style></head><body>
<script>
const OP = (txt, clase, rot) => `<div class="op">${pill(clase, rot)}<span>${txt}</span></div>`;
lienzo(
  "¿Doble antiagregación (DAPT)?",
  "ACV isquémico no cardioembólico o AIT, sin trombólisis",
  `<div class="inicio">¿Candidato a trombólisis o trombectomía? → esas van primero <small>La aspirina no las reemplaza (Clase III: daño)</small></div>
   <div class="flecha">↓ no</div>
   <div class="ramas">
     <div class="r"><div class="cond">LKW &lt;24 h<small>NIHSS ≤3 o ABCD2 ≥4</small></div>
       ${OP("<b>Clopidogrel + aspirina 21 días</b> (carga de clopidogrel), luego uno solo", "I")}
       ${OP("Ticagrelor + aspirina 30 días (si es AIT: ABCD2 ≥6)", "IIb")}
       ${OP("Alelo CYP2C19 de pérdida de función: ticagrelor + aspirina 21 días", "IIb")}</div>
     <div class="r"><div class="cond">LKW &lt;24 h<small>NIHSS 4-5</small></div>
       ${OP("Aterosclerosis ≥50 %: <b>clopidogrel + aspirina 21 días</b>", "IIa")}
       ${OP("Ticagrelor + aspirina 30 días", "IIb")}
       <div class="no">NIHSS &gt;5: un solo antiagregante</div></div>
     <div class="r"><div class="cond">LKW 24-72 h<small>NIHSS ≤5 o ABCD2 ≥4 + aterosclerosis ≥50 %</small></div>
       ${OP("<b>Clopidogrel + aspirina 21 días</b>", "IIa")}
       <div class="no">Sin aterosclerosis: un solo antiagregante</div></div>
   </div>`,
  "Esquema de la Figura 4 y las recomendaciones 4.8.12-4.8.15 de la guía AHA/ASA 2026. DAPT más de 90 días: más sangrado sin menos recurrencias."
);
</script></body></html>
