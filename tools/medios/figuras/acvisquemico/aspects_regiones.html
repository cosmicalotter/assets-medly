<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .cortes{display:flex;gap:14px;justify-content:center}
  .corte{display:flex;flex-direction:column;align-items:center;gap:4px}
  .corte .r{font-size:13px;font-weight:700;color:var(--suave)}
  .marcador{display:flex;align-items:center;gap:14px;background:#F3F4F6;border-radius:12px;padding:9px 14px}
  .num{font-size:36px;font-weight:800;line-height:1;min-width:58px;text-align:center}
  .formula{font-size:14px;line-height:1.35}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .chip{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff;border:1.5px solid #D1D5DB;color:#6B7280}
  .chip.on{background:#EF5454;border-color:#EF5454;color:#fff}
</style></head><body>
<script>
// Cortes axiales esquemáticos (convención radiológica: el hemisferio derecho del
// paciente a la izquierda de la imagen). Se puntúa la ACM derecha.
const CX = 150, CY = 170, RX = 118, RY = 150;
const GRIS = "#8a8a8a", AFECTADO = "#4b4b4b";
// Regiones: [id, rótulo, nivel, ruta SVG, posición del rótulo]
const corteza = (a1, a2) => sector(CX, CY, RX - 4, RY - 4, RX - 30, RY - 30, a1, a2);
const lab = (a, k = 0.77) => enElipse(CX, CY, RX * k, RY * k, a);
const REG = [
  ["C", "Caudado", 0, "M131 110 Q122 115 122 132 Q123 148 130 155 Q137 145 137 128 Q137 115 131 110 Z", [128, 97]],
  ["L", "Lenticular", 0, "M101 130 Q87 150 89 176 Q93 198 105 206 Q115 186 115 166 Q114 144 101 130 Z", [102, 182]],
  ["IC", "Cápsula interna", 0, "M113 118 L119 116 L125 158 L140 203 L134 207 L118 162 Z", [137, 221]],
  ["I", "Ínsula", 0, "M76 126 Q68 160 72 202 L81 202 Q77 162 85 126 Z", [86, 142]],
  ["M1", "M1", 0, corteza(208, 236), lab(222, 0.86)],
  ["M2", "M2", 0, corteza(174, 206), lab(190, 0.86)],
  ["M3", "M3", 0, corteza(140, 172), lab(156, 0.86)],
  ["M4", "M4", 1, corteza(208, 238), lab(223, 0.86)],
  ["M5", "M5", 1, corteza(174, 206), lab(190, 0.86)],
  ["M6", "M6", 1, corteza(138, 172), lab(155, 0.86)],
];
const ORDEN = ["I", "M2", "L", "M1", "M5"];  // regiones que se van afectando

function corteSVG(nivel, afectadas) {
  const base = `<rect x="0" y="0" width="300" height="340" rx="16" fill="#0b0d10"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX + 10}" ry="${RY + 10}" fill="#e9e9e9"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX + 4}" ry="${RY + 4}" fill="#1a1a1a"/>
    <ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="${GRIS}"/>
    <line x1="${CX}" x2="${CX}" y1="${CY - RY}" y2="${CY + RY}" stroke="#5e5e5e" stroke-width="2"/>`;
  const ventr = nivel === 0
    ? `<path d="M138 112 Q134 130 140 150 L147 150 L147 112 Z" fill="#2b2b2b"/><path d="M162 112 Q166 130 160 150 L153 150 L153 112 Z" fill="#2b2b2b"/>
       <rect x="147" y="168" width="6" height="30" rx="3" fill="#2b2b2b"/>
       <path d="M140 230 Q132 250 140 262 L146 256 Z" fill="#2b2b2b"/><path d="M160 230 Q168 250 160 262 L154 256 Z" fill="#2b2b2b"/>`
    : `<path d="M138 120 Q128 170 138 222 L147 222 L147 120 Z" fill="#2b2b2b"/><path d="M162 120 Q172 170 162 222 L153 222 L153 120 Z" fill="#2b2b2b"/>`;
  let regiones = "", rotulos = "";
  REG.filter((r) => r[2] === nivel).forEach(([id, , , d, [lx, ly]]) => {
    const on = afectadas.includes(id);
    regiones += `<path d="${d}" fill="${on ? AFECTADO : "#9a9a9a"}" stroke="${on ? "#EF5454" : "#18B9A9"}" stroke-width="${on ? 2.4 : 1.6}" ${on ? "" : 'stroke-dasharray="4 3"'}/>`;
    rotulos += `<g><rect x="${lx - 14}" y="${ly - 9}" width="28" height="18" rx="6" fill="${on ? "#EF5454" : "#fff"}" opacity=".95"/>
      <text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="${on ? "#fff" : "#1F2A37"}">${id}</text></g>`;
  });
  return `<svg width="262" height="297" viewBox="0 0 300 340">${base}${regiones}${ventr}${rotulos}
    <text x="14" y="26" font-size="12" fill="#cbd5e1" font-weight="700">D</text><text x="278" y="26" font-size="12" fill="#cbd5e1" font-weight="700">I</text></svg>`;
}

// Versión fija para la calculadora: las 10 regiones sin afectar y su leyenda.
window.cuadro = function () {
  lienzo(
    "ASPECTS: las 10 regiones",
    "Marcar en la tabla cada región de la ACM con cambio isquémico temprano",
    `<div class="cortes">
       <div class="corte">${corteSVG(0, [])}<div class="r">Ganglios basales</div></div>
       <div class="corte">${corteSVG(1, [])}<div class="r">Supraganglionar (corona radiada)</div></div>
     </div>
     <div class="marcador"><div class="formula"><b>C</b> caudado · <b>L</b> lenticular · <b>IC</b> cápsula interna · <b>I</b> ínsula ·
       <b>M1-M3</b> corteza anterior, lateral y posterior a nivel de los ganglios · <b>M4-M6</b> la corteza justo encima. Resultado: <b>10 − regiones afectadas</b>.</div></div>`,
    "Esquema, no TC real. Fuente: Figura 2 de la guía AHA/ASA 2026; Barber PA et al., Lancet 2000."
  );
};
window.cuadro(0, 1);
</script></body></html>
