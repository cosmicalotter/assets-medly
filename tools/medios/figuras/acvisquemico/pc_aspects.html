<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .cortes{display:flex;gap:10px;justify-content:center}
  .corte{display:flex;flex-direction:column;align-items:center;gap:4px}
  .corte .r{font-size:13px;font-weight:700;color:var(--suave)}
  .tabla{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .t{border-radius:10px;background:#F3F4F6;padding:8px 10px;font-size:12.5px;line-height:1.3}
  .t b.p{display:inline-block;font-size:16px;margin-right:4px}
  .nota{font-size:13px;background:color-mix(in srgb,var(--teal) 10%,white);border-radius:10px;padding:8px 12px}
</style></head><body>
<script>
const AZUL = "#4F8CF6", VERDE = "#2FB36D", ROJO = "#B4407A", NARANJA = "#F2A23A";
const marco = (cont) => `<svg width="216" height="250" viewBox="0 0 216 250"><rect width="216" height="250" rx="14" fill="#0b0d10"/>${cont}</svg>`;
const et = (x, y, t, c) => `<g><rect x="${x - 15}" y="${y - 10}" width="30" height="19" rx="6" fill="${c}"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${t}</text></g>`;
// Nivel talámico: tálamos y lóbulos occipitales (territorio de la ACP).
const talamos = marco(`<ellipse cx="108" cy="125" rx="88" ry="108" fill="#e9e9e9"/><ellipse cx="108" cy="125" rx="83" ry="103" fill="#8a8a8a"/>
  <line x1="108" x2="108" y1="22" y2="228" stroke="#5e5e5e" stroke-width="2"/>
  <ellipse cx="94" cy="122" rx="11" ry="17" fill="${AZUL}" opacity=".85"/><ellipse cx="122" cy="122" rx="11" ry="17" fill="${AZUL}" opacity=".85"/>
  <path d="M108 182 L108 228 Q70 224 48 196 Q60 182 108 182 Z" fill="${VERDE}" opacity=".85"/>
  <path d="M108 182 L108 228 Q146 224 168 196 Q156 182 108 182 Z" fill="${VERDE}" opacity=".85"/>
  <line x1="108" x2="108" y1="178" y2="230" stroke="#0b0d10" stroke-width="3"/>
  ${et(94, 96, "−1", AZUL)}${et(122, 96, "−1", AZUL)}${et(76, 208, "−1", VERDE)}${et(140, 208, "−1", VERDE)}`);
// Mesencéfalo.
const meso = marco(`<ellipse cx="108" cy="125" rx="88" ry="108" fill="#e9e9e9"/><ellipse cx="108" cy="125" rx="83" ry="103" fill="#7d7d7d"/>
  <path d="M84 104 Q108 92 132 104 Q144 126 132 148 Q120 158 108 152 Q96 158 84 148 Q72 126 84 104 Z" fill="${ROJO}" opacity=".9"/>
  ${et(108, 126, "−2", ROJO)}`);
// Protuberancia y hemisferios cerebelosos.
const pons = marco(`<ellipse cx="108" cy="132" rx="84" ry="92" fill="#e9e9e9"/><ellipse cx="108" cy="132" rx="79" ry="87" fill="#6f6f6f"/>
  <ellipse cx="108" cy="92" rx="26" ry="22" fill="${ROJO}" opacity=".9"/>
  <ellipse cx="72" cy="160" rx="36" ry="40" fill="${NARANJA}" opacity=".9"/><ellipse cx="144" cy="160" rx="36" ry="40" fill="${NARANJA}" opacity=".9"/>
  ${et(108, 92, "−2", ROJO)}${et(72, 162, "−1", NARANJA)}${et(144, 162, "−1", NARANJA)}`);
lienzo(
  "PC-ASPECTS: circulación posterior",
  "Partir de 10 y restar por cada región con cambio isquémico temprano",
  `<div class="cortes"><div class="corte">${talamos}<div class="r">Tálamos y occipitales</div></div>
     <div class="corte">${meso}<div class="r">Mesencéfalo</div></div>
     <div class="corte">${pons}<div class="r">Protuberancia y cerebelo</div></div></div>
   <div class="tabla">
     <div class="t"><b class="p" style="color:${AZUL}">−1</b>cada tálamo</div>
     <div class="t"><b class="p" style="color:${VERDE}">−1</b>cada lóbulo occipital (ACP)</div>
     <div class="t"><b class="p" style="color:${ROJO}">−2</b>mesencéfalo o protuberancia</div>
     <div class="t"><b class="p" style="color:${NARANJA}">−1</b>cada hemisferio cerebeloso</div></div>
   <div class="nota">Oclusión basilar: trombectomía hasta <b>24 h</b> si <b>PC-ASPECTS ≥6</b>, mRS previo <b>0-1</b> y NIHSS <b>≥10</b> (Clase I); NIHSS 6-9: Clase IIb.</div>`,
  "Esquema, no TC real. Fuentes: Figura 2 de la guía AHA/ASA 2026 y Puetz V et al., Stroke 2008."
);
</script></body></html>
