<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="real.js"></script></head><body>
<script>
// Infarto ya establecido de la ACM derecha: TC real de Lucien Monfils (Wikimedia Commons, CC BY-SA 4.0),
// con el contorno de la hipodensidad franca y rótulos de Empirica.
const AMB = "#FDBA74", CEL = "#7DD3FC";
const tarjeta = (c, t, x) => `<div style="border-left:5px solid ${c};background:#F3F4F6;border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.3"><b>${t}</b><br>${x}</div>`;
lienzo("TC: infarto ya establecido", "Hipodensidad franca de la ACM derecha, con efecto de masa",
  `<div class="paneles" style="gap:14px">
    <div style="flex:none;width:340px">${panel({ img: "fuentes/tc_infarto_acm_monfils.jpg", w: 800, h: 1000, vista: [40, 20, 720, 847], ancho: 340, alto: 400,
      dibujo: (e) => `<polygon points="345,95 420,260 385,430 330,560 305,700 300,850 205,845 130,720 102,520 122,335 178,218 255,128" fill="${AMB}" fill-opacity=".10" stroke="${AMB}" stroke-width="${3 * e}" stroke-dasharray="${9 * e} ${6 * e}"/>`
        + rotulo(250, 410, "hipodensidad", AMB, e, "middle") + rotulo(250, 440, "franca", AMB, e, "middle")
        + flecha(600, 230, 432, 415, CEL, e) + rotulo(600, 160, "ventrículo", CEL, e, "middle") + rotulo(600, 190, "derecho", CEL, e, "middle") + rotulo(600, 220, "borrado", CEL, e, "middle") })}</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center">
      ${tarjeta(AMB, "Hipodensidad franca", "Más oscura que la sustancia blanca sana del lado opuesto: es tejido ya infartado.")}
      ${tarjeta(CEL, "Efecto de masa", "El ventrículo lateral de ese lado se borra y la línea media se desvía.")}
      ${tarjeta("#EF5454", "No trombolizar", "Si la hipodensidad franca explica los síntomas, la trombólisis no se da.")}
    </div></div>`,
  "Imagen: Lucien Monfils, Wikimedia Commons, CC BY-SA 4.0, rotulada por Empirica. Fuente: AHA/ASA 2026, Tabla 8.");
</script></body></html>
