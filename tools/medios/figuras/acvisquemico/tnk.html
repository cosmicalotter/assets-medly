<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .bandas{display:flex;gap:10px;flex:1;align-items:stretch}
  .b{flex:1;border-radius:14px;background:#F7F8FA;border:2px solid #E5E7EB;display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:6px}
  .peso{font-size:15px;font-weight:700}
  .mg{font-size:26px;font-weight:800;color:var(--teal);line-height:1}
  .mg small{font-size:14px;font-weight:700}
  .ml{font-size:13px;color:var(--suave)}
  .alt{border-radius:12px;background:#F3F4F6;padding:10px 14px;font-size:13.5px;line-height:1.35}
  .barra{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:6px;font-size:11.5px;font-weight:700;color:#fff}
  .barra div{display:flex;align-items:center;justify-content:center}
</style></head><body>
<script>
const B = [["&lt;60 kg", "15", "3"], ["60 a &lt;70 kg", "17,5", "3,5"], ["70 a &lt;80 kg", "20", "4"], ["80 a &lt;90 kg", "22,5", "4,5"], ["≥90 kg", "25", "5"]];
// Jeringa de 5 mL: el émbolo marca el volumen de cada banda.
const jeringa = (ml) => {
  const alto = 150, y0 = 14, lleno = (alto * ml) / 5;
  return `<svg width="54" height="200" viewBox="0 0 54 200">
    <rect x="22" y="0" width="10" height="10" rx="2" fill="#9CA3AF"/>
    <rect x="12" y="${y0}" width="30" height="${alto}" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="14" y="${y0 + alto - lleno}" width="26" height="${lleno - 2}" rx="3" fill="#18B9A9" opacity=".75"/>
    ${[1, 2, 3, 4].map((k) => `<line x1="12" x2="20" y1="${y0 + alto - (alto * k) / 5}" y2="${y0 + alto - (alto * k) / 5}" stroke="#9CA3AF"/>`).join("")}
    <rect x="25" y="${y0 + alto}" width="4" height="22" fill="#9CA3AF"/>
    <rect x="18" y="${y0 + alto + 20}" width="18" height="6" rx="2" fill="#9CA3AF"/>
  </svg>`;
};
lienzo(
  "Tenecteplasa: 0,25 mg/kg, máx. 25 mg",
  "Bolo IV único por bandas de peso · vial reconstituido a 5 mg/mL",
  `<div class="bandas">${B.map(([p, mg, ml]) => `<div class="b"><div class="peso">${p}</div>${jeringa(parseFloat(ml.replace(",", ".")))}<div class="mg">${mg} <small>mg</small></div><div class="ml">${ml} mL</div></div>`).join("")}</div>
   <div class="alt"><b>Alteplasa 0,9 mg/kg (máx. 90 mg)</b>: 10 % en bolo en 1 min y el resto en infusión de 60 min. No retrasar la trombólisis por pesar al paciente: con peso estimado, las bandas de 1 kg no son más seguras que las de 10 kg.
     <div class="barra"><div style="width:10%;background:#7B6CF6">10 %</div><div style="width:90%;background:#4F8CF6">90 % en 60 min</div></div></div>`,
  "Esquema de la Tabla 7 de la guía AHA/ASA 2026 del ACV isquémico agudo (Prabhakaran et al., Stroke 2026). Dosis de adultos."
);
</script></body></html>
