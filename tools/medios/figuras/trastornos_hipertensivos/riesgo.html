// Factores de riesgo de preeclampsia (GPC MinSalud 2013, sección 2, preguntas 1 y 2, p. 38-39; Res. 3280 de 2018, p. 272).
lienzo("¿Quién recibe aspirina?", "Factores de riesgo de preeclampsia en la primera consulta",
  `${filaC(tarjeta(ROJO, "Riesgo alto: basta uno", [
      "Trastorno hipertensivo en un <b>embarazo anterior</b>", "<b>Enfermedad renal</b> crónica", "<b>Lupus</b> o síndrome antifosfolípido",
      "<b>Diabetes</b> tipo 1 o tipo 2", "<b>Hipertensión</b> crónica"], { grande: true }) +
    tarjeta(NARANJA, "Riesgo moderado: dos o más", [
      "<b>Primer</b> embarazo", "Edad de <b>40 años</b> o más", "Más de <b>10 años</b> desde el último embarazo",
      "IMC de <b>35</b> o más en la primera consulta", "<b>Madre o hermana</b> con preeclampsia", "Embarazo <b>múltiple</b>"], { grande: true }))}
   ${banda(`Un factor alto o dos moderados → <span style="color:#FCA5A5">ácido acetilsalicílico 75-100 mg</span> cada noche desde la <span style="color:#5EEAD4">semana 12</span> hasta el parto.`)}`,
  "Esquema de Empirica. Fuentes: GPC MinSalud 2013, sección 2 (p. 38-39); Resolución 3280 de 2018 (p. 272).");
</script></body></html>
