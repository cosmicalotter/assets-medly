<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Fisiología: remodelación de las arterias espirales y desequilibrio angiogénico (ACOG 2020, p. e240-e242: falla de la
// transformación de las arterias espirales, isquemia uteroplacentaria y aumento de los factores antiangiogénicos;
// ESC 2025, p. 4517-4519: sFlt-1/PlGF <38 descarta y ≥85 apoya). GIF: la sangre fluye ancha y lenta en el normal y
// estrecha y a chorro en la preeclampsia; el sFlt-1 sube y el PlGF baja.
function panel(tipo, t) {
  const pre = tipo === "pre";
  const c = pre ? ROJO : VERDE;
  const ancho = pre ? 14 : 46;            // luz de la arteria a la entrada de la placenta
  const W = 320, H = 300;
  // arteria espiral: de abajo (útero) hacia arriba (placenta)
  const curva = (dx) => { let d = ""; for (let k = 0; k <= 40; k++) { const y = 268 - k * 5.4; const x = 160 + Math.sin(k / 40 * Math.PI * 3) * 34 + dx * (pre ? 1 : 0.4 + 0.6 * k / 40); d += (k ? " L" : "M") + x + " " + y; } return d; };
  const pared = (lado) => `<path d="${curva(lado * (pre ? 9 : ancho / 2))}" fill="none" stroke="${pre ? "#9F1239" : "#166534"}" stroke-width="${pre ? 7 : 4}" stroke-linecap="round"/>`;
  const part = [];
  for (let k = 0; k < (pre ? 7 : 14); k++) {
    const f = ((t * (pre ? 2.2 : 0.9) + k / (pre ? 7 : 14)) % 1);
    const kk = Math.round(f * 40), y = 268 - kk * 5.4, x = 160 + Math.sin(kk / 40 * Math.PI * 3) * 34 + (((k * 37) % 9) - 4) * (pre ? 0.6 : 2.2 + 2 * kk / 40);
    part.push(`<circle cx="${x}" cy="${y}" r="${pre ? 4 : 5}" fill="#DC2626" opacity=".85"/>`);
  }
  const salida = pre
    ? `<path d="M152 52 Q160 18 168 52" fill="none" stroke="#DC2626" stroke-width="5"/><text x="160" y="12" text-anchor="middle" font-size="13" font-weight="800" fill="#9F1239">chorro rápido</text>`
    : `<ellipse cx="160" cy="44" rx="78" ry="16" fill="${tinte("#DC2626", 25)}"/><text x="160" y="16" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">flujo lento y amplio</text>`;
  return `<svg width="250" height="234" viewBox="0 0 ${W} ${H}">
    <rect x="0" y="28" width="${W}" height="40" rx="10" fill="${tinte(MORADO, 18)}"/><text x="12" y="88" font-size="12.5" font-weight="700" fill="${MORADO}">Placenta</text>
    <rect x="0" y="230" width="${W}" height="70" rx="10" fill="${tinte(AMBAR, 16)}"/><text x="12" y="292" font-size="12.5" font-weight="700" fill="#B26B10">Útero</text>
    ${salida}${pared(-1)}${pared(1)}${part.join("")}</svg>`;
}
function barra(nombre, v, c) {
  return `<div style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800"><span style="width:52px">${nombre}</span>
    <div style="flex:1;height:14px;background:#F1F5F9;border-radius:7px"><div style="width:${Math.round(v * 100)}%;height:14px;background:${c};border-radius:7px"></div></div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 0;
  const u = suave(tramo(t, 0.2, 0.8));
  const caja = (tipo, tit, sub, sflt, plgf) => `<div style="flex:1;min-width:0;border:2px solid ${tipo === "pre" ? ROJO : VERDE};border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:${tinte(tipo === "pre" ? ROJO : VERDE, 6)}">
    <div style="font-weight:900;font-size:16px;color:${tipo === "pre" ? ROJO : VERDE}">${tit}</div><div style="font-size:12.5px;line-height:1.3">${sub}</div>
    <div style="display:flex;justify-content:center">${panel(tipo, t)}</div>${barra("sFlt-1", sflt, ROJO)}${barra("PlGF", plgf, VERDE)}</div>`;
  lienzo("Por qué falla la placenta en la preeclampsia", "Arterias espirales del útero y factores angiogénicos",
    `${fila(caja("normal", "Embarazo normal", "Arteria remodelada: <b>ancha</b> y de baja resistencia", 0.25, 0.8) +
            caja("pre", "Preeclampsia", "Arteria <b>estrecha</b>: isquemia placentaria", 0.3 + 0.55 * u, 0.75 - 0.6 * u))}
     ${banda(`sFlt-1/PlGF <span style="color:#86EFAC">&lt;38</span> descarta la preeclampsia en 7 días; <span style="color:#FCA5A5">≥85</span> la apoya.`)}`,
    "Esquema animado de Empirica. Fuentes: ACOG 2020 (p. e240-e242); ESC 2025 (p. 4517 y 4519).");
};
window.cuadro(0, 24);
</script></body></html>
