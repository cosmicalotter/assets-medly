<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Clasificación (ISSHP 2021, tabla 1, p. 152; ACOG 2020, recuadros 2-3, p. e238-e239; criterios del HELLP y eclampsia, p. e239-e240).
const ROSA_E = "#DB2777", TURQ = "#14B8A6";
lienzo("Los seis trastornos hipertensivos", "Cada uno tiene su cadena de tratamiento y su color",
  `${filaC(tarjeta(AZUL, "Hipertensión crónica", ["Antes del embarazo o antes de la <b>semana 20</b>", "Es <b>sobreagregada</b> si aparece un hallazgo nuevo de preeclampsia"], { grande: true, fs: 16.5 }) +
          tarjeta(TURQ, "Hipertensión gestacional", ["Desde la <b>semana 20</b>, sin proteinuria ni daño de órganos", "Una de cada cuatro antes de la semana 34 pasa a <b>preeclampsia</b>"], { grande: true, fs: 16.5 }) +
          tarjeta(NARANJA, "Preeclampsia", ["≥20 semanas con <b>proteinuria</b>, daño de un órgano o de la <b>placenta</b>", "La proteinuria <b>no</b> es obligatoria"], { grande: true, fs: 16.5 }))}
   ${filaC(tarjeta(ROJO, "Con criterios de gravedad", ["Presión <b>≥160/110</b>", "Plaquetas <b><100.000</b>", "Creatinina <b>>1,1</b>, edema pulmonar o cefalea"], { grande: true, fs: 16.5 }) +
          tarjeta(MORADO, "Síndrome HELLP", ["<b>Hemólisis</b> (LDH ≥600)", "<b>Transaminasas</b> al doble", "<b>Plaquetas</b> <100.000"], { grande: true, fs: 16.5 }) +
          tarjeta(ROSA_E, "Eclampsia", ["<b>Convulsión</b> sin otra causa", "Antes, durante o <b>después</b> del parto"], { grande: true, fs: 16.5 }))}`,
  "Esquema de Empirica. Fuentes: ISSHP 2021, tabla 1, recomendación 11 y p. 152-153; ACOG 2020, recuadros 2 y 3 y criterios del HELLP (p. e238-e240).");
</script></body></html>
