<!doctype html>
<!--
  Plantilla de las ilustraciones propias de Empirica. Se copia al scratchpad,
  se cambia el dibujo y se pasa por tools/medios/capturar.js.

  Reglas: 720×540 (4:3, se lee en la tarjeta de 288 px y a pantalla completa),
  fondo blanco, tonos del contrato, rótulos en español y cifras en negrita.
  `cuadro(i, total)` dibuja el estado i; con --cuadros 1 sale un PNG estático.

  El ejemplo es el llenado capilar: presión, blanqueo y recoloración con el
  cronómetro, para que se vea qué es normal. Sustituir entero por el tema.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --teal: #18B9A9; --violeta: #7B6CF6; --rojo: #EF5454; --ambar: #F2A23A;
    --verde: #2FB36D; --azul: #4F8CF6; --celeste: #3BA7E0;
    --tinta: #1F2A37; --suave: #6B7280; --linea: #E5E7EB;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #fff; font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif; color: var(--tinta); }
  #lienzo { width: 720px; height: 540px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; background: #fff; }
  .cabecera { display: flex; align-items: center; justify-content: space-between; }
  .titulo { font-size: 26px; font-weight: 700; }
  .marca { font-size: 13px; font-weight: 600; color: var(--teal); letter-spacing: .08em; text-transform: uppercase; }
  .escena { flex: 1; border: 1px solid var(--linea); border-radius: 16px; display: grid; place-items: center; }
  .pie { display: flex; gap: 10px; }
  .paso { flex: 1; padding: 10px 12px; border-radius: 10px; background: #F3F4F6; color: var(--suave); font-size: 15px; }
  .paso b { color: var(--tinta); }
  .paso.activo { background: color-mix(in srgb, var(--teal) 14%, white); color: var(--tinta); outline: 2px solid var(--teal); }
  .tarjeta { border-radius: 14px; padding: 14px 16px; background: #F3F4F6; font-size: 17px; line-height: 1.35; }
  .tarjeta b { color: var(--tinta); }
  .rot { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); margin-bottom: 4px; }
</style>
</head>
<body>
<div id="lienzo">
  <div class="cabecera"><div class="titulo">Seguridad diaria</div><div class="marca">Empirica</div></div>
  <div class="escena"><div style="width:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
   <div class="tarjeta" style="border-top:6px solid var(--azul);text-align:center"><svg width="120" height="110" viewBox="0 0 120 110"><path d="M30 20 h40 v10" stroke="#6B7280" stroke-width="5" fill="none"/><circle cx="70" cy="38" r="9" fill="#9CA3AF"/>
     <g stroke="#4F8CF6" stroke-width="3"><line x1="62" y1="52" x2="56" y2="72"/><line x1="70" y1="52" x2="70" y2="74"/><line x1="78" y1="52" x2="84" y2="72"/></g><rect x="25" y="92" width="70" height="8" rx="4" fill="#D1D5DB"/></svg>
     <div><b>Ducha</b>, no baño en tina</div></div>
   <div class="tarjeta" style="border-top:6px solid var(--teal);text-align:center"><svg width="120" height="110" viewBox="0 0 120 110"><path d="M5 70 q15 -12 30 0 t30 0 t30 0 t30 0" stroke="#4F8CF6" stroke-width="5" fill="none"/>
     <circle cx="60" cy="52" r="10" fill="#F6D7C3" stroke="#D9B39C" stroke-width="2"/><circle cx="100" cy="28" r="10" fill="#F6D7C3" stroke="#D9B39C" stroke-width="2"/><path d="M100 40 v24" stroke="#18B9A9" stroke-width="6"/><path d="M86 30 q-8 4 -14 14" stroke="#18B9A9" stroke-width="3" fill="none"/></svg>
     <div>Natación <b>siempre vigilada</b></div></div>
   <div class="tarjeta" style="border-top:6px solid var(--ambar);text-align:center"><svg width="120" height="110" viewBox="0 0 120 110"><line x1="30" y1="100" x2="30" y2="10" stroke="#8B6F5E" stroke-width="5"/><line x1="70" y1="100" x2="70" y2="10" stroke="#8B6F5E" stroke-width="5"/>
     <line x1="30" y1="30" x2="70" y2="30" stroke="#8B6F5E" stroke-width="4"/><line x1="30" y1="55" x2="70" y2="55" stroke="#8B6F5E" stroke-width="4"/><line x1="30" y1="80" x2="70" y2="80" stroke="#8B6F5E" stroke-width="4"/>
     <circle cx="95" cy="30" r="16" fill="none" stroke="#EF5454" stroke-width="5"/><line x1="84" y1="41" x2="106" y2="19" stroke="#EF5454" stroke-width="5"/></svg>
     <div>No trepar alturas <b>sin supervisión</b></div></div>
 </div></div>
  <div class="pie"><div class="paso activo">Hablarlo con la familia en <b>cada consulta</b></div></div>
</div>
<script>window.cuadro=function(){};</script>
</body></html>
