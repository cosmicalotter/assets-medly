<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="../biliar/base.js"></script></head><body>
<script>
// Plan de emergencia individual: lo que debe decir (NICE NG217, pág. 121: qué medicación, quién
// está entrenado y cuándo darla; 7.1.2, pág. 118: si está a mano, se sigue) y la dosis estándar de
// midazolam bucal por edad, con el color de la etiqueta de cada jeringa (ficha técnica de Buccolam,
// EMA, 4.1 y 4.2, págs. 2-3). Una sola dosis en casa; si no cede en 10 min, emergencias y la jeringa
// vacía al sanitario (4.2, pág. 3).
const DOSIS = [
  ["3-6 meses", "sólo en el hospital", "2,5 mg", "#FACC15", "amarilla"],
  ["6 meses a <1 año", "", "2,5 mg", "#FACC15", "amarilla"],
  ["1 a <5 años", "", "5 mg", "#3B82F6", "azul"],
  ["5 a <10 años", "", "7,5 mg", "#8B5CF6", "morada"],
  ["≥10 años y adultos", "", "10 mg", "#F97316", "naranja"],
];
const fila = ([edad, nota, mg, col, nombre]) => `
  <div style="flex:1;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:#fff">
    <div style="width:64px;height:20px;border-radius:5px;background:${col};position:relative;flex:none;margin-right:14px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)">
      <div style="position:absolute;right:-12px;top:7px;width:12px;height:6px;border-radius:0 3px 3px 0;background:#D1D5DB"></div></div>
    <div style="flex:1;font-size:13.5px;line-height:1.2"><b>${edad}</b>${nota ? `<div style="font-size:11.5px;color:#B45309;font-weight:600">${nota}</div>` : ""}</div>
    <div style="font-size:12px;color:var(--suave);width:84px">etiqueta ${nombre}</div>
    <div style="font-size:16px;font-weight:800;width:58px;text-align:right">${mg}</div>
  </div>`;
const campo = (col, rot, txt) => `
  <div style="flex:1;border-radius:12px;background:#F7F8FA;border-left:5px solid ${col};padding:9px 12px">
    <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--suave)">${rot}</div>
    <div style="font-size:14px;line-height:1.3;margin-top:2px">${txt}</div></div>`;
lienzo("Plan de emergencia individual",
  "Si está a mano, se sigue antes que el protocolo general",
  `<div style="display:flex;gap:12px;flex:1;min-height:0">
     <div style="width:250px;display:flex;flex-direction:column;gap:8px">
       ${campo("#4F8CF6", "QUÉ", "Medicación de rescate y su dosis, p. ej. <b>midazolam bucal</b>")}
       ${campo("#18B9A9", "QUIÉN", "Quién está <b>entrenado</b> para darla: padres, colegio, cuidadores")}
       ${campo("#F2A23A", "CUÁNDO", "A los minutos que fije el plan; sin plan, a los <b>5 min</b> de crisis")}
     </div>
     <div style="flex:1;border-radius:14px;background:#F3F4F6;padding:10px;display:flex;flex-direction:column;gap:6px">
       <div style="font-size:12.5px;font-weight:800;color:var(--suave);letter-spacing:.04em;padding:0 2px 2px">MIDAZOLAM BUCAL · DOSIS POR EDAD</div>
       ${DOSIS.map(fila).join("")}
     </div>
   </div>
   <div style="background:#1F2A37;color:#fff;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:600;line-height:1.35">
     En casa, <b>una sola dosis</b>. No cede en <b style="color:#FCA5A5">10 min</b> → emergencias, y dar la jeringa vacía al sanitario.</div>`,
  "Ilustración de Empirica. Fuentes: NICE NG217 (7.1.2 y justificación, págs. 118 y 121) y ficha técnica de Buccolam (EMA, 4.1-4.2).");
</script></body></html>
