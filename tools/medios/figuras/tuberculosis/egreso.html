<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Resultados del tratamiento de la TB sensible (Res. 227 de 2020, tabla 2 y notas, p. 33-34).
const t = (c, tit, txt, sig) => `<div style="border:2px solid ${c};background:${tinte(c, 10)};border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:4px">
  <div style="font-weight:900;font-size:17px;color:${c === AMBAR ? "#B26B10" : c}">${tit}</div><div style="font-size:14px;line-height:1.38;flex:1">${txt}</div>
  <div style="font-size:13px;font-weight:800;color:#334155">→ ${sig}</div></div>`;
lienzo("¿Cómo terminó el tratamiento?", "Resultados de la TB sensible para la cohorte",
  `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1">
    ${t(VERDE, "Curado", "TB pulmonar <b>confirmada</b>, con baciloscopia o cultivo negativo en el <b>último mes</b> y en otro control previo.", "Control a los 6 meses")}
    ${t(TEAL, "Tratamiento terminado", "Completó <b>sin fracaso</b> pero sin esos controles; también la <b>extrapulmonar</b> y la diagnosticada por clínica.", "Control a los 6 meses")}
    ${t(ROJO, "Fracaso", "Baciloscopia o cultivo <b>positivo</b> en el <b>4.º mes</b> o después.", "Sensibilidad y cultivo; segunda línea si hay resistencia")}
    ${t(AMBAR, "Pérdida en el seguimiento", "No inició el tratamiento o lo interrumpió <b>1 mes</b> o más.", "Visitas hasta que reingrese")}
  </div>`,
  "Esquema de Empirica. Fuente: Resolución 227 de 2020 (MinSalud), tabla 2 y sus notas (p. 33-34).");
</script></body></html>
