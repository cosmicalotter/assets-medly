<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Cronograma de visitas a los contactos según el caso índice (Res. 227 de 2020, 2.2, p. 38-39).
const x0 = 40, x1 = 640;
function eje(y, meses, marcas, c, finTto) {
  const X = (m) => x0 + (m / meses) * (x1 - x0);
  return `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    ${finTto ? `<rect x="${x0}" y="${y - 16}" width="${X(finTto) - x0}" height="32" rx="8" fill="${tinte(c, 14)}"/>
      <text x="${(x0 + X(finTto)) / 2}" y="${y - 22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">Tratamiento del caso índice</text>` : ""}
    ${marcas.map(([m, t]) => `<circle cx="${X(m)}" cy="${y}" r="12" fill="${c}" stroke="#fff" stroke-width="3"/>
      <text x="${X(m)}" y="${y + 32}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${TINTA}">${t}</text>`).join("")}`;
}
const s = `<svg width="668" height="128" viewBox="0 0 668 128">${eje(64, 12, [[0.25, "1.ª semana"], [6, "6 meses"], [12, "1 año"]], AZUL)}</svg>`;
const marcasFR = [[0.25, "1.ª sem"], [3, "3"], [6, "6"], [9, "9"], [12, "12"], [15, "15"], [18, "18"], [24, "24"], [30, "30"], [36, "36"], [42, "42 meses"]];
const fr = `<svg width="668" height="128" viewBox="0 0 668 128">${eje(64, 42, marcasFR, ROJO, 18)}</svg>`;
lienzo("Visitas a los contactos", "Cuándo volver a buscar sintomáticos respiratorios",
  `<div style="font-weight:900;color:${AZUL};font-size:17px">Caso índice con TB sensible</div>${s}
   <div style="font-weight:900;color:${ROJO};font-size:17px">Caso índice con TB farmacorresistente</div>${fr}
   <div style="display:flex;gap:10px">
     <div class="caja" style="flex:1;background:${tinte(ROJO, 10)};font-size:14px;padding:12px">Cada <b>3 meses</b> mientras dura el tratamiento (aquí, uno de <b>18 meses</b>) y cada <b>6 meses</b> durante <b>2 años</b> más.</div>
     <div class="caja" style="flex:1;background:${tinte(AZUL, 10)};font-size:14px;padding:12px">En el contacto, tos con expectoración de <b>1 día</b> o más ya es sintomático respiratorio.</div></div>`,
  "Esquema de Empirica. Fuente: Resolución 227 de 2020 (MinSalud), numeral 2.2 (p. 38-39) y tabla 1 (p. 29).");
</script></body></html>
