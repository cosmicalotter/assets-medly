<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Esquemas para la infección latente (Res. 227 de 2020, tabla 34, p. 164-165; OMS 2024, recomendaciones 19-21).
const x0 = 0, mes = 70;
const barra = (meses, c, tomas) => `<svg width="440" height="40" viewBox="0 0 440 40">
  <rect x="0" y="6" width="${6 * mes}" height="28" rx="8" fill="#F1F5F9"/>
  <rect x="0" y="6" width="${meses * mes}" height="28" rx="8" fill="${tinte(c, 40)}" stroke="${c}" stroke-width="2"/>
  <text x="${meses * mes / 2}" y="25" text-anchor="middle" font-size="13.5" font-weight="800" fill="${TINTA}">${tomas}</text></svg>`;
const fila = (c, tit, quien, meses, tomas, dosis) => `<div style="border:2px solid ${c};background:${tinte(c, 8)};border-radius:14px;padding:13px 15px">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:17px;font-weight:900;color:${c}">${tit}</div><div style="font-size:13.5px;font-weight:700;color:#475569">${quien}</div></div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:5px">${barra(meses, c, tomas)}<div style="font-size:14.5px;line-height:1.38">${dosis}</div></div></div>`;
lienzo("Infección latente: tres esquemas", "Duración, tomas y para quién (Colombia)",
  `${fila(AZUL, "Isoniacida (6H)", "Esquema de base", 6, "6 meses · diaria", "<b>5 mg/kg</b> (niño 10); máx. 300 mg")}
   ${fila(MORADO, "Isoniacida y rifapentina (3HP)", "Persona con VIH", 3, "12 dosis semanales", "Siempre <b>supervisadas</b>; ojo con el TAR")}
   ${fila(ROJO, "Levofloxacina (6Lfx)", "Contacto de TB MDR/RR", 6, "6 meses · diaria", "Si la cepa es <b>sensible</b> a quinolonas")}
   <div class="caja" style="background:#1F2A37;color:#fff;font-size:14px;padding:11px 13px"><b style="color:#5EEAD4">OMS 2024:</b> también <b>3HR</b>, <b>1HP</b> y <b>4R</b>, sin importar el VIH; levofloxacina a todo contacto de TB MDR/RR.</div>`,
  "Esquema de Empirica. Fuentes: Resolución 227 de 2020 (MinSalud), anexo 4, tabla 34 (p. 164-165); OMS, tratamiento preventivo de la TB, 2.ª ed., 2024, recomendaciones 19-21.");
</script></body></html>
