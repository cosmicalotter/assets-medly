<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Qué hacer con el resultado de la prueba molecular (Res. 227 de 2020, 3.1, 3.3 y anexo 1; tablas 9-11).
const t = (c, tit, txt) => `<div style="border:2px solid ${c};background:${tinte(c, 10)};border-radius:14px;padding:16px 16px">
  <div style="font-weight:900;font-size:19px;color:${c === AMBAR ? "#B26B10" : c}">${tit}</div><div style="font-size:16.5px;line-height:1.45;margin-top:8px">${txt}</div></div>`;
lienzo("La prueba molecular rápida", "Detecta el bacilo y la resistencia a rifampicina; resultado en 48 horas como máximo",
  `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1">
    ${t(VERDE, "Detecta, sensible a rifampicina", "Iniciar el esquema de la <b>TB sensible</b>; si no informa la isoniacida, pedirla al <b>cultivo</b>.")}
    ${t(ROJO, "Detecta, resistente a rifampicina", "Tratar como <b>MDR</b>: sensibilidad a fármacos de <b>segunda línea</b> y CERCET.")}
    ${t(AMBAR, "No interpretable o inválida", "Repetir con una <b>nueva muestra</b>, de buena calidad.")}
    ${t(GRIS, "No detecta", "Si persiste la sospecha: <b>cultivo líquido</b>; con Rx compatible, decidir por <b>clínica</b>.")}
  </div>
  <div class="caja" style="background:#1F2A37;color:#fff;font-size:14px;padding:11px 13px">Toda prueba <b style="color:#5EEAD4">positiva</b> lleva prueba de sensibilidad a fármacos.</div>`,
  "Esquema de Empirica. Fuente: Resolución 227 de 2020 (MinSalud), numerales 3.1 y 3.3, anexo 1 y tablas 9-11.");
</script></body></html>
