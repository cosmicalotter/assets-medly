<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Tabletas dispersables por peso en el menor de 25 kg (Res. 227 de 2020, tabla 29, p. 151).
const T = [["4-7", 1, 1, 1], ["8-11", 2, 2, 2], ["12-15", 3, 3, 3], ["16-20", 4, 4, 4], ["21-24", 4, 5, 4]];
const pild = (n, c) => Array.from({ length: n }, () => `<span style="display:inline-block;width:30px;height:30px;border-radius:50%;background:${c};margin-right:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)"></span>`).join("");
const col = (t, sub, c) => `<div style="font-weight:900;font-size:14.5px;color:${c}">${t}<div style="font-size:12px;font-weight:700;color:#64748B">${sub}</div></div>`;
lienzo("Tabletas dispersables por peso", "Menores de 25 kg: presentaciones dispersables",
  `<div style="display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:14px 12px;align-items:center">
     <div style="font-weight:800;color:#475569;font-size:13px">Peso (kg)</div>
     ${col("RHZ 75/50/150", "Fase intensiva · 56 dosis", ROJO)}${col("Etambutol 100 mg", "Fase intensiva · 56 dosis", VERDE)}${col("RH 75/50", "Continuación · 112 dosis", AZUL)}
     ${T.map(([p, a, b, c]) => `<div style="font-weight:900;font-size:19px">${p}</div><div>${pild(a, ROJO)}</div><div>${pild(b, VERDE)}</div><div>${pild(c, AZUL)}</div>`).join("")}
   </div>
   <div style="display:flex;gap:10px">
     <div class="caja" style="flex:1;background:#F1F5F9;font-size:14.5px;padding:12px 14px">Al llegar a <b>25 kg</b>, dosis de adulto.</div>
     <div class="caja" style="flex:1;background:#F1F5F9;font-size:14.5px;padding:12px 14px">Con <b>3 meses</b> o menos, ajusta un médico con <b>experiencia</b>.</div></div>`,
  "Esquema de Empirica. Fuente: Resolución 227 de 2020 (MinSalud), tabla 29 (p. 151), anexo 4 y numeral 4.3.");
</script></body></html>
