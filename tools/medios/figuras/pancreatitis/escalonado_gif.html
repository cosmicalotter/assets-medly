<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Abordaje escalonado de la necrosis infectada, animado (IAP 2025 recs. 32, 37, 40-44): cada paso se enciende
// sólo cuando el anterior no basta, sobre una línea de tiempo desde el inicio del dolor.
const P = [
  { c: AMBAR, n: "1", tit: "Antibiótico y soporte", txt: "Amplio espectro que penetre el páncreas; hasta el <b>39 %</b> se cura sin drenar" },
  { c: AZUL, n: "2", tit: "Esperar la pared", txt: "Retrasar la intervención <b>≥4 semanas</b> si está estable" },
  { c: TEAL, n: "3", tit: "Drenar", txt: "Percutáneo o endoscópico; basta en el <b>40-60 %</b>" },
  { c: ROJO, n: "4", tit: "Necrosectomía", txt: "Mínimamente invasiva si siguen la fiebre o la sepsis; idealmente a las <b>4-6 semanas</b>" },
];
function caja(p, op) {
  const ct = p.c === AMBAR ? "#B26B10" : p.c;
  return `<div style="opacity:${op};display:flex;gap:10px;align-items:center;border:2px solid ${p.c};background:${tinte(p.c, 12)};border-radius:12px;padding:8px 11px;width:310px">
    <div style="width:30px;height:30px;border-radius:50%;background:${p.c};color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none">${p.n}</div>
    <div><div style="font-weight:900;color:${ct};font-size:15px">${p.tit}</div><div style="font-size:12.6px;line-height:1.3;margin-top:2px">${p.txt}</div></div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const op = (a) => 0.18 + 0.82 * suave(tramo(t, a, a + 0.08));
  const X = [40, 280, 430, 600];
  let xm = X[0];
  [[0.22, 1], [0.44, 2], [0.66, 3]].forEach(([a, k]) => { xm += (X[k] - X[k - 1]) * suave(tramo(t, a, a + 0.07)); });
  const linea = `<svg width="668" height="64" viewBox="0 0 668 64">
    <line x1="40" y1="30" x2="600" y2="30" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="${xm}" y2="30" stroke="${TEAL}" stroke-width="6" stroke-linecap="round"/>
    ${X.map((x, k) => `<circle cx="${x}" cy="30" r="7" fill="#fff" stroke="#94A3B8" stroke-width="3"/>
      <text x="${x}" y="58" text-anchor="middle" font-size="12.5" font-weight="800" fill="#374151">${["Sospecha", "4 semanas", "drenaje", "4-6 semanas"][k]}</text>`).join("")}
    <circle cx="${xm}" cy="30" r="11" fill="${TEAL}" stroke="#fff" stroke-width="3"/></svg>`;
  lienzo("Necrosis infectada: el abordaje escalonado", "Cada paso sólo si el anterior no basta",
    `${linea}
     <div style="display:flex;gap:12px;justify-content:center">${caja(P[0], op(0.02))}${caja(P[1], op(0.24))}</div>
     <div style="display:flex;gap:12px;justify-content:center">${caja(P[2], op(0.46))}${caja(P[3], op(0.68))}</div>
     <div class="caja" style="opacity:${op(0.84)};background:#1F2A37;color:#fff;font-weight:700">La <b style="color:#FCA5A5">necrosectomía abierta</b> temprana tiene peor evolución: queda para las colecciones sólidas o con fístula.</div>`,
    "Esquema. Fuente: IAP 2025, recomendaciones 32, 37 y 40-44 (p. 774-775 y 784-788); WSES 2019 (p. 13).");
};
window.cuadro(39, 40);
</script></body></html>
