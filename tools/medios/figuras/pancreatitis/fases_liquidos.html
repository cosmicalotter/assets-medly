  ["Estabilización", "Estable: sólo el mantenimiento.", AZUL],
  ["Desescalada", "Sobrecarga: buscar un balance negativo.", VERDE],

const caja = F.map(([t, d, c], i) => `<div style="flex:1;display:flex;flex-direction:column;gap:8px">
   <div style="height:${150 - i * 30}px;background:${tinte(c, 30)};border:2px solid ${c};border-radius:10px;margin-top:${i * 30}px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:15px;font-weight:800;color:${c}">${i + 1}</div>

lienzo("Los líquidos cambian con la fase", "Cuánto líquido hace falta baja a medida que el paciente se estabiliza",
