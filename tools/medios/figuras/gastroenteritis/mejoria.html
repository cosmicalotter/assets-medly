<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .cols{display:flex;gap:12px;flex:1;min-height:0}
  .col{flex:1;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .si{background:color-mix(in srgb,var(--verde) 10%,white);border:2px solid var(--verde)}
  .no{background:color-mix(in srgb,var(--suave) 8%,white);border:2px dashed #9CA3AF}
  h4{font-size:19px}
  .si h4{color:#1d7a49}.no h4{color:#4B5563}
  .it{display:flex;gap:14px;align-items:center;font-size:18px;line-height:1.3}
  .it svg{flex:none}
  .barra{border-radius:12px;padding:9px 12px;font-size:13.5px;background:color-mix(in srgb,var(--azul) 10%,white)}
</style></head><body>
<script>
const gota = (c, tachada) => `<svg width="70" height="70" viewBox="0 0 46 46"><path d="M23 6 C30 17 36 24 36 30 a13 13 0 0 1 -26 0 C10 24 16 17 23 6Z" fill="${c}" opacity=".85"/>${tachada ? `<path d="M8 40 L38 8" stroke="#1F2A37" stroke-width="4" stroke-linecap="round"/>` : ""}</svg>`;
lienzo(
  "Disentería: qué cuenta como mejoría",
  "Control clínico a las 48 h, con o sin antibiótico",
  `<div class="cols">
    <div class="col si"><h4>Sí es mejoría</h4>
      <div class="it">${gota(ROJO, true)}<div>Desaparece la <b>sangre</b> de las heces</div></div>
      <div class="it"><svg width="70" height="70" viewBox="0 0 46 46">${cara(23, 24, 18)}</svg><div>Mejoran los signos de compromiso del <b>estado general</b></div></div></div>
    <div class="col no"><h4>No hace falta</h4>
      <div class="it">${gota("#A16207", false)}<div>Que se quite la <b>diarrea</b>: no es el criterio de mejoría</div></div></div>
  </div>
  <div class="barra">Igual o con <b>Shigella</b> en el cultivo → ácido nalidíxico. Peor o sin mejoría con el nalidíxico → <b>segunda línea IV</b> en el hospital.</div>`,
  FUENTE_GPC + " Algoritmo I (p. 235)."
);
</script></body></html>
