<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .rej{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
  .t{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,white);display:flex;align-items:center;gap:12px;padding:10px 12px}
  .t h3{font-size:17px;color:var(--c);margin-bottom:4px}
  .t div{font-size:14px;line-height:1.3}
  .t svg{flex:none}
</style></head><body>
<script>
const I = (svg) => `<svg width="104" height="104" viewBox="0 0 64 64">${svg}</svg>`;
const TILES = [
  [TEAL, "Salina al 3 % nebulizada", "En el <b>hospitalizado</b>: acorta la estancia. No para evitar el ingreso.",
    I(`<rect x="18" y="30" width="28" height="26" rx="6" fill="${tinte(TEAL, 30)}" stroke="${TEAL}" stroke-width="3"/><path d="M26 30 v-8 h12 v8" stroke="${TEAL}" stroke-width="3" fill="none"/>${[0, 1, 2].map((k) => `<circle cx="${24 + k * 8}" cy="${14 - (k % 2) * 4}" r="3.5" fill="${TEAL}" opacity=".6"/>`).join("")}<text x="32" y="49" text-anchor="middle" font-size="11" font-weight="800" fill="${TEAL}">3 %</text>`)],
  [AZUL, "Sonda nasogástrica u orogástrica", "Si <b>no bebe lo suficiente</b> por boca.",
    I(`${cara(26, 26, 18)}<path d="M38 24 C52 24 54 44 40 50 C30 54 28 60 30 62" stroke="${AZUL}" stroke-width="4" fill="none" stroke-linecap="round"/>`)],
  [AMBAR, "Aspirar la nariz", "Sólo si las secreciones <b>dificultan respirar o comer</b>.",
    I(`${cara(24, 30, 18)}<path d="M40 28 L58 18" stroke="${AMBAR}" stroke-width="6" stroke-linecap="round"/><circle cx="40" cy="28" r="3.5" fill="${AMBAR}"/>`)],
  [ROJO, "CPAP", "Ante el <b>fallo respiratorio inminente</b>.",
    I(`${cara(26, 30, 18)}<path d="M28 26 q16 4 0 16 Z" fill="${tinte(ROJO, 35)}" stroke="${ROJO}" stroke-width="3"/><path d="M40 34 C50 34 52 20 60 20" stroke="${ROJO}" stroke-width="4" fill="none" stroke-linecap="round"/>`)],
];
lienzo("Bronquiolitis en el hospital: soporte", "Cuándo usar cada medida",
  `<div class="rej">${TILES.map(([c, t, x, s]) => `<div class="t" style="--c:${c}">${s}<div><h3>${t}</h3><div>${x}</div></div></div>`).join("")}</div>`,
  "Esquema. Fuentes: GPC 42 MinSalud 2014 (p. 34); NICE NG9 2021 (p. 18).");
</script></body></html>
