<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .esc{flex:1;min-height:0}
  .nota{display:flex;gap:8px}
  .nota .caja{flex:1}
</style></head><body>
<script>
// Inhalador presurizado dentro de la cámara espaciadora con máscara facial, y la
// línea de tiempo de la prueba: 200 mcg cada 10 min, evaluar a más tardar a los 60 min.
const nino = `${cara(118, 120, 62)}`;
const mascara = `<path d="M176 82 q34 38 0 78 l26 -6 q12 -33 0 -66 Z" fill="${tinte(TEAL, 35)}" stroke="${TEAL}" stroke-width="4" stroke-linejoin="round"/>`;
const camara = `<rect x="200" y="96" width="210" height="50" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <path d="M200 106 L190 112 L190 130 L200 136" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>`;
const inhalador = `<g transform="translate(410,62)"><rect x="0" y="40" width="22" height="44" rx="5" fill="${tinte(AZUL, 30)}" stroke="${AZUL}" stroke-width="3"/>
  <rect x="22" y="0" width="34" height="96" rx="10" fill="${AZUL}" stroke="#2F5FB3" stroke-width="3"/>
  <rect x="30" y="-8" width="18" height="12" rx="3" fill="#2F5FB3"/></g>`;
const etiquetas = `<text x="196" y="40" font-size="15" font-weight="700" fill="${TEAL}">Máscara: nariz y boca</text>
  <text x="300" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Cámara espaciadora</text>
  <text x="438" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="${AZUL}">Inhalador</text>`;
const linea = (() => {
  const x0 = 50, x1 = 590, y = 262;
  const X = (m) => x0 + ((x1 - x0) * m) / 60;
  const marcas = [0, 10, 20, 30, 40, 50].map((m) => `<path d="M${X(m)} ${y - 9} v18" stroke="#94A3B8" stroke-width="3"/><text x="${X(m)}" y="${y + 30}" text-anchor="middle" font-size="14" fill="#475569">${m} min</text>`).join("");
  return `<path d="M${x0} ${y} H${X(60)}" stroke="${tinte(AZUL, 45)}" stroke-width="10" stroke-linecap="round"/>${marcas}
    <text x="${X(25)}" y="${y - 22}" text-anchor="middle" font-size="16" font-weight="800" fill="${AZUL}">200 mcg cada 10 min hasta evaluar</text>
    <path d="M${X(60)} ${y - 26} v40" stroke="${VERDE}" stroke-width="5" stroke-linecap="round"/>
    <text x="${X(60)}" y="${y + 36}" text-anchor="middle" font-size="15" font-weight="800" fill="${VERDE}">evaluar ≤60 min</text>`;
})();
lienzo("Salbutamol con espaciador y máscara", "Prueba terapéutica única ante la sospecha de asma: inhalado, nunca nebulizado",
  `<svg class="esc" viewBox="0 0 680 310">${nino}${camara}${mascara}${inhalador}${etiquetas}${linea}</svg>
   <div class="nota"><div class="caja" style="background:${tinte(VERDE, 12)}">A más tardar a los <b>60 min</b>: ¿bajó la <b>frecuencia respiratoria</b> y subió la <b>saturación</b>? Si mejoran, añadir esteroide y pensar en asma.</div></div>`,
  FUENTE_GPC + ", p. 33.");
</script></body></html>
