<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Animación de farmacología: betalactámico en bolo frente a infusión extendida tras una dosis de carga
// (SSC 2026, rec. 33, pp. 888-889; ACIN 2021, p. 224: infusión de 3-4 h). Curvas ilustrativas, no datos de un fármaco.
const W = 668, H = 300, X0 = 56, X1 = 645, Y0 = 256, Y1 = 16, TMAX = 18, CMAX = 1.25, CIM = 0.32;
const x = (h) => X0 + (X1 - X0) * h / TMAX, y = (c) => Y0 - (Y0 - Y1) * c / CMAX;
const k = Math.log(2) / 1.0;                                             // vida media corta (≈1 h), como la piperacilina
function bolo(h) { let c = 0; for (let d = 0; d <= h; d += 6) { const tt = h - d; c += tt < 0.5 ? (tt / 0.5) * 1.1 : 1.1 * Math.exp(-k * (tt - 0.5)); } return c; }
function extendida(h) {                                                  // carga en 30 min y luego cada dosis en 4 h
  let c = h < 0.5 ? (h / 0.5) * 1.1 : 1.1 * Math.exp(-k * (h - 0.5));
  for (let d = 0.5; d <= h; d += 6) { const tt = h - d, r = 0.42 * k; c += tt < 4 ? (r / k) * (1 - Math.exp(-k * tt)) : (r / k) * (1 - Math.exp(-k * 4)) * Math.exp(-k * (tt - 4)); }
  return c;
}
function trazo(f, hasta) { let d = ""; for (let h = 0; h <= hasta + 1e-6; h += 0.05) d += `${d ? "L" : "M"}${x(h).toFixed(1)},${y(Math.min(CMAX, f(h))).toFixed(1)}`; return d; }
function sobre(f, hasta, color) {                                          // franjas del tiempo por encima de la CIM
  let r = "", ini = null;
  for (let h = 0; h <= hasta + 1e-6; h += 0.05) { const a = f(h) >= CIM; if (a && ini === null) ini = h; if ((!a || h + 0.05 > hasta) && ini !== null) { r += `<rect x="${x(ini)}" y="${Y0 + 4}" width="${Math.max(1, x(h) - x(ini))}" height="8" rx="4" fill="${color}"/>`; ini = null; } }
  return r;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const hb = TMAX * suave(tramo(t, 0.03, 0.45)), he = TMAX * suave(tramo(t, 0.5, 0.92));
  const ejeX = [0, 6, 12, 18].map((h) => `<line x1="${x(h)}" y1="${Y0}" x2="${x(h)}" y2="${Y0 + 5}" stroke="#9CA3AF"/><text x="${x(h)}" y="${Y0 + 32}" font-size="11.5" text-anchor="middle" fill="#6B7280">${h} h</text>`).join("");
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="#9CA3AF"/><line x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" stroke="#9CA3AF"/>${ejeX}
    <text x="18" y="${(Y0 + Y1) / 2}" font-size="12" fill="#6B7280" transform="rotate(-90 18 ${(Y0 + Y1) / 2})" text-anchor="middle">Concentración</text>
    <line x1="${X0}" y1="${y(CIM)}" x2="${X1}" y2="${y(CIM)}" stroke="${ROJO}" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="${trazo(bolo, hb)}" fill="none" stroke="${AMBAR}" stroke-width="4" stroke-linecap="round"/>
    <path d="${trazo(extendida, he)}" fill="none" stroke="${TEAL}" stroke-width="4.5" stroke-linecap="round"/>
    ${sobre(bolo, hb, AMBAR)}<g transform="translate(0,10)">${sobre(extendida, he, TEAL)}</g>
    <text x="${X1 - 4}" y="${y(CIM) - 7}" text-anchor="end" font-size="12.5" font-weight="800" fill="${ROJO}" stroke="#fff" stroke-width="5" paint-order="stroke">CIM del germen</text>
  </svg>`;
  const pb = Math.round(100 * [...Array(361).keys()].filter((j) => bolo(j * 0.05) >= CIM).length / 361);
  const pe = Math.round(100 * [...Array(361).keys()].filter((j) => extendida(j * 0.05) >= CIM).length / 361);
  lienzo("Infusión prolongada del betalactámico", "Carga y luego cada dosis en 3-4 h: más tiempo por encima de la CIM",
    `${svg}<div style="display:flex;gap:8px">
      <div class="item" style="flex:1;font-size:13.4px;background:${tinte(AMBAR, 14)};opacity:${t > 0.05 ? 1 : 0.3}"><b style="color:#B26B10">En bolo</b> cada 6 h: <span>picos altos y valles largos por debajo de la CIM (<b>${pb} %</b> del tiempo por encima en este esquema).</span></div>
      <div class="item" style="flex:1;font-size:13.4px;background:${tinte(TEAL, 14)};opacity:${t > 0.5 ? 1 : 0.3}"><b style="color:#0F766E">Carga + extendida</b>: <span>concentración más constante (<b>${pe} %</b> del tiempo por encima). Salva <b>25</b> vidas por cada 1.000.</span></div></div>`,
    "Esquema ilustrativo de Empirica (vida media de 1 h), no datos de un fármaco. Fuente: Surviving Sepsis Campaign 2026, recomendación 33, pp. 888-889; ACIN 2021, p. 224.");
};
window.cuadro(0, 1);
</script></body></html>
