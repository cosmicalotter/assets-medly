<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Animación de fisiología: autorregulación del flujo a los órganos y meta de PAM (SSC 2026, recs. 13-14, p. 880:
// por debajo de unos 60 mmHg la perfusión de los órganos cae de forma lineal con la PAM). Curva ilustrativa.
const W = 668, H = 344, X0 = 60, X1 = 640, Y0 = 298, Y1 = 22, PMIN = 30, PMAX = 130;
const x = (p) => X0 + (X1 - X0) * (p - PMIN) / (PMAX - PMIN);
const flujo = (p) => p >= 60 ? 1 : Math.max(0, (p - 25) / 35);        // meseta desde ~60 mmHg, caída lineal por debajo
const y = (f) => Y0 - (Y0 - Y1 - 30) * f;
const curva = (() => { let d = ""; for (let p = PMIN; p <= PMAX; p += 1) d += `${d ? "L" : "M"}${x(p).toFixed(1)},${y(flujo(p)).toFixed(1)}`; return d; })();
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  // la PAM baja de 90 a 45 mmHg y vuelve a 65 con el vasopresor
  const p = t < 0.55 ? lerp(90, 45, suave(tramo(t, 0.05, 0.5))) : lerp(45, 65, suave(tramo(t, 0.6, 0.8)));
  const f = flujo(p);
  const color = p >= 60 ? VERDE : ROJO;
  const banda = `<rect x="${x(60)}" y="${Y1}" width="${x(70) - x(60)}" height="${Y0 - Y1}" fill="${tinte(TEAL, 18)}"/>
    <text x="${(x(60) + x(70)) / 2}" y="${Y0 - 10}" text-anchor="middle" font-size="12" font-weight="800" fill="#0F766E">Meta</text>`;
  const ejeX = [40, 60, 65, 80, 100, 120].map((v) => `<line x1="${x(v)}" y1="${Y0}" x2="${x(v)}" y2="${Y0 + 5}" stroke="#9CA3AF"/>
    <text x="${x(v)}" y="${Y0 + 19}" font-size="11.5" text-anchor="middle" fill="${v === 65 ? "#0F766E" : "#6B7280"}" font-weight="${v === 65 ? 800 : 400}">${v}</text>`).join("");
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${banda}
    <line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="#9CA3AF"/><line x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" stroke="#9CA3AF"/>
    ${ejeX}<text x="${(X0 + X1) / 2}" y="${Y0 + 38}" text-anchor="middle" font-size="12" fill="#6B7280">PAM (mmHg)</text>
    <text x="18" y="${(Y0 + Y1) / 2}" font-size="12" fill="#6B7280" transform="rotate(-90 18 ${(Y0 + Y1) / 2})" text-anchor="middle">Flujo a los órganos</text>
    <path d="${curva}" fill="none" stroke="${AZUL}" stroke-width="5" stroke-linecap="round"/>
    <text x="${x(100)}" y="${y(1) - 12}" text-anchor="middle" font-size="13" font-weight="700" fill="${AZUL}">Autorregulación: flujo estable</text>
    <text x="${x(46)}" y="${y(0.2)}" text-anchor="start" font-size="13" font-weight="700" fill="${ROJO}" opacity="${p < 60 ? 1 : 0.3}">Cae la perfusión</text>
    <line x1="${x(p)}" y1="${Y0}" x2="${x(p)}" y2="${y(f)}" stroke="${color}" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="${x(p)}" cy="${y(f)}" r="11" fill="${color}" stroke="#fff" stroke-width="3"/>
    <rect x="${x(p) - 44}" y="${y(f) - 44}" width="88" height="24" rx="12" fill="${color}"/>
    <text x="${x(p)}" y="${y(f) - 27}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">PAM ${Math.round(p)}</text></svg>`;
  const etapa = t < 0.3 ? 0 : t < 0.58 ? 1 : 2;
  const E = [["Normal", "La PAM cambia y el flujo apenas se mueve"], ["Choque", "Por debajo de unos <b>60 mmHg</b>, el flujo cae con la PAM"],
             ["Norepinefrina", "Meta inicial <b>65 mmHg</b> (±5); <b>60-65</b> en mayores de 65 años"]];
  lienzo("Por qué la meta es una PAM de 65 mmHg", "La autorregulación protege los órganos sólo por encima de unos 60 mmHg",
    `${svg}<div style="display:flex;gap:6px">${E.map((e, k) => `<div class="item" style="flex:1;font-size:13px;background:${k === etapa ? tinte(k === 1 ? ROJO : k === 2 ? TEAL : AZUL, 14) : "#F3F4F6"};outline:${k === etapa ? `2px solid ${k === 1 ? ROJO : k === 2 ? TEAL : AZUL}` : "none"};color:${k === etapa ? TINTA : "#6B7280"}"><b>${e[0]}:</b> <span>${e[1]}</span></div>`).join("")}</div>`,
    "Esquema ilustrativo de Empirica, no datos de un paciente. Fuente: Surviving Sepsis Campaign 2026, recomendaciones 13 y 14, p. 880.");
};
window.cuadro(0, 1);
</script></body></html>
