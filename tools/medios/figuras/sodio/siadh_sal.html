<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="../liquidos/base.js"></script></head><body><script>
// SIADH frente a síndrome de pérdida renal de sal (Zieg J. Front Pediatr 2017, tabla 3; CC BY 4.0).
const FILAS = [
  ["Volemia", "Euvolemia", "<b>Hipovolemia</b>"],
  ["Diuresis", "Baja", "<b>Alta</b>"],
  ["Presión venosa central", "Normal", "<b>Baja</b>"],
  ["Urea y creatinina", "Bajas o normales", "<b>Altas</b>"],
  ["Ácido úrico", "Bajo", "Bajo"],
  ["Osmolalidad plasmática", "Baja", "Baja"],
  ["Sodio urinario", "&gt;20 mEq/L", "&gt;20 mEq/L"],
  ["Renina y aldosterona", "Bajas", "<b>Altas</b>"],
];
const igual = (a, b) => a.replace(/<[^>]+>/g, "") === b.replace(/<[^>]+>/g, "");
const filas = FILAS.map(([d, a, b], i) => `<div style="display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;align-items:stretch">
  <div class="caja" style="background:#F7F8FA;font-weight:700;font-size:13.5px;padding:7px 10px">${d}</div>
  <div class="caja" style="background:${igual(a, b) ? "#F7F8FA" : tinte(AZUL, 13)};font-size:13.5px;padding:7px 10px;text-align:center">${a}</div>
  <div class="caja" style="background:${igual(a, b) ? "#F7F8FA" : tinte(ROJO, 13)};font-size:13.5px;padding:7px 10px;text-align:center">${b}</div></div>`).join("");
lienzo("SIADH o pérdida renal de sal", "En los dos la FENa es mayor de 0,5 %: los separa la volemia",
  `<div style="display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px">
     <div></div><div style="background:${AZUL};color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:800;font-size:15px">SIADH</div>
     <div style="background:${ROJO};color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:800;font-size:15px">Pérdida renal de sal</div></div>
   <div style="display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between">${filas}</div>
   <div class="caja" style="background:${tinte(AMBAR, 14)};font-size:13px">Con una dieta <b>pobre en sal</b>, el sodio urinario puede quedar por debajo de <b>20 mEq/L</b>.</div>`,
  "Datos: Zieg J. Pathophysiology of hyponatremia in children. Front Pediatr 2017 (CC BY 4.0), tabla 3. Elaboración de Empirica.");
</script></body></html>
