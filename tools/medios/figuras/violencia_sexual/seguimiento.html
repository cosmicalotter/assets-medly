// Calendario de seguimiento: MinSalud 2026, tabla 11 (y tabla 6 para la HBsAg a los 6 meses).
const C = [
  [TEAL, "Alta", ["Citas **asignadas**", "Médico **responsable**"]],
  [AZUL, "2 semanas", ["**βhCG**", "Resultados de **ITS**", "**IVE** inmediata si la elige", "Paraclínicos si hubo **PEP**"]],
  [AZUL, "4 semanas", ["Ruta y **diagnósticos**", "Salud **mental**", "Paraclínicos si hubo **PEP**"]],

  [MORADO, "12 meses", ["Prueba de **VIH**", "**Cierre** del caso"]],

const b = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

</div>`).join("");
const linea = `<div style="position:relative;height:0"><div style="position:absolute;left:48px;right:48px;top:23px;height:4px;background:#E5E7EB;border-radius:2px"></div></div>`;
const pie = `<div class="caja" style="background:${tinte(VERDE, 10)};border:1.5px solid ${tinte(VERDE, 45)}"><b style="color:${VERDE}">En cada control</b>: evolución <b>mental, social y familiar</b> y si necesita tratamiento <b>especializado</b>. Buscar a quien <b>no asista</b>.</div>`;
lienzo("Controles después de la violencia sexual", "Qué se revisa en cada cita", linea + `<div style="display:flex;gap:8px;position:relative">${cols}</div>` + pie,
