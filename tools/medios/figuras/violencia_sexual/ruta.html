<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Ruta intersectorial: MinSalud 2026 (momento 12) y Res. 459/2012 (paso 12).
const b = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const caja = (c, t, items) => `<div style="flex:1;background:${tinte(c, 8)};border:2px solid ${tinte(c, 45)};border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
  <div style="font-weight:800;font-size:15.5px;color:${c}">${t}</div>${items.map((x) => `<div style="font-size:13px;line-height:1.3">• ${b(x)}</div>`).join("")}</div>`;
const salud = `<div style="background:${TEAL};color:#fff;border-radius:14px;padding:10px 14px;text-align:center;font-size:15px"><b>Salud</b>: atiende, toma la evidencia y activa <b>a la vez</b> protección y justicia</div>`;
const flechas = `<svg width="668" height="34">${flecha(200, 2, 200, 32, "#94A3B8", 4, 12)}${flecha(468, 2, 468, 32, "#94A3B8", 4, 12)}</svg>`;
const prot = `<div style="display:flex;flex-direction:column;gap:8px;flex:1">
  <div style="font-weight:800;font-size:16px;text-align:center">Protección</div>
  ${caja(TEAL, "Menor de 18 años", ["Aviso **inmediato** al ICBF", "**Defensor de familia**", "Sin defensor: **comisario**"])}
  ${caja(AZUL, "Adulto", ["Medidas en la **comisaría de familia**", "Resumen y **copia** a la víctima"])}</div>`;
const just = `<div style="display:flex;flex-direction:column;gap:8px;flex:1">
  <div style="font-weight:800;font-size:16px;text-align:center">Justicia</div>
  ${caja(MORADO, "Policía judicial", ["**SIJIN** o policía de infancia", "Recibe la **evidencia**"])}
  ${caja(MORADO, "Fiscalía", ["**URI** o **CAIVAS**", "Recibe la **denuncia**"])}</div>`;
lienzo("Rutas de protección y justicia", "Se activan al mismo tiempo, con confidencialidad", salud + flechas + `<div style="display:flex;gap:14px">${prot}${just}</div>`,
  "Esquema. Fuente: MinSalud 2026, momento 12; Res. 459/2012, paso 12.");
</script></body></html>
