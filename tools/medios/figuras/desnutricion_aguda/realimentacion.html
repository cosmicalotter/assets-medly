<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 6%,white);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.k .n{font-size:30px;font-weight:800;color:var(--c)}.k p{font-size:13.5px;line-height:1.3}.c{border-radius:12px;background:#F8FAFC;padding:10px 12px;font-size:14px;line-height:1.35}</style></head><body>
<script>
const k = (c, n, p) => `<div class="k" style="--c:${c}"><div class="n">${n}</div><p>${p}</p></div>`;
lienzo("Signos de realimentación", "Al empezar a comer: puede matar en las primeras 24 horas",
  `<div class="g">${k(ROJO, "+10/min", "Frecuencia <b>cardíaca</b>")}${k(NARANJA, "+5/min", "Frecuencia <b>respiratoria</b>")}${k(MORADO, "&gt;10 %", "Peso de un día a otro")}
     ${k(AMBAR, "Tiraje", "Retracciones y <b>roncus</b>")}${k(ROJO, "Arritmia", "o signos de <b>falla cardíaca</b>")}${k(AZUL, "Glucosa", "Hiperglucemia o cambios de conciencia")}</div>
   <div class="c"><b>Qué hacer:</b> reducir a la <b>mitad</b> la fórmula 24 h, subir despacio en 24-48 h, balance estricto, medir <b>K, P y Mg</b> y reponer; tiamina.</div>`,
  F_L + " (p. 94, 98-99).");
</script></body></html>
