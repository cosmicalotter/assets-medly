<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
 .pasos{display:flex;gap:8px}
 .paso{flex:1;border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.25;border:2px solid #E5E7EB;color:#9CA3AF;text-align:center}
 .paso.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,white);color:var(--tinta)}
</style></head><body>
<script>
// Cuatro pasos: 30-60 mL de F-75 en el vaso, sonda fija en la areola que entra por la comisura,
// vaso por encima de la areola al empezar, y bajarlo hasta 30 cm bajo el pezón cuando succiona fuerte.
const PASOS = [["1", "30-60 mL de F-75 en el vaso", AMBAR], ["2", "Sonda fija en la areola, por la comisura", AZUL],
  ["3", "Vaso sobre la areola: fluye fácil", TEAL], ["4", "Succiona fuerte: bajar hasta 30 cm", VERDE]];
const POR = 24, PIEL = "#F3D2B6", BORDE = "#C9A486";
// Pecho de la madre a la izquierda (pezón en 300,220) y cabeza del bebé que mama, de perfil.
const PEZON = [300, 220];
function escena(succion) {
  return `<path d="M60 40 Q90 120 150 150 Q300 150 300 220 Q300 300 170 310 Q90 320 60 400" fill="#EBC3A3" stroke="#C98E6B" stroke-width="3"/>
    <ellipse cx="292" cy="220" rx="16" ry="30" fill="#C98E6B"/>
    <g transform="translate(${408 - succion * 4},222)">
      <ellipse cx="0" cy="0" rx="98" ry="92" fill="${PIEL}" stroke="${BORDE}" stroke-width="3"/>
      <path d="M-90 -36 Q-70 -98 0 -96 Q76 -92 92 -20 Q50 -60 0 -62 Q-56 -60 -90 -36Z" fill="${tinte(AZUL, 70)}"/>
      <path d="M-40 -26 Q-28 -18 -16 -26" stroke="#7C4A2D" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="34" cy="8" rx="16" ry="22" fill="#E9BE9C" stroke="${BORDE}" stroke-width="3"/>
      <ellipse cx="-50" cy="30" rx="24" ry="14" fill="#F4B7A4" opacity=".55"/></g>`;
}
window.cuadro = function (i, n) {
  const T = POR * 4, t = n > 1 ? Math.round((i / (n - 1)) * (T - 1)) : 0;
  const paso = Math.min(3, Math.floor(t / POR)), u = (t % POR) / POR;
  // Altura del vaso: por encima del pezón en los pasos 1-3; baja hasta 30 cm por debajo en el 4.
  const baja = paso === 3 ? suave(tramo(u, 0.1, 0.8)) : 0;
  const vy = lerp(70, 300, baja), vx = 570;
  const lleno = paso === 0 ? suave(tramo(u, 0.1, 0.7)) : 1 - (paso === 3 ? 0.35 * baja : 0);
  const vaso = `<g transform="translate(${vx},${vy})"><path d="M-34 0 L-26 70 H26 L34 0Z" fill="#fff" stroke="#64748B" stroke-width="3"/>
      <path d="M${-26 - 8 * (1 - lleno)} ${70 - 62 * lleno} L-26 70 H26 L${26 + 8 * (1 - lleno)} ${70 - 62 * lleno}Z" fill="${tinte(AMBAR, 60)}"/>
      <text x="0" y="-12" text-anchor="middle" font-size="15" font-weight="800" fill="${AMBAR}">F-75</text></g>`;
  // Sonda: del fondo del vaso, por debajo del mentón y por fuera de la cabeza, hasta la comisura junto al pezón (cúbica de Bézier).
  const P = [[vx - 10, vy + 60], [vx - 40, lerp(360, 400, baja)], [296, 350], [304, 236]];
  const bz = (f) => [0, 1].map((e) => (1 - f) ** 3 * P[0][e] + 3 * (1 - f) ** 2 * f * P[1][e] + 3 * (1 - f) * f * f * P[2][e] + f ** 3 * P[3][e]);
  const s = paso === 0 ? 0 : paso === 1 ? suave(tramo(u, 0.1, 0.8)) : 1;
  const sonda = s > 0 ? `<path d="M${P[0]} C ${P[1]} ${P[2]} ${P[3]}" stroke="${AZUL}" stroke-width="5" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="${100 * s} 100"/>
      <rect x="282" y="226" width="22" height="12" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="2" opacity="${s}" transform="rotate(-30 293 232)"/>` : "";
  // Gotas de F-75 que corren por la sonda mientras el bebé mama.
  let gotas = "";
  if (paso >= 2) for (let k = 0; k < 3; k++) {
    const [x, y] = bz((u * 2 + k / 3) % 1);
    gotas += `<circle cx="${x}" cy="${y}" r="5" fill="${AMBAR}" stroke="#fff" stroke-width="1.5"/>`;
  }
  const regla = `<g opacity="${paso === 3 ? 1 : 0.3}"><path d="M655 220 V370" stroke="#94A3B8" stroke-width="2"/>
      <path d="M647 220 H663 M647 370 H663" stroke="#94A3B8" stroke-width="2"/>
      <text x="668" y="396" text-anchor="end" font-size="15" font-weight="800" fill="${VERDE}">hasta 30 cm</text>
      <path d="M300 220 H655" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5"/><text x="645" y="210" text-anchor="end" font-size="13" fill="#64748B">nivel del pezón</text></g>`;
  const svg = `<svg class="esc" viewBox="0 0 680 420">${regla}${escena(paso >= 2 ? Math.sin(u * Math.PI * 8) : 0)}${sonda}${gotas}${vaso}</svg>`;
  const pasos = PASOS.map(([kk, txt, c], j) => `<div class="paso ${j === paso ? "on" : ""}" style="--c:${c}"><b>${kk}.</b> ${txt}</div>`).join("");
  lienzo("Técnica de suplementación por succión", "Menor de 6 meses: recibe F-75 mientras mama y estimula la leche materna",
    `${svg}<div class="pasos">${pasos}</div>`, F_L + " (p. 54-55, ilustración 5). Sonda nelaton estéril calibre 5 a 8.");
};
window.cuadro(0, 1);
</script></body></html>
