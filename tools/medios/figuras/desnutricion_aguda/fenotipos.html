<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 6%,white);display:grid;grid-template-columns:150px 1fr;gap:8px;padding:10px;align-items:center}
.k h3{grid-column:1/3;font-size:20px;color:var(--c)}.k ul{font-size:13.5px;line-height:1.35;padding-left:16px}.k svg{width:150px;height:250px}</style></head><body>
<script>
const k = (c, t, fig, items) => `<div class="k" style="--c:${c}"><h3>${t}</h3><svg viewBox="-110 -320 220 330">${fig}</svg><ul>${items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`;
lienzo("Marasmo y kwashiorkor", "Las dos formas de la desnutrición aguda severa",
  `<div class="g">
    ${k(AZUL, "Marasmo", nino(0, 0, 300, { flaco: 1 }), ["Pérdida de peso <b>marcada</b>", "Sin grasa, músculo <b>atrofiado</b>", "Piel plegadiza (le sobra piel)", "<b>Sin edema</b>", "Irritable, llora mucho"])}
    ${k(NARANJA, "Kwashiorkor", nino(0, 0, 300, { edema: 2 }), ["<b>Siempre</b> con edema nutricional", "Cara de luna", "Piel con <b>dermatosis</b>, hiper o hipopigmentada", "Pelo fino, seco, despigmentado", "Apatía; el peso <b>engaña</b>"])}
  </div>`, F_L + " (tabla 6, p. 30-31).");
</script></body></html>
