<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 6%,white);padding:12px;display:flex;flex-direction:column;gap:8px}
.k h3{font-size:19px;color:var(--c)}.s{border-radius:10px;background:#fff;border:1px solid #E5E7EB;padding:8px 10px;font-size:13.5px;line-height:1.3}.nota{border-radius:12px;background:${"#FEF2F2"};border:2px solid #EF5454;padding:8px 12px;font-size:13.5px}</style></head><body>
<script>
const s = (t) => `<div class="s">${t}</div>`;
lienzo("Hidratar en la desnutrición: dos caminos", "Lento y por el intestino siempre que se pueda",
  `<div class="g"><div class="k" style="--c:${TEAL}"><h3>Consciente</h3>
      ${s("<b>Desnutrición moderada:</b> SRO-75 75 mL/kg en 4-6 h")}${s("<b>Desnutrición severa:</b> SRO-75 + potasio a 10 mL/kg/h, 12 h como mucho")}${s("Vigilar cada 15 min las primeras 2 h")}${s("Reponer 50-100 mL por deposición")}</div>
    <div class="k" style="--c:${ROJO}"><h3>Letárgico o en choque</h3>
      ${s("<b>Lactato de Ringer</b> 15 mL/kg en 1 h, IV o sonda")}${s("Vigilar cada 10 min")}${s("<b>Mejora:</b> SRO-75 a 100 mL/kg/día, 12 h como mucho (+ potasio si es severa); vía cerrada")}${s("<b>No mejora:</b> repetir, medir Hb, mantenimiento IV")}</div></div>
   <div class="nota"><b>Nunca</b> albúmina, diuréticos ni líquidos con mucho sodio: el corazón se sobrecarga.</div>`,
  F_L + " (p. 44-46).");
</script></body></html>
