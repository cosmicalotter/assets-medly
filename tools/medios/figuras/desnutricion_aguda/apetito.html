<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 7%,white);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.k h3{font-size:18px;color:var(--c)}.k .f{font-size:30px;font-weight:800;color:var(--c)}.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.p{border-radius:10px;background:#F8FAFC;border:1px solid #E5E7EB;padding:8px;font-size:13px;line-height:1.3}</style></head><body>
<script>
const sobre = (frac, c) => `<svg width="110" height="80" viewBox="0 0 110 80"><rect x="10" y="8" width="90" height="64" rx="8" fill="#fff" stroke="${c}" stroke-width="3"/>
  <rect x="10" y="${8 + 64 * (1 - frac)}" width="90" height="${64 * frac}" rx="6" fill="${tinte(c, 55)}"/><text x="55" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">FTLC</text></svg>`;
const k = (c, peso, t, frac) => `<div class="k" style="--c:${c}"><h3>${peso}</h3>${sobre(frac, c)}<div class="f">${t}</div><div style="font-size:13px">de sobre como mínimo</div></div>`;
lienzo("Prueba de apetito: cuánto debe comer", "6-59 meses y 4 kg o más; observar 15 minutos",
  `<div class="g">${k(AZUL, "4-6,9 kg", "¼", 0.25)}${k(TEAL, "7-9,9 kg", "⅓", 0.333)}${k(MORADO, "10-14,9 kg", "½", 0.5)}</div>
   <div class="pasos"><div class="p"><b>1.</b> Lavar las manos; el niño en las piernas del cuidador</div><div class="p"><b>2.</b> Ofrecer la FTLC con cuchara, sin obligar</div>
   <div class="p"><b>3.</b> Si rechaza, repetir en otro ambiente o a las 2 h</div><div class="p"><b>4.</b> Si sigue sin comer: <b style="color:${ROJO}">negativa, hospital</b></div></div>`,
  F_L + " (tabla 7, p. 33-34).");
</script></body></html>
