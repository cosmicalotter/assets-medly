<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>.f{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 7%,white);padding:12px;display:flex;flex-direction:column;gap:8px}
.k h3{font-size:19px;color:var(--c)}.k .t{font-size:24px;font-weight:800;color:var(--c)}.k p{font-size:13.5px;line-height:1.35}.nota{border-radius:12px;background:#F8FAFC;padding:9px 12px;font-size:13.5px}</style></head><body>
<script>
const k = (c, n, t, d, p) => `<div class="k" style="--c:${c}"><h3>${n}. ${t}</h3><div class="t">${d}</div><p>${p}</p></div>`;
lienzo("Las tres fases del tratamiento", "El hospital empieza en la 1; la casa, en la 3",
  `<div class="f">${k(ROJO, 1, "Estabilización", "24-72 h", "Corregir lo que mata: hipoxemia, <b>hipoglucemia</b>, choque, hipotermia e infección. Inicio cauteloso con <b>F-75</b>.")}
    ${k(AMBAR, 2, "Transición", "3 a 7-14 días", "Paso progresivo de la F&#8209;75 a la <b>FTLC</b> o a la <b>leche materna</b>, cuando vuelve el apetito.")}
    ${k(VERDE, 3, "Rehabilitación", "Hasta 60 días", "Más energía para el crecimiento compensatorio, en <b>casa</b>, con controles hasta el egreso.")}</div>
   <div class="nota">Con criterios de manejo <b>ambulatorio</b>, el tratamiento empieza directamente en la <b>rehabilitación</b>.</div>`,
  F_L + " (ilustración 4, p. 37-38).");
</script></body></html>
