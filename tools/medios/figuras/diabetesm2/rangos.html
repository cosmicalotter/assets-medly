<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Rangos diagnósticos: ADA 2026, tablas 2.1 y 2.2 (S28); MinSalud 2016, p. 29.
const ROJO = "#EF5454", AMBAR = "#F2A23A", VERDE = "#2FB36D";
const X0 = 200, X1 = 650;
function fila(rot, uni, min, max, c1, c2, eti1, eti2, yy, dec) {
  const x = (v) => X0 + (X1 - X0) * (v - min) / (max - min);
  const f = (v) => dec ? String(v).replace(".", ",") : String(v);
  return `
  <text x="${X0 - 14}" y="${yy + 22}" font-size="16" font-weight="800" text-anchor="end" fill="#1F2A37">${rot}</text>
  <text x="${X0 - 14}" y="${yy + 40}" font-size="12" text-anchor="end" fill="#6B7280">${uni}</text>
  <rect x="${x(min)}" y="${yy}" width="${x(c1) - x(min)}" height="44" rx="6" fill="${VERDE}"/>
  <rect x="${x(c1)}" y="${yy}" width="${x(c2) - x(c1)}" height="44" fill="${AMBAR}"/>
  <rect x="${x(c2)}" y="${yy}" width="${x(max) - x(c2)}" height="44" rx="6" fill="${ROJO}"/>
  <text x="${(x(min) + x(c1)) / 2}" y="${yy + 27}" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">normal</text>
  <text x="${(x(c1) + x(c2)) / 2}" y="${yy + 27}" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">prediabetes</text>
  <text x="${(x(c2) + x(max)) / 2}" y="${yy + 27}" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">diabetes</text>
  <line x1="${x(c1)}" y1="${yy - 6}" x2="${x(c1)}" y2="${yy + 50}" stroke="#1F2A37" stroke-width="2"/>
  <line x1="${x(c2)}" y1="${yy - 6}" x2="${x(c2)}" y2="${yy + 50}" stroke="#1F2A37" stroke-width="2"/>
  <text x="${x(c1)}" y="${yy - 10}" font-size="14" font-weight="800" text-anchor="middle" fill="#1F2A37">${eti1}</text>
  <text x="${x(c2)}" y="${yy - 10}" font-size="14" font-weight="800" text-anchor="middle" fill="#1F2A37">${eti2}</text>`;
}
const svg = `<svg width="668" height="292" viewBox="0 0 668 292">
  ${fila("Ayunas", "mg/dL, ≥8 h sin comer", 70, 160, 100, 126, "100", "126", 26)}
  ${fila("PTOG a las 2 h", "mg/dL, carga de 75 g", 90, 260, 140, 200, "140", "200", 124)}
  ${fila("HbA1c", "%, método certificado", 5.0, 7.4, 5.7, 6.5, "5,7", "6,5", 222)}
</svg>`;
const notas = `<div class="tarjeta"><div class="item"><span>Sin <b>síntomas</b> ni crisis, la diabetes se confirma con <b>dos resultados</b> en rango; con síntomas, basta una glucosa al azar <b>≥200 mg/dL</b>.</span></div></div>`;
lienzo("Rangos diagnósticos de la glucosa", "Dónde empieza la prediabetes y dónde la diabetes en cada prueba.", svg + notas,
  "Esquema propio. Fuente: ADA, Standards of Care in Diabetes 2026, tablas 2.1 y 2.2 (S28); MinSalud 2016, p. 29.");
</script></body></html>
