<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Cuatro categorías de la exposición (MinSalud 2022, Tabla 2 y apartado de inmunocomprometidos, p. 11-12 y 16).
const COLS = [
  ["No exposición", VERDE, ["Perro o gato <b>observable</b>, vivo y sano", "Saliva sobre <b>piel intacta</b>", "Ratas, ratones o ardillas"], "Lavar, notificar y <b>observar 10 días</b>"],
  ["Leve", NARANJA, ["Perro o gato <b>no observable</b>", "Mordedura <b>superficial única</b> en tronco o miembros", "Arañazo, abrasión o lamedura de piel lesionada <b>sin sangrado</b>"], "<b>Vacuna</b> sin inmunoglobulina"],
  ["Grave", ROJO, ["No observable: mordedura <b>profunda</b>, <b>múltiple</b> o en zona muy inervada", "Lesión <b>con sangrado</b> o en <b>mucosas</b>", "<b>Murciélago</b>, silvestre, de producción o humano con rabia", "Animal muerto o que <b>enferma</b>"], "<b>Vacuna e inmunoglobulina</b>"],
  ["Inmunocomprometido", MORADO, ["Cualquier mordedura, arañazo, abrasión, lamedura de <b>mucosa</b> o contacto con un animal transmisor", "Aunque el perro sea <b>observable</b>"], "Inmunoglobulina y <b>5 dosis</b>"],
];
let html = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:1">`;
html += COLS.map(([t, c, crit, acc]) => `<div style="display:flex;flex-direction:column;gap:6px">
  <div style="background:${c};color:#fff;border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:${t.length > 14 ? 13.5 : 16}px">${t}</div>
  ${crit.map((k) => `<div class="caja" style="background:${tinte(c, 9)};border:1.5px solid ${tinte(c, 32)};font-size:13px;line-height:1.25;padding:6px 7px"><span>${k}</span></div>`).join("")}
  <div style="flex:1"></div><div style="font-size:11.5px;font-weight:700;color:#64748B;text-align:center">QUÉ HACER</div>
  <div class="caja" style="background:${tinte(c, 22)};border:2px solid ${c};font-size:14.5px;text-align:center;padding:9px 6px"><span>${acc}</span></div></div>`).join("");
html += `</div>`;
lienzo("Las cuatro categorías de la exposición", "Según el animal, la lesión y el paciente; todas llevan lavado de la herida", html,
  "Esquema. Fuente: MinSalud 2022, Lineamiento de atención clínica integral para exposición rábica y rabia, Tabla 2.");
</script></body></html>
