<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Preexposición y refuerzos (MinSalud 2022, p. 19-20, Tabla 4).
const FILAS = [
  ["Exposición permanente", ROJO, "Laboratorio, bioterio, zoonosis, control de murciélagos", ["Refuerzo al <b>año</b>", "Títulos <b>cada año</b>: si ≤0,5 UI/mL, <b>2 refuerzos</b>", "Sin títulos: <b>1 refuerzo</b> al año"]],
  ["Riesgo por el oficio", NARANJA, "Veterinarios y personal de salud", ["Refuerzo a los <b>2 años</b>", "Títulos <b>cada 2 años</b>", "Sin títulos: <b>1 refuerzo</b> cada 2 años"]],
  ["Viajeros y desplazados", VERDE, "Viajes o trabajo temporal en zonas enzoóticas", ["<b>Sin</b> medición de anticuerpos", "<b>Sin</b> refuerzos de rutina"]],
];
let html = `<div class="caja" style="background:${tinte(TEAL, 12)};border:2px solid ${TEAL};font-size:15px;text-align:center"><b>Todos: 2 dosis IM, días 0 y 7</b> · inmunocomprometido: 3 dosis (0, 7 y 21-28)</div>`;
html += FILAS.map(([t, c, quien, pasos]) => `<div style="display:flex;gap:8px;align-items:stretch">
  <div style="width:190px;flex:none;background:${c};color:#fff;border-radius:10px;padding:8px 10px"><div style="font-weight:700;font-size:15px">${t}</div><div style="font-size:12px;opacity:.95;margin-top:2px">${quien}</div></div>
  ${pasos.map((p) => `<div class="caja" style="flex:1;background:${tinte(c, 9)};border:1.5px solid ${tinte(c, 35)};font-size:13px;display:flex;align-items:center"><span>${p}</span></div>`).join("")}</div>`).join("");
lienzo("Preexposición y refuerzos", "Las dos dosis iniciales son iguales; los refuerzos dependen del riesgo", html,
  "Esquema. Fuente: MinSalud 2022, Lineamiento de atención clínica integral para exposición rábica y rabia, vacunación preexposición y Tabla 4.");
</script></body></html>
