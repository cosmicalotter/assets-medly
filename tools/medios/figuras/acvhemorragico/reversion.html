<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .alerta{border-radius:12px;padding:7px 12px;font-size:13.5px;background:color-mix(in srgb,var(--rojo) 13%,white);color:#8f2525}
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{border:1px solid var(--linea);border-radius:14px;padding:8px 11px;display:flex;flex-direction:column;gap:3px}
  .fam{font-size:16px;font-weight:800}
  .ejemplos{font-size:11.5px;color:var(--suave);margin-top:-3px}
  .lin{font-size:12.5px;line-height:1.3}
  .lin b{color:var(--tinta)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px}
  .c1{background:#d6f3e3;color:#1d7a49}.c2a{background:#d4f2ef;color:#0f7c71}.c2b{background:#fdebd0;color:#9a5a00}
  .gris{color:var(--suave)}
</style></head><body>
<script>
window.cuadro = function () {
  lienzo(
    "Revertir la anticoagulación",
    "Suspender el fármaco y revertir en cuanto se confirma la HIC",
    `<div class="alerta"><b>No esperar el INR ni otras pruebas</b> si el efecto anticoagulante es plausible. Anotar fármaco, dosis y hora de la última toma.</div>
    <div class="grid">
      <div class="card" style="border-top:4px solid var(--rojo)"><div class="fam">Antagonistas de vitamina K</div><div class="ejemplos">warfarina, acenocumarol</div>
        <div class="lin">INR ≥2: <b>CCP de 4 factores 25-50 UI/kg</b> IV<span class="tag c1">Clase 1</span></div>
        <div class="lin">INR 1,3-1,9: <b>10-20 UI/kg</b><span class="tag c2b">2b</span></div>
        <div class="lin">Siempre <b>vitamina K 5-10 mg IV</b> tras el CCP<span class="tag c1">Clase 1</span></div>
        <div class="lin gris">Meta: INR &lt;1,3 en 1 h (ESO). Preferir CCP a plasma.</div></div>
      <div class="card" style="border-top:4px solid var(--azul)"><div class="fam">Dabigatrán</div><div class="ejemplos">inhibidor directo de la trombina</div>
        <div class="lin"><b>Idarucizumab 5 g IV</b> (2 × 2,5 g)<span class="tag c2a">2a</span></div>
        <div class="lin">Sin idarucizumab: <b>CCPa o CCP</b>, o hemodiálisis<span class="tag c2b">2b</span></div>
        <div class="lin">Carbón activado si la última dosis fue hace <b>&lt;2 h</b><span class="tag c2b">2b</span></div></div>
      <div class="card" style="border-top:4px solid var(--violeta)"><div class="fam">Inhibidores del factor Xa</div><div class="ejemplos">apixabán, rivaroxabán, edoxabán</div>
        <div class="lin"><b>CCP de 4 factores</b> (o CCPa)<span class="tag c2b">2b</span></div>
        <div class="lin">Andexanet: AHA 2022 lo consideraba razonable; <b>retirado en EE. UU.</b> (FDA, dic. 2025)</div>
        <div class="lin">Carbón activado si <b>&lt;2 h</b> (posible hasta 8 h)<span class="tag c2b">2b</span></div></div>
      <div class="card" style="border-top:4px solid var(--ambar)"><div class="fam">Heparinas</div><div class="ejemplos">no fraccionada (HNF) y de bajo peso molecular (HBPM)</div>
        <div class="lin">HNF: <b>protamina IV</b><span class="tag c2a">2a</span> · 1 mg neutraliza ~100 UI</div>
        <div class="lin">Máximo <b>50 mg en 10 min</b> (hipotensión, broncoespasmo)</div>
        <div class="lin">HBPM: protamina revierte <b>solo en parte</b><span class="tag c2b">2b</span></div></div>
    </div>`,
    "Clases AHA/ASA 2022 (sección 5.2.1). Protamina: ficha técnica FDA. CCP: concentrado de complejo protrombínico; CCPa: activado."
  );
};
window.cuadro(0, 1);
</script></body></html>
