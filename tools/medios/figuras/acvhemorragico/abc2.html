<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{flex:1;display:flex;gap:18px}
  .tc{width:300px;height:300px}
  .der{flex:1;display:flex;flex-direction:column;gap:10px}
  .caja{border:1px solid var(--linea);border-radius:14px;padding:8px 12px}
  .eti{font-size:13px;color:var(--suave);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .val{font-size:20px;font-weight:700;margin-top:2px}
  .val small{font-size:14px;color:var(--suave);font-weight:500}
  .formula{font-size:26px;font-weight:800;color:var(--teal);text-align:center;padding:0}
  .pasos{display:flex;gap:8px}
  .paso{flex:1;padding:6px 8px;border-radius:10px;background:#F3F4F6;color:var(--suave);font-size:12px;line-height:1.25}
  .paso.on{background:color-mix(in srgb,var(--teal) 14%,white);color:var(--tinta);outline:2px solid var(--teal)}
  .apagado{opacity:.25}
</style></head><body>
<script>
const H = { cx: 70, cy: 96, rx: 24, ry: 16, rot: -25 };
const rad = (H.rot * Math.PI) / 180;
const eje = (r, ang, f) => [H.cx + Math.cos(ang) * r * f, H.cy + Math.sin(ang) * r * f];

window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const fa = tramo(t, 0.08, 0.28), fb = tramo(t, 0.32, 0.5), fc = tramo(t, 0.54, 0.76), ff = tramo(t, 0.8, 0.9);
  const paso = t < 0.3 ? 0 : t < 0.52 ? 1 : t < 0.78 ? 2 : 3;

  const [a1x, a1y] = eje(H.rx, rad, -1), [a2x, a2y] = eje(H.rx, rad, -1 + 2 * fa);
  const rb = rad + Math.PI / 2;
  const [b1x, b1y] = eje(H.ry, rb, -1), [b2x, b2y] = eje(H.ry, rb, -1 + 2 * fb);
  const lineas = `
    ${fa > 0 ? `<line x1="${a1x}" y1="${a1y}" x2="${a2x}" y2="${a2y}" stroke="#EF5454" stroke-width="2.6" stroke-linecap="round"/>` : ""}
    ${fa >= 1 ? `<text x="${H.cx - 6}" y="${H.cy - 24}" fill="#EF5454" font-size="11" font-weight="700">A</text>` : ""}
    ${fb > 0 ? `<line x1="${b1x}" y1="${b1y}" x2="${b2x}" y2="${b2y}" stroke="#4F8CF6" stroke-width="2.6" stroke-linecap="round"/>` : ""}
    ${fb >= 1 ? `<text x="${H.cx + 14}" y="${H.cy + 4}" fill="#4F8CF6" font-size="11" font-weight="700">B</text>` : ""}`;

  // Pila de cortes: 10 cortes, 6 con sangre; se encienden uno a uno.
  const encendidos = Math.round(fc * 6);
  let pila = "";
  for (let k = 0; k < 10; k++) {
    const conSangre = k >= 2 && k < 8;
    const on = conSangre && k - 2 < encendidos;
    pila += `<g transform="translate(${k * 6},${k * 13})">
      <rect width="120" height="22" rx="5" fill="${on ? "#18B9A9" : "#E5E7EB"}" opacity="${on ? 1 : 0.9}"/>
      ${conSangre ? `<ellipse cx="60" cy="11" rx="${12 + 10 * Math.sin(((k - 2) / 5) * Math.PI)}" ry="5" fill="${on ? "#fff" : "#c9c9c9"}"/>` : ""}
    </g>`;
  }

  lienzo(
    "Volumen del hematoma: ABC/2",
    "En la TC sin contraste, en menos de un minuto",
    `<div class="fila">
      <svg class="tc" viewBox="-8 -8 216 216">${corteTC({ hema: H, extra: lineas })}</svg>
      <div class="der">
        <div class="caja ${fa ? "" : "apagado"}"><div class="eti" style="color:#EF5454">A · diámetro mayor</div><div class="val">4 cm <small>en el corte con más sangre</small></div></div>
        <div class="caja ${fb ? "" : "apagado"}"><div class="eti" style="color:#4F8CF6">B · perpendicular a A</div><div class="val">3 cm <small>en el mismo corte</small></div></div>
        <div class="caja ${fc ? "" : "apagado"}" style="display:flex;gap:14px;align-items:center">
          <svg width="150" height="125" viewBox="0 0 180 150">${pila}</svg>
          <div><div class="eti" style="color:var(--teal)">C · cortes × grosor</div><div class="val">${encendidos || 6} × 0,5 cm<br><small>= ${((encendidos || 6) * 0.5).toFixed(1).replace(".", ",")} cm</small></div></div>
        </div>
      </div>
    </div>
    <div class="formula" style="opacity:${ff}">4 × 3 × 3 ÷ 2 = 18 mL</div>
    <div class="pasos">
      ${["<b>1.</b> A: eje mayor", "<b>2.</b> B: a 90° de A", "<b>3.</b> C: cortes con sangre × grosor", "<b>4.</b> Multiplicar y dividir entre 2"]
        .map((p, k) => `<div class="paso ${k === paso ? "on" : ""}">${p}</div>`).join("")}
    </div>`,
    "Ejemplo ilustrativo. Método: Kothari et al., Stroke 1996. Esquema, no imagen real."
  );
};
window.cuadro(1, 1);
</script></body></html>
