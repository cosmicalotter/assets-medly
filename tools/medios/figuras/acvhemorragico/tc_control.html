<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{flex:1;display:flex;gap:16px;align-items:flex-start}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .col svg{width:255px;height:255px}
  .rot{font-size:14px;font-weight:700}
  .hallazgos{display:flex;gap:8px;flex-wrap:wrap}
  .h{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#F3F4F6;color:#9CA3AF}
  .h.on{background:color-mix(in srgb,var(--rojo) 14%,white);color:#b93434}
  .pie{font-size:14px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--ambar) 16%,white)}
</style></head><body>
<script>
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const g = tramo(t, 0.15, 0.55), iv = t > 0.5, hid = t > 0.7;
  const H0 = { cx: 68, cy: 96, rx: 18, ry: 12, rot: -25 };
  const H1 = { cx: 66 - 2 * g, cy: 96, rx: 18 + 10 * g, ry: 12 + 8 * g, rot: -25 };
  const desv = 4 * g;
  const flecha = "";
  lienzo(
    "TC de control: qué buscar",
    "Repetir la TC sin contraste si empeora la exploración neurológica",
    `<div class="fila">
      <div class="col"><div class="rot">TC inicial</div><svg viewBox="-8 -8 216 216">${corteTC({ hema: H0 })}</svg><div class="fuente">volumen ≈ 9 mL</div></div>
      <div class="col"><div class="rot" style="color:#b93434">TC de control</div><svg viewBox="-8 -8 216 216">${corteTC({ hema: H1, ivh: iv, hidro: hid, extra: flecha })}</svg><div class="fuente">${g > 0.95 ? "volumen ≈ 30 mL" : "…"}</div></div>
    </div>
    <div class="hallazgos">
      <div class="h ${g > 0.5 ? "on" : ""}">Expansión del hematoma</div>
      <div class="h ${iv ? "on" : ""}">Sangre intraventricular</div>
      <div class="h ${hid ? "on" : ""}">Hidrocefalia</div>
      <div class="h ${g > 0.8 ? "on" : ""}">Edema y efecto de masa</div>
      <div class="h ${t > 0.85 ? "on" : ""}">Herniación</div>
    </div>
    <div class="pie">Hidrocefalia que baja la conciencia → <b>drenaje ventricular externo urgente</b></div>`,
    "Esquema ilustrativo, no imagen real. AHA/ASA 2022: TC seriada ante GCS bajo o deterioro (Clase 2a)."
  );
};
window.cuadro(0, 1);
</script></body></html>
