<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .graf{flex:1}
  .notas{display:flex;gap:8px}
  .nota{flex:1;padding:7px 9px;border-radius:10px;font-size:12px;line-height:1.3;background:#F3F4F6}
  .nota.v{background:color-mix(in srgb,var(--verde) 14%,white)}
  .nota.r{background:color-mix(in srgb,var(--rojo) 13%,white)}
  .nota.a{background:color-mix(in srgb,var(--ambar) 16%,white)}
</style></head><body>
<script>
// Eje: 0-90 min. PAS 100-220 mmHg. Inicio del tratamiento en el minuto 10.
const X0 = 70, X1 = 650, Y0 = 330, Y1 = 30;
const x = (min) => X0 + ((X1 - X0) * min) / 90;
const y = (pas) => Y0 - ((Y0 - Y1) * (pas - 100)) / 120;
function pas(min) {
  if (min <= 10) return 196;
  if (min <= 70) { const u = (min - 10) / 60; return 196 - 58 * (1 - Math.pow(1 - u, 2.2)); }
  return 138 + 2 * Math.sin((min - 70) / 4);
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const hasta = 90 * Math.min(1, t / 0.85);
  let d = "";
  for (let m = 0; m <= hasta; m += 1) d += `${m ? "L" : "M"}${x(m).toFixed(1)} ${y(pas(m)).toFixed(1)} `;
  const actual = Math.round(pas(hasta));
  const meta = hasta >= 70;
  const svg = `<svg class="graf" viewBox="0 0 680 360">
    <rect x="${X0}" y="${y(130)}" width="${X1 - X0}" height="${y(100) - y(130)}" fill="#EF5454" opacity=".13"/>
    <rect x="${X0}" y="${y(150)}" width="${X1 - X0}" height="${y(130) - y(150)}" fill="#2FB36D" opacity=".16"/>
    <line x1="${X0}" x2="${X1}" y1="${y(140)}" y2="${y(140)}" stroke="#2FB36D" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="${X0 + 8}" y="${y(140) - 6}" font-size="13" fill="#1d7a49" font-weight="700">meta: &lt;140 mmHg</text>
    <text x="${X0 + 8}" y="${y(130) + 34}" font-size="13" fill="#b93434" font-weight="700">evitar &lt;130 mmHg</text>
    ${[100, 130, 140, 150, 180, 220].map((v) => `<text x="${X0 - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#6B7280">${v}</text>`).join("")}
    ${[0, 30, 60, 90].map((m) => `<text x="${x(m)}" y="${Y0 + 20}" text-anchor="middle" font-size="12" fill="#6B7280">${m ? m + " min" : "llegada"}</text>`).join("")}
    <line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="#D1D5DB"/>
    <line x1="${x(10)}" x2="${x(10)}" y1="${Y1}" y2="${Y0}" stroke="#4F8CF6" stroke-dasharray="4 4"/>
    <text x="${x(10) + 6}" y="${Y1 + 14}" font-size="12" fill="#4F8CF6" font-weight="700">inicia el antihipertensivo IV</text>
    <line x1="${x(70)}" x2="${x(70)}" y1="${Y1 + 30}" y2="${Y0}" stroke="#18B9A9" stroke-dasharray="4 4"/>
    <text x="${x(70) + 6}" y="${Y1 + 44}" font-size="12" fill="#18B9A9" font-weight="700">meta en 1 h</text>
    <path d="${d}" fill="none" stroke="#1F2A37" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(hasta)}" cy="${y(pas(hasta))}" r="6" fill="${meta ? "#2FB36D" : "#EF5454"}"/>
    <g transform="translate(${Math.min(Math.max(x(hasta) + 12, hasta >= 62 ? x(70) + 8 : 0), X1 - 112)},${y(pas(hasta)) - 34})">
      <rect width="112" height="28" rx="8" fill="#fff" stroke="#E5E7EB"/>
      <text x="56" y="19" text-anchor="middle" font-size="15" font-weight="800" fill="${meta ? "#1d7a49" : "#1F2A37"}">PAS ${actual}</text>
    </g>
    <text x="16" y="${(Y0 + Y1) / 2}" font-size="12" fill="#6B7280" transform="rotate(-90 16 ${(Y0 + Y1) / 2})">PAS (mmHg)</text>
  </svg>`;
  lienzo(
    "Presión arterial en la HIC: la primera hora",
    "PAS de 150 a 220 mmHg y hematoma pequeño o moderado",
    `${svg}
    <div class="notas">
      <div class="nota">Iniciar en <b>&lt;2 h</b> desde el inicio de los síntomas</div>
      <div class="nota v">Bajar a <b>&lt;140</b> en <b>1 h</b> y mantener sin picos (ESO: hasta <b>7 días</b>)</div>
      <div class="nota r">No bajar de <b>130</b> (AHA: daño)</div>
    </div>`,
    "Esquema. Fuentes: AHA/ASA 2022 (Greenberg, Stroke 53:e282) y ESO/EANS 2025 (Steiner, Eur Stroke J 10:1007)."
  );
};
window.cuadro(0, 1);
</script></body></html>
