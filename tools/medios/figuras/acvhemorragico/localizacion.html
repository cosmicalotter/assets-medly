<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:flex;gap:12px}
  .col{flex:1;border:1px solid var(--linea);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .col svg{width:190px;height:190px}
  .loc{font-size:17px;font-weight:800}
  .ej{font-size:12px;color:var(--suave);text-align:center;min-height:30px}
  .regla{width:100%;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.35;background:color-mix(in srgb,var(--azul) 12%,white)}
  .abajo{border-radius:12px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--violeta) 12%,white)}
</style></head><body>
<script>
window.cuadro = function () {
  lienzo(
    "¿Quién necesita angio-TC?",
    "Según dónde esté el hematoma y la edad, para buscar una causa macrovascular",
    `<div class="fila">
      <div class="col"><div class="loc">Lobar</div>
        <svg viewBox="-8 -8 216 216">${corteTC({ hema: { cx: 52, cy: 58, rx: 20, ry: 13, rot: -40 } })}</svg>
        <div class="ej">corteza y sustancia blanca subcortical</div>
        <div class="regla">Angio-TC ± venografía si <b>&lt;70 años</b></div></div>
      <div class="col"><div class="loc">Profunda</div>
        <svg viewBox="-8 -8 216 216">${corteTC({ hema: { cx: 74, cy: 104, rx: 15, ry: 10, rot: -15 } })}</svg>
        <div class="ej">ganglios basales y tálamo</div>
        <div class="regla">Angio-TC ± venografía si <b>&lt;45 años</b>, o <b>45-70</b> sin HTA conocida</div></div>
      <div class="col"><div class="loc">Fosa posterior</div>
        <svg viewBox="-8 -8 216 216">${corteTC({ fosa: true, hema: { cx: 74, cy: 132, rx: 15, ry: 12, rot: 10 } })}</svg>
        <div class="ej">cerebelo y tronco</div>
        <div class="regla">Igual que profunda: <b>&lt;45 años</b>, o <b>45-70</b> sin HTA</div></div>
    </div>
    <div class="abajo">Sangre <b>solo intraventricular</b>, sin hematoma en el parénquima → <b>arteriografía (DSA)</b> directamente.</div>`,
    "Esquema, no imagen real. AHA/ASA 2022, sección 4.2 (Clase 1, B-NR)."
  );
};
window.cuadro(0, 1);
</script></body></html>
