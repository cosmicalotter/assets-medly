<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .lista{flex:1;display:flex;flex-direction:column;gap:9px}
  .item{display:flex;gap:12px;align-items:stretch;border:1px solid var(--linea);border-radius:14px;overflow:hidden}
  .barra{width:8px;flex:none}
  .cuerpo{padding:9px 12px 9px 0;display:flex;flex-direction:column;gap:3px}
  .quien{font-size:15px;font-weight:800}
  .que{font-size:14px;line-height:1.35}
  .f{font-size:11.5px;color:var(--suave)}
  .pie{border-radius:12px;padding:9px 12px;font-size:13.5px;background:color-mix(in srgb,var(--azul) 11%,white)}
</style></head><body>
<script>
window.cuadro = function () {
  lienzo(
    "Reinicio de antitrombóticos tras la HIC",
    "Decisión individual y multidisciplinaria antes del alta",
    `<div class="lista">
      <div class="item"><div class="barra" style="background:var(--rojo)"></div><div class="cuerpo"><div class="quien">Válvula mecánica o asistencia ventricular</div><div class="que">Reanudar la anticoagulación <b>de forma temprana</b>: el riesgo trombótico es muy alto.</div><div class="f">AHA/ASA 2022 · 2a</div></div></div>
      <div class="item"><div class="barra" style="background:var(--violeta)"></div><div class="cuerpo"><div class="quien">Fibrilación auricular no valvular</div><div class="que">Si se decide anticoagular: hacia las <b>7-8 semanas</b>, sopesando el riesgo de cada paciente.</div><div class="f">AHA/ASA 2022 · 2b · ESO 2025: un ACOD puede considerarse tras evaluar riesgo y beneficio</div></div></div>
      <div class="item"><div class="barra" style="background:var(--ambar)"></div><div class="cuerpo"><div class="quien">No candidato a anticoagulación</div><div class="que">Considerar <b>cierre de la orejuela izquierda</b> (p. ej., angiopatía amiloide).</div><div class="f">AHA/ASA 2022 · 2b · ESO 2025 (consenso)</div></div></div>
      <div class="item"><div class="barra" style="background:var(--teal)"></div><div class="cuerpo"><div class="quien">Antiagregante con indicación</div><div class="que">Puede reiniciarse valorando beneficio y riesgo; sin indicación, no iniciarlo.</div><div class="f">AHA/ASA 2022 · 2b · ESO 2025: débil a favor</div></div></div>
    </div>
    <div class="pie">CHA₂DS₂-VASc y HAS-BLED orientan, pero <b>no deciden solas</b>: pesan la causa de la HIC, las microhemorragias y la PA.</div>`,
    "Fuentes: AHA/ASA 2022 sección 9.1.3; ESO/EANS 2025 PICO 6.2-6.4."
  );
};
window.cuadro(0, 1);
</script></body></html>
