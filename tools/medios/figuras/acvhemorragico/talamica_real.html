<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body>
<script>
// Hemorragia talámica abierta a los ventrículos con hidrocefalia: dos cortes de la serie de
// Yadav et al., BMC Neurol 2007 (Wikimedia Commons, CC BY 2.0), recortados y señalados por Empirica.
const T = "#5EEAD4", A = "#FDE68A";
const F = { img: "fuentes/tc_talamica_yadav_2007.jpg", w: 400, h: 330, ancho: 324, alto: 370 };
lienzo("Hemorragia talámica abierta a los ventrículos", "TC sin contraste: el hematoma pasa a los ventrículos y los dilata",
  `<div class="paneles">${[
    panel({ ...F, vista: [6, 8, 132, 160],
      dibujo: (e) => flecha(30, 140, 58, 94, T, e) + rotulo(10, 152, "hematoma talámico", T, e, "start", 15),
      pie: '<span class="r">Al ingreso</span>: hematoma talámico' }),
    panel({ ...F, vista: [266, 0, 134, 166],
      dibujo: (e) => flecha(296, 30, 322, 82, T, e) + rotulo(272, 24, "sangre ventricular", T, e, "start", 15)
        + flecha(384, 150, 362, 126, A, e) + rotulo(398, 156, "ventrículo dilatado", A, e, "end", 15),
      pie: '<span class="r">Después</span>: sangre en los ventrículos e <b>hidrocefalia</b>' }),
  ].join("")}</div>`,
  "TC: Yadav YR et al., BMC Neurol 2007, vía Wikimedia Commons, CC BY 2.0, recortadas y señaladas por Empirica.");
</script></body></html>
