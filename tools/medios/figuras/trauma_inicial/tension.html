<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Neumotórax a tensión (ATLS 10.ª ed., cap. 4, p. 65-66): una fuga de aire con «válvula de una vía» llena el hemitórax,
// colapsa el pulmón, desplaza el mediastino al otro lado y cae el retorno venoso; la descompresión en el 5.º espacio,
// algo anterior a la línea axilar media, deja salir el aire. Esquema frontal plano: el lado derecho del paciente a la izquierda.
const AIRE = "#22D3EE", PULMON = "#F9A8D4", BORDE_P = "#DB2777", CORAZON = "#EF5454", CAVA = "#3B82F6", AGUJA = "#F2A23A";

function escena(t) {
  // 0-0,58: se acumula el aire; 0,6-0,7: entra el catéter; 0,7-1: sale el aire
  const sube = suave(tramo(t, 0.04, 0.58)), baja = suave(tramo(t, 0.7, 0.95));
  const aire = sube * (1 - 0.8 * baja);        // cantidad de aire a presión (0-1)
  const d = 58 * aire;                           // desplazamiento del mediastino hacia la izquierda del paciente
  const s = 1 - 0.62 * aire;                     // tamaño del pulmón derecho
  // pulmón derecho: se encoge hacia el hilio
  const cxP = lerp(118, 168, 1 - s), cyP = lerp(190, 172, 1 - s), rxP = 66 * s + 6, ryP = 112 * (0.45 + 0.55 * s);
  // respiración: un pulso de aire entra en cada inspiración mientras sube la tensión
  const fase = (t * 7) % 1, entra = t < 0.6 && fase < 0.5;
  const flechaEntra = entra ? flecha(cxP - rxP + 6, cyP - 18, cxP - rxP - 26, cyP - 34, "#0E7490", 4, 11) : "";
  // catéter y salida del aire
  const cat = suave(tramo(t, 0.6, 0.68));
  const xa = 58, ya = 262; // 5.º espacio, algo anterior a la línea axilar media (lateral del hemitórax derecho)
  const sale = t > 0.7 && t < 0.97 && ((t * 9) % 1) < 0.6;
  const cuerpo = `
  <svg width="446" height="374" viewBox="0 0 420 352">
    <defs><clipPath id="torax"><path d="M70 60 Q30 120 34 230 Q38 318 120 330 L300 330 Q382 318 386 230 Q390 120 350 60 Q300 30 210 30 Q120 30 70 60Z"/></clipPath></defs>
    <!-- pared y cavidades -->
    <path d="M70 60 Q30 120 34 230 Q38 318 120 330 L300 330 Q382 318 386 230 Q390 120 350 60 Q300 30 210 30 Q120 30 70 60Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="5"/>
    ${[90, 130, 170, 210, 250, 290].map((y) => `<path d="M${54 - (y > 250 ? 6 : 0)} ${y} Q120 ${y + 18} 196 ${y + 4}" fill="none" stroke="#E2E8F0" stroke-width="5"/><path d="M${366 + (y > 250 ? 6 : 0)} ${y} Q300 ${y + 18} 224 ${y + 4}" fill="none" stroke="#E2E8F0" stroke-width="5"/>`).join("")}
    <!-- aire a presión en el hemitórax derecho -->
    <ellipse clip-path="url(#torax)" cx="${120 + d * 0.25}" cy="192" rx="${84 + d * 0.35}" ry="128" fill="${AIRE}" fill-opacity="${0.04 + 0.6 * aire}"/>
    <!-- pulmón izquierdo, comprimido por el mediastino -->
    <ellipse cx="${300 + d * 0.45}" cy="190" rx="${68 - d * 0.42}" ry="${112 - d * 0.25}" fill="${PULMON}" stroke="${BORDE_P}" stroke-width="3"/>
    <!-- pulmón derecho, colapsándose -->
    <ellipse cx="${cxP}" cy="${cyP}" rx="${rxP}" ry="${ryP}" fill="${PULMON}" stroke="${BORDE_P}" stroke-width="3"/>
    <!-- tráquea y bronquios, desviados -->
    <path d="M210 8 L${210 + d * 0.55} 112" stroke="#64748B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M${210 + d * 0.55} 112 L${cxP + 18} ${cyP - 30} M${210 + d * 0.55} 112 L${282 + d * 0.5} 150" stroke="#64748B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- vena cava: se acoda con el desplazamiento -->
    <path d="M186 20 Q${186 + d * 0.15} ${110 + d * 0.3} ${206 + d} 198" stroke="${CAVA}" stroke-width="${11 - 6 * aire}" stroke-linecap="round" fill="none"/>
    <!-- corazón y mediastino -->
    <path d="M${214 + d} 172 C${172 + d} 150 ${160 + d} 214 ${222 + d} 262 C${284 + d} 214 ${272 + d} 150 ${230 + d} 172 Z" fill="${CORAZON}" stroke="#991B1B" stroke-width="3"/>
    ${d > 6 ? flecha(250, 300, 250 + d * 0.9 + 12, 300, AGUJA, 6, 15) : ""}
    ${flechaEntra}
    <!-- catéter de descompresión -->
    <g opacity="${cat}">
      <line x1="${xa - 46}" y1="${ya + 6}" x2="${xa + 18}" y2="${ya - 4}" stroke="#111" stroke-width="9" stroke-linecap="round" stroke-opacity=".35"/>
      <line x1="${xa - 46}" y1="${ya + 6}" x2="${xa + 18}" y2="${ya - 4}" stroke="${AGUJA}" stroke-width="5" stroke-linecap="round"/>
      ${sale ? flecha(xa - 8, ya + 1, xa - 54, ya - 26, "#0E7490", 4, 11) : ""}
    </g>
  </svg>`;
  const barra = (tit, v, c) => `<div style="display:flex;flex-direction:column;gap:3px">
    <div style="font-size:13.5px;font-weight:800;color:#374151">${tit}</div>
    <div style="height:15px;border-radius:8px;background:#E5E7EB;overflow:hidden"><div style="height:100%;width:${Math.round(100 * v)}%;background:${c}"></div></div></div>`;
  const etapa = t < 0.32 ? ["Válvula de una vía", "El aire <b>entra</b> en cada inspiración y no sale"]
    : t < 0.6 ? ["Desplazamiento", "El mediastino se va al otro lado y se <b>acoda la cava</b>: cae el retorno venoso"]
    : t < 0.72 ? ["Descompresión", "Catéter de <b>8 cm</b> en el 5.º espacio, algo anterior a la línea axilar media"]
    : ["Sale el aire", "Vuelve el retorno venoso; después, <b>tubo de tórax</b> obligatorio"];
  const lado = `<div style="width:210px;display:flex;flex-direction:column;gap:12px">
    <div class="caja" style="background:${tinte(t < 0.6 ? ROJO : VERDE, 12)};border:2px solid ${t < 0.6 ? ROJO : VERDE}">
      <div style="font-weight:900;font-size:16px;color:${t < 0.6 ? ROJO : "#15803D"}">${etapa[0]}</div><div style="font-size:14px;line-height:1.35;margin-top:3px">${etapa[1]}</div></div>
    ${barra("Aire a presión en el hemitórax", aire, AIRE)}
    ${barra("Retorno venoso", 1 - 0.75 * aire, CAVA)}
    ${barra("Presión arterial", 1 - 0.65 * aire, CORAZON)}
    <div style="display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.3">
      <div><b style="color:#0891B2">■</b> Aire en la pleura</div><div><b style="color:${BORDE_P}">■</b> Pulmón</div>
      <div><b style="color:${CAVA}">■</b> Vena cava</div><div><b style="color:#F2A23A">■</b> Catéter y desplazamiento</div></div></div>`;
  return `<div style="display:flex;gap:14px;align-items:center;flex:1 0 auto">${cuerpo}${lado}</div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  lienzo("Neumotórax a tensión", "El lado derecho del paciente, a la izquierda de la imagen",
    escena(t), "Esquema de fisiología. Fuente: ATLS 10.ª ed., cap. 4, p. 65-66.");
};
window.cuadro(17, 40);
</script></body></html>
