<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Revisión primaria xABCDE (ACS 2025, anuncio del ATLS 11; ATLS 10.ª ed., cap. 1, p. 6-10; MinSalud 2012, p. 308-309):
// la hemorragia exanguinante primero y después A, B, C, D y E, cada letra con su acción principal.
// GIF: un marcador recorre la línea de las seis letras y cada tarjeta se enciende en orden.
const L = [
  { l: "x", c: "#B91C1C", tit: "Hemorragia exangui&shy;nante", txt: "Presión directa y <b>torniquete</b> si no basta", dato: "Va <b>antes</b> de la A si es profusa" },
  { l: "A", c: AZUL, tit: "Vía aérea y columna cervical", txt: "Maniobras y aspirar; <b>vía aérea definitiva</b> con GCS ≤8", dato: "Sostener la <b>cabeza</b> al abrir el collar" },
  { l: "B", c: CELESTE, tit: "Respiración", txt: "Descom&shy;primir la <b>tensión</b>; apósito en tres lados; tubo", dato: "Catéter de <b>8&nbsp;cm</b> en el 5.º espacio" },
  { l: "C", c: ROJO, tit: "Circulación", txt: "Dos venas ≥18 G, <b>ácido tranexámico</b> y sangre", dato: "Hipotensión es <b>sangrado</b> hasta demostrar lo contrario" },
  { l: "D", c: MORADO, tit: "Déficit neurológico", txt: "GCS, <b>pupilas</b>, lateralización y glucemia", dato: "Si baja el GCS, revisar <b>A, B y C</b>" },
  { l: "E", c: AMBAR, tit: "Exposición", txt: "Desvestir, girar en bloque y evitar la <b>hipotermia</b>", dato: "Líquidos tibios a <b>39&nbsp;°C</b>" },
];
const X0 = 62, DX = 109;
function tarjeta6(e, op) {
  const ct = e.c === AMBAR ? "#B26B10" : e.c;
  return `<div style="opacity:${op};border:2px solid ${e.c};background:${tinte(e.c, 11)};border-radius:12px;padding:8px 9px;width:101px;display:flex;flex-direction:column;gap:4px">
    <div style="font-weight:900;color:${ct};font-size:30px;line-height:1;font-family:'Space Grotesk',Inter,sans-serif">${e.l}</div>
    <div style="font-weight:800;color:${ct};font-size:13.5px;line-height:1.15;hyphens:manual">${e.tit}</div>
    <div style="font-size:13.4px;line-height:1.32">${e.txt}</div>
    <div style="margin-top:auto;border-top:1.5px dashed ${e.c};padding-top:6px;font-size:12.8px;line-height:1.3;color:#374151">${e.dato}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  // cada letra ocupa 1/7 del tiempo; la última séptima parte enseña el mensaje final
  const paso = (k) => tramo(t, k / 7, k / 7 + 0.07);
  const op = (k) => 0.15 + 0.85 * suave(paso(k));
  let xm = X0;
  for (let k = 1; k < 6; k++) xm += DX * suave(tramo(t, k / 7 - 0.05, k / 7 + 0.02));
  const linea = `<svg width="668" height="70" viewBox="0 0 668 70">
    <line x1="${X0}" y1="34" x2="${X0 + 5 * DX}" y2="34" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round"/>
    <line x1="${X0}" y1="34" x2="${xm}" y2="34" stroke="${TEAL}" stroke-width="7" stroke-linecap="round"/>
    ${L.map((e, k) => `<circle cx="${X0 + k * DX}" cy="34" r="17" fill="${paso(k) > 0.5 ? e.c : "#fff"}" stroke="${e.c}" stroke-width="3.5"/>
      <text x="${X0 + k * DX}" y="40.5" text-anchor="middle" font-size="18" font-weight="900" fill="${paso(k) > 0.5 ? "#fff" : e.c}">${e.l}</text>`).join("")}
    <circle cx="${xm}" cy="34" r="25" fill="none" stroke="${TEAL}" stroke-width="4"/>
  </svg>`;
  const html = `${linea}
    <div style="display:flex;gap:8px;justify-content:center;flex:1 0 auto">${L.map((e, k) => tarjeta6(e, op(k))).join("")}</div>
    <div class="caja" style="opacity:${0.15 + 0.85 * suave(tramo(t, 6 / 7, 6 / 7 + 0.06))};background:#1F2A37;color:#fff;font-weight:700;font-size:14.5px;padding:11px 13px">
      El equipo hace las letras <b style="color:#5EEAD4">a la vez</b>; si el paciente empeora, se <b style="color:#FCA5A5">repite la primaria</b> desde la x.</div>`;
  lienzo("Revisión primaria: xABCDE", "Lo que mata primero se trata primero",
    html, "Esquema. Fuente: ACS 2025 (anuncio del ATLS 11); ATLS 10.ª ed., cap. 1, p. 6-10, y cap. 4, p. 66; MinSalud, Guías de atención prehospitalaria 2012, p. 308-309.");
};
window.cuadro(39, 40);
</script></body></html>
