<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="foto.js"></script></head><body><script>
// GIF sobre una ecografía real del cuadrante superior derecho (James Heilman, CC BY-SA 3.0): sangre libre en la bolsa de
// Morison, entre el hígado y el riñón. En este paciente la causa es un embarazo ectópico roto; el hallazgo es el mismo
// que se busca en el FAST del trauma (ATLS 10.ª ed., cap. 5, p. 90). La imagen se acerca a la bolsa y la marca late.
const COMPLETO = [0, 0, 1280, 1064], CERCA = [430, 250, 720, 599];
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const u = suave(tramo(t, 0.25, 0.6));
  const rec = COMPLETO.map((v, k) => lerp(v, CERCA[k], u));
  const late = 1 + 0.12 * Math.sin(t * Math.PI * 8);
  const marcas = [
    { x: 420, y: 330, rx: 200, ry: 150, c: AMARILLO, t: "Hígado", ty: 545 },
    { x: 650, y: 730, rx: 170, ry: 110, c: ROSA, t: "Riñón", ty: 880 },
  ];
  if (t > 0.18) marcas.push({ x: 800, y: 440, rx: 135 * late, ry: 42 * late, rot: -22, c: CIAN, t: "Sangre en la bolsa de Morison", tx: 800, ty: 360 });
  fotos({ titulo: "FAST: sangre en la bolsa de Morison", sub: "Ecografía real del cuadrante superior derecho",
    paneles: [{ src: "fuentes/commons_FluidMorisonsPouchEctop.PNG", tam: [1280, 1064], recorte: rec,
      tapar: [[20, 30, 640, 110, "#000"], [1205, 450, 75, 100, "#000"]],
      textos: [{ x: 40, y: 100, t: "Cuadrante superior derecho", tam: 52, c: "#fff", peso: 800 }], marcas }],
    alto: 336,
    notas: [[CIAN, "Franja <b>negra</b> (anecoica) entre el hígado y el riñón: hemoperitoneo"], [AMARILLO, "Con hemodinámica anormal y FAST positivo: <b>laparotomía</b>"]],
    fuente: "Ecografía: James Heilman, MD (Wikimedia Commons, CC BY-SA 3.0); en este caso, por un embarazo ectópico roto. Recortada y rotulada. Fuente: ATLS 10.ª ed., cap. 5, p. 90." });
};
window.cuadro(39, 40);
</script></body></html>
