<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="ctg.js"></script></head><body><script>
// FCF frente a pulso materno en el expulsivo (ACOG 2025, p. 592; FIGO 2015, 4.1.3).
const W = 672, PW = 600, X0 = 52, FH = 118, TH = 46, T1 = 6;
const picos = [1.2, 3.2, 5.2];
const uc = (t) => picos.reduce((a, p) => a + campana(t, p, 1.1, 0.85), 0);
const f = oscilacion(11, 101), g = oscilacion(7, 102);
const fetal = (t) => 140 + f(t) - picos.reduce((a, p) => a + 30 * valle(t, p + 0.05, 0.3), 0);
const materna = (t) => 98 + g(t) + picos.reduce((a, p) => a + 32 * valle(t, p, 0.32), 0);
let s = "";
[["FCF del feto", "baja con cada pujo", fetal, VERDE], ["Pulso materno", "sube con cada pujo: no es la FCF", materna, ROJO]].forEach(([rot, nota, fn, c], i) => {
  const y = i * (FH + TH + 52) + 26;
  const p = papel({ x: X0, y, w: PW, h: FH, t0: 0, t1: T1, lmin: 70, lmax: 170, paso: 10 });
  const tc = toco(uc, { x: X0, y: y + FH + 4, w: PW, h: TH, t0: 0, t1: T1 });
  s += `<rect x="${X0 - 4}" y="${y - 24}" width="6" height="18" rx="2" fill="${c}"/>` + texto(X0 + 8, y - 9, rot, { c, s: 16 }) + texto(X0 + (i ? 136 : 122), y - 9, nota, { c: "#475569", s: 12.5, w: 600 });
  s += p.svg + dentro(X0, y, PW, FH, trazo(fn, p.X, p.Y, 0, T1, { ancho: 1.8, dt: 0.004 })) + tc.svg;
  picos.forEach((pk) => { s += `<line x1="${p.X(pk)}" y1="${y}" x2="${p.X(pk)}" y2="${y + FH + TH + 4}" stroke="${VIOLETA}" stroke-width="1.6" stroke-dasharray="5 4"/>`; });
});
const svg = `<svg width="${W}" height="${2 * (FH + TH + 52) + 10}" viewBox="0 0 ${W} ${2 * (FH + TH + 52) + 10}">${s}</svg>`;
const notas = caja(AZUL, "Si el registro <b>sube con cada pujo</b>, confirmar con <b>oxímetro de pulso</b> materno o <b>electrodo de calota</b>.");
lienzo("FCF real frente a pulso materno", "En el expulsivo el monitor externo puede captar el pulso de la madre", svg + notas,
  "Esquema ilustrativo, no es el registro de una paciente. Fuentes: ACOG 2025, p. 592; FIGO 2015, sección 4.1.3.");
</script></body></html>
