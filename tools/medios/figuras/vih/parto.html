<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Vía del parto en la gestante con VIH: memofichas ETMI Plus 2025 (p. 19-21) y EACS 2025 (p. 21).
lienzo("La carga viral decide la vía del parto", "Carga viral del tercer trimestre, 2 a 4 semanas antes del parto",
  `<div style="display:flex;justify-content:center"><div style="border:2px solid ${MORADO};background:${tinte(MORADO, 12)};border-radius:12px;padding:9px 18px;font-size:15px;font-weight:800;color:${MORADO}">Carga viral del tercer trimestre</div></div>` +
  filaC(
    tarjeta(VERDE, "Menor de 1.000 copias/mL", ["Programar <b>parto vaginal</b>", "Mantener la <b>TAR</b> oral", "<b>Zidovudina IV</b>: bolo de 2 mg/kg en 1 hora y luego 1 mg/kg/hora hasta el parto", "Sin <b>amniotomía</b>, monitoreo invasivo ni instrumentación"], { grande: true, fs: 16 }) +
    tarjeta(ROJO, "1.000 o más, o desconocida", ["<b>Cesárea electiva</b> a las 38 semanas, antes del trabajo de parto", "Sin <b>amniocentesis</b> para la madurez; si hay duda, esperar a la 39", "<b>Zidovudina IV</b> desde 3 horas antes de la cirugía", "Mantener la <b>TAR</b> oral"], { grande: true, fs: 16 })
  ) +
  banda(`La TAR <b style="color:#5EEAD4">nunca se suspende</b> en el parto. EACS 2025 pone el corte de la cesárea en <b style="color:#FCD34D">400 copias/mL</b>: entre 400 y 999, decidir en equipo.`),
  "Esquema de Empirica. Fuentes: Memofichas ETMI Plus (MinSalud 2025), p. 19-21; EACS 2025 (HIV Med 2026;27:18-32), p. 21.");
</script></body></html>
