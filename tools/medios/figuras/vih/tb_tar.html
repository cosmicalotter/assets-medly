<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// TAR y tuberculosis: Res. 227 de 2020 (p. 72-74); OMS 2021, tabla 4.2 (p. 117); Vía clínica VIH 2024, tabla 11 (p. 37).
const x0 = 40, x1 = 640, sem = (x1 - x0) / 10, X = (s) => x0 + s * sem;
const barra = (a, b, y, c, txt, punteada = false) => `<rect x="${X(a)}" y="${y}" width="${X(b) - X(a)}" height="28" rx="8" fill="${tinte(c, 30)}" stroke="${c}" stroke-width="2"${punteada ? ' stroke-dasharray="6 5"' : ""}/>
  <text x="${(X(a) + X(b)) / 2}" y="${y + 19}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${TINTA}">${txt}</text>`;
const svg = `<svg width="668" height="214" viewBox="0 0 668 214">
  ${barra(0, 10, 10, ROJO, "Tratamiento de la TB con rifampicina")}
  ${barra(2, 8, 50, VERDE, "Res. 227: TAR entre la 2.ª y la 8.ª semana")}
  ${barra(0, 2, 90, AZUL, "CD4 &lt;50")}${barra(2, 10, 90, GRIS, "OMS: todos en las 2 primeras semanas", true)}
  ${barra(8, 10, 130, MORADO, "Res. 227")}${barra(4, 8, 130, MORADO, "OMS: meningitis", true)}
  ${barra(0, 10, 170, AZUL, "Con rifampicina: DTG 50 mg cada 12 h (y 2 semanas después de suspenderla)")}
  ${[0, 2, 4, 6, 8, 10].map((s) => `<text x="${X(s)}" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4B5563">${s === 0 ? "Inicio" : `sem ${s}`}</text>`).join("")}
</svg>`;
lienzo("TB y VIH: primero la TB, pronto la TAR", "Semanas desde el inicio del antituberculoso", svg +
  filaC(
    tarjeta(VERDE, "Res. 227 de 2020", ["TAR entre la <b>2.ª y la 8.ª</b> semana", "Con CD4 <b>&lt;50</b>, en las primeras <b>2</b>", "Meningitis: considerar <b>después</b> de la 8.ª"]) +
    tarjeta(GRIS, "OMS 2021", ["<b>Todos</b> en las 2 primeras semanas", "Meningitis: entre la <b>4.ª y la 8.ª</b>"]) +
    tarjeta(ROJO, "No usar con rifampicina", ["<b>Doravirina</b>, bictegravir", "<b>IP</b> y cobicistat"])
  ),
  "Esquema de Empirica. Fuentes: Resolución 227 de 2020 (MinSalud), p. 72-74; OMS 2021, tabla 4.2 (p. 117); Vía clínica VIH 2024, tabla 11 (p. 37).");
</script></body></html>
