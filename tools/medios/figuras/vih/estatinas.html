<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Estatinas en la prevención primaria (EACS 2025, tabla 4, p. 28; texto p. 27). Riesgo con SCORE2.
lienzo("Estatina según el riesgo (EACS 2025)", "Personas con VIH de 40 años o más, prevención primaria",
  filaC(
    tarjeta(ROJO, "Riesgo muy alto", ["Enfermedad CV, diabetes con daño de órgano, ERC grave o SCORE2 ≥10 %", "Alta intensidad: <b>atorvastatina 40-80 mg</b> o <b>rosuvastatina 20-40 mg</b>", "LDL <b>&lt;55 mg/dL</b> y baja del 50 %"], { alto: 300 }) +
    tarjeta(NARANJA, "Riesgo alto", ["SCORE2 de 5 a &lt;10 %", "Intensidad <b>moderada o alta</b> según el riesgo", "LDL <b>&lt;70 mg/dL</b> y baja del 50 %"], { alto: 300 }) +
    tarjeta(VERDE, "Riesgo bajo a moderado", ["SCORE2 &lt;5 %", "Considerar intensidad moderada: <b>pitavastatina 4 mg</b>, atorvastatina 20 mg o rosuvastatina 10 mg", "Aunque el <b>LDL</b> no esté alto (REPRIEVE)"], { alto: 300 })
  ) +
  banda(`Ajustar la estatina a las <b style="color:#FCD34D">interacciones</b> con la TAR. La Vía clínica colombiana pide el riesgo con <b style="color:#5EEAD4">Framingham</b> cada año.`),
  "Esquema de Empirica. Fuentes: EACS 2025 (HIV Med 2026;27:18-32), tabla 4 (p. 28) y p. 27; Vía clínica VIH 2024, tabla 15 (p. 57).");
</script></body></html>
