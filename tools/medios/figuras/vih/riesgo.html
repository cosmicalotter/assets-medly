<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Riesgo de transmisión tras una exposición: tabla 11 (p. 53-54) y notas de la tabla 5 (p. 46) del Protocolo PEP 2025.
lienzo("¿Hay que dar PEP?", "El riesgo depende de la exposición, del fluido y de la carga viral de la fuente",
  filaC(
    tarjeta(ROJO, "Apreciable: dar PEP", ["Sexo <b>anal o vaginal</b> sin condón", "<b>Agujas</b> compartidas", "Pinchazo o mordedura con <b>herida</b>", "Fuente con carga <b>detectable o desconocida</b>, o desconocida <b>con factores de riesgo</b>"], { fs: 13.5 }) +
    tarjeta(NARANJA, "Bajo o mínimo: valorar", ["Sexo <b>oral</b>", "Salpicadura en <b>mucosas</b> o piel no intacta", "Exposiciones anteriores con fuente <b>indetectable</b> o desconocida <b>sin factores</b>"], { fs: 13.5 }) +
    tarjeta(VERDE, "Despreciable: no dar PEP", ["Fluidos <b>no infectantes</b>", "Piel <b>intacta</b>", "Besos, caricias, masturbación", "Mordedura <b>sin herida</b>"], { fs: 13.5 })
  ) +
  filaC(
    tarjeta(MORADO, "Fluidos infectantes", ["<b>Sangre</b>, semen, secreciones vaginales", "LCR, líquidos pleural, pericárdico, peritoneal, sinovial y amniótico", "<b>Leche</b> humana"]) +
    tarjeta(GRIS, "No infectantes (sin sangre visible)", ["Orina, heces, <b>saliva</b>", "Vómito, secreciones nasales, lágrimas", "Sudor y <b>esputo</b>"])
  ) +
  banda(`Fuente que no se puede estudiar: considerarla de <b style="color:#FCA5A5">alto riesgo</b>. Fuente indetectable: sólo evita la PEP en la exposición <b style="color:#5EEAD4">sexual</b>.`),
  "Esquema de Empirica. Fuente: Protocolo PEP 2025 (MinSalud, adaptado de GESIDA), tabla 11 (p. 53-54), tabla 6 (p. 47) y notas de la tabla 5 (p. 46).");
</script></body></html>
