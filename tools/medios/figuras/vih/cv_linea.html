<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Seguimiento virológico: Vía clínica VIH 2024, algoritmo 7 (p. 50) y tabla 16 (p. 58); GPC 2021, recomendaciones 16a-16c.
const E = [
  { c: TEAL, tit: "Mes 2", txt: "Carga viral: ¿bajó los <b>logaritmos</b> esperados?" },
  { c: AZUL, tit: "Mes 4", txt: "Carga viral: ¿menor de <b>200 copias/mL</b>?" },
  { c: VERDE, tit: "Cada 6 meses", txt: "Carga viral, <b>CD4</b> y CD4/CD8 mientras siga suprimida" },
  { c: AMBAR, tit: "Si no baja o pasa de 200", txt: "Evaluar la <b>adherencia</b> (SMAQ)" },
  { c: NARANJA, tit: "Menos del 95 %", txt: "Reforzar la adherencia y repetir la carga en <b>2 meses</b>" },
  { c: ROJO, tit: "95 % o más", txt: "<b>Genotipo</b> e infectología: nuevo esquema con 2-3 activos" },
];
function caja(e, op) {
  const ct = e.c === AMBAR ? "#B26B10" : e.c;
  return `<div style="opacity:${op};border:2px solid ${e.c};background:${tinte(e.c, 12)};border-radius:12px;padding:9px 11px;flex:1;min-height:108px">
    <div style="font-weight:900;color:${ct};font-size:16px">${e.tit}</div><div style="font-size:14.5px;line-height:1.34;margin-top:3px">${e.txt}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const op = (a) => 0.16 + 0.84 * suave(tramo(t, a, a + 0.07));
  const x0 = 36, x1 = 632, X = (m) => x0 + (x1 - x0) * m / 18;
  const xm = X(18 * suave(tramo(t, 0.05, 0.55)));
  const hito = (m, c, txt) => `<circle cx="${X(m)}" cy="31" r="9" fill="${c}"/><text x="${X(m)}" y="66" text-anchor="middle" font-size="12.5" font-weight="800" fill="#374151">${txt}</text>`;
  const linea = `<svg width="668" height="76" viewBox="0 0 668 76">
    <line x1="${x0}" y1="31" x2="${x1}" y2="31" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="${x0}" y1="31" x2="${xm}" y2="31" stroke="${TINTA}" stroke-width="6" stroke-linecap="round" opacity=".25"/>
    ${hito(0, GRIS, "Inicia TAR")}${hito(2, TEAL, "Mes 2")}${hito(4, AZUL, "Mes 4")}${hito(10, VERDE, "Mes 10")}${hito(16, VERDE, "Mes 16")}
    <circle cx="${xm}" cy="31" r="8" fill="#fff" stroke="${TINTA}" stroke-width="3"/></svg>`;
  lienzo("Seguimiento de la carga viral", "Del inicio de la TAR a la falla virológica", `${linea}
     <div style="display:flex;gap:10px">${caja(E[0], op(0.04))}${caja(E[1], op(0.14))}${caja(E[2], op(0.3))}</div>
     <div style="display:flex;gap:10px">${caja(E[3], op(0.5))}${caja(E[4], op(0.62))}${caja(E[5], op(0.74))}</div>
     <div class="caja" style="opacity:${op(0.86)};background:#1F2A37;color:#fff;font-weight:700;font-size:14px;padding:11px 13px">Falla: <b style="color:#FCA5A5">dos cargas >200 copias/mL</b>; con un esquema nuevo, el reloj vuelve a empezar en el <b style="color:#5EEAD4">mes 2</b>.</div>`,
    "Esquema de Empirica. Fuentes: Vía clínica VIH 2024 (MinSalud), algoritmo 7 (p. 50) y tabla 16 (p. 58); GPC VIH 2021, recomendaciones 16a-16c y consideraciones del panel (p. 94).");
};
window.cuadro(47, 48);
</script></body></html>
