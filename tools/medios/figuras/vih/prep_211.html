<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// PrEP a demanda 2+1+1 y diaria (Lineamiento PrEP 2023, tablas 4 y 5, p. 29-31).
const x0 = 60, x1 = 640, X = (h) => x0 + (x1 - x0) * (h + 24) / 96;
const pastilla = (x, y, c = AZUL) => `<g transform="translate(${x},${y}) rotate(-25)"><rect x="-17" y="-8" width="34" height="16" rx="8" fill="${c}" stroke="#1E3A8A" stroke-width="1.5"/><line x1="0" y1="-8" x2="0" y2="8" stroke="#1E3A8A" stroke-width="1.2"/></g>`;
const svg = `<svg width="668" height="230" viewBox="0 0 668 230">
  <line x1="${x0}" y1="150" x2="${x1}" y2="150" stroke="#94A3B8" stroke-width="3"/>
  <rect x="${X(-24)}" y="140" width="${X(-2) - X(-24)}" height="20" rx="6" fill="${tinte(TEAL, 35)}" stroke="${TEAL}" stroke-width="1.5"/>
  <text x="${(X(-24) + X(-2)) / 2}" y="183" text-anchor="middle" font-size="12.5" font-weight="800" fill="${TINTA}">entre 24 y 2 horas antes</text>
  <line x1="${X(0)}" y1="118" x2="${X(0)}" y2="160" stroke="${ROSA_C}" stroke-width="3"/>
  <text x="${X(0)}" y="110" text-anchor="middle" font-size="13" font-weight="900" fill="${ROSA_C}">Relación sexual</text>
  ${pastilla((X(-24) + X(-2)) / 2 - 22, 72)}${pastilla((X(-24) + X(-2)) / 2 + 22, 72)}
  <text x="${(X(-24) + X(-2)) / 2}" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="${AZUL}">2 tabletas</text>
  ${pastilla(X(18), 72)}<text x="${X(18)}" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="${AZUL}">1 tableta</text>
  ${pastilla(X(42), 72)}<text x="${X(42)}" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="${AZUL}">1 tableta</text>
  ${[[X(18), "24 h después de las 2"], [X(42), "48 h después de las 2"]].map(([x, t]) => `<line x1="${x}" y1="140" x2="${x}" y2="160" stroke="${AZUL}" stroke-width="3"/><text x="${x}" y="183" text-anchor="middle" font-size="12.5" font-weight="800" fill="${TINTA}">${t}</text>`).join("")}
</svg>`;
lienzo("PrEP a demanda: el esquema 2 + 1 + 1", "Sólo con TDF/FTC y sólo en hombres que tienen sexo con hombres", svg +
  filaC(
    tarjeta(AZUL, "Si el riesgo sigue varios días", ["1 tableta <b>cada día</b> mientras dure", "Y hasta <b>2 días</b> después de la última relación"]) +
    tarjeta(TEAL, "PrEP diaria (todos)", ["1 tableta al día, a cualquier hora", "Olvido: tomarla al recordar, <b>máximo 2</b> al día"]) +
    tarjeta(ROJO, "No a demanda", ["Con <b>hepatitis B</b> crónica", "Con <b>TAF/FTC</b>", "Si la usa de forma <b>continua</b>: pasar a diaria"])
  ),
  "Esquema de Empirica. Fuente: Lineamiento técnico de PrEP (MinSalud 2023), tablas 4 y 5 (p. 29-31).");
</script></body></html>
