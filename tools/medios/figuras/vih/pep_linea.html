<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Línea de tiempo de la PEP (Res. 1780 de 2026, art. 7, p. 6; Protocolo PEP 2025, 7.3, p. 63 y 67; Vía clínica 2024, tabla 5, p. 25).
// GIF de flujo: el marcador recorre de la exposición a los 6 meses y se encienden los pasos de cada momento.
const P = [
  { c: TEAL, tit: "Llega a urgencias", txt: "Atender en menos de <b>2 horas</b>; tomar las <b>pruebas basales</b>" },
  { c: VERDE, tit: "Hasta 2 horas", txt: "Momento <b>ideal</b> para la primera dosis de <b>DLT</b>" },
  { c: AMBAR, tit: "Hasta 24 horas", txt: "Si no fue posible antes: iniciar <b>en el día</b>" },
  { c: ROJO, tit: "72 horas", txt: "<b>Límite</b>: después ya no se inicia la PEP" },
  { c: AZUL, tit: "30 días de DLT", txt: "1 tableta al día; se entregan <b>todas las dosis</b> al salir" },
  { c: MORADO, tit: "Controles", txt: "VIH a las <b>4-6 semanas</b> y a los <b>3 meses</b>; hepatitis a los 6" },
];
function caja(e, op) {
  const ct = e.c === AMBAR ? "#B26B10" : e.c;
  return `<div style="opacity:${op};border:2px solid ${e.c};background:${tinte(e.c, 12)};border-radius:12px;padding:9px 11px;width:212px;min-height:112px">
    <div style="font-weight:900;color:${ct};font-size:15.5px">${e.tit}</div><div style="font-size:13.5px;line-height:1.34;margin-top:3px">${e.txt}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const op = (a) => 0.16 + 0.84 * suave(tramo(t, a, a + 0.07));
  // eje en dos tramos: horas (0-72 h) a la izquierda y semanas (0-24) a la derecha
  const xh0 = 30, xh1 = 300, xs0 = 316, xs1 = 640;
  const xh = (h) => xh0 + (xh1 - xh0) * (h <= 2 ? 0.2 * h / 2 : h <= 24 ? 0.2 + 0.35 * (h - 2) / 22 : 0.55 + 0.45 * (h - 24) / 48);
  const xs = (s) => xs0 + (xs1 - xs0) * (s <= 6 ? 0.5 * s / 6 : 0.5 + 0.5 * (s - 6) / 18);
  const u = suave(tramo(t, 0.06, 0.9));
  const xm = u < 0.5 ? xh0 + (xh1 - xh0) * (u / 0.5) : xs0 + (xs1 - xs0) * ((u - 0.5) / 0.5);
  const zona = (a, b, c) => `<rect x="${xh(a)}" y="20" width="${xh(b) - xh(a)}" height="24" fill="${tinte(c, 35)}" stroke="${c}" stroke-width="1.5"/>`;
  const marca = (x, txt, y = 72) => `<line x1="${x}" y1="46" x2="${x}" y2="54" stroke="#94A3B8" stroke-width="2"/>
      <text x="${x}" y="${y}" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">${txt}</text>`;
  const linea = `<svg width="668" height="96" viewBox="0 0 668 96">
    <text x="${(xh0 + xh1) / 2}" y="12" text-anchor="middle" font-size="12" font-weight="800" fill="${TINTA}">Horas desde la exposición</text>
    <text x="${(xs0 + xs1) / 2}" y="12" text-anchor="middle" font-size="12" font-weight="800" fill="${TINTA}">Semanas</text>
    ${zona(0, 2, VERDE)}${zona(2, 24, AMBAR)}${zona(24, 72, ROJO)}
    <rect x="${xs0}" y="20" width="${xs(30 / 7) - xs0}" height="24" rx="6" fill="${tinte(AZUL, 35)}" stroke="${AZUL}" stroke-width="1.5"/>
    <text x="${xs0 + 8}" y="37" font-size="11.5" font-weight="800" fill="${TINTA}">DLT</text>
    <rect x="${xs(30 / 7)}" y="20" width="${xs1 - xs(30 / 7)}" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    ${[[xh(0), "0"], [xh(2), "2 h"], [xh(24), "24 h"], [xh(72), "72 h"]].map(([x, s]) => marca(x, s)).join("")}
    ${[[xs(2), "2"], [xs(5), "4-6"], [xs(12), "12"], [xs(24), "24"]].map(([x, s]) => marca(x, s)).join("")}
    ${[xs(2), xs(5), xs(12), xs(24)].map((x) => `<circle cx="${x}" cy="32" r="5" fill="${MORADO}"/>`).join("")}
    <line x1="${xm}" y1="14" x2="${xm}" y2="50" stroke="${TINTA}" stroke-width="3"/><circle cx="${xm}" cy="32" r="8" fill="#fff" stroke="${TINTA}" stroke-width="3"/>
    <text x="334" y="90" text-anchor="middle" font-size="11" fill="#6B7280">Escala distinta en cada tramo</text></svg>`;
  lienzo("PEP: cuanto antes, más protege", "De la exposición a los controles del seguimiento",
    `${linea}
     <div style="display:flex;gap:10px;justify-content:center">${caja(P[0], op(0.02))}${caja(P[1], op(0.12))}${caja(P[2], op(0.26))}</div>
     <div style="display:flex;gap:10px;justify-content:center">${caja(P[3], op(0.42))}${caja(P[4], op(0.56))}${caja(P[5], op(0.74))}</div>
     <div class="caja" style="opacity:${op(0.86)};background:#1F2A37;color:#fff;font-weight:700;font-size:14px;padding:11px 13px">Fuente con <b style="color:#FCA5A5">resistencia</b> o DLT contraindicado: el esquema lo elige un <b style="color:#5EEAD4">experto</b>, sin pasar de 72 horas.</div>`,
    "Esquema de Empirica. Fuentes: Resolución 1780 de 2026, art. 7 (p. 6); Protocolo PEP 2025 (MinSalud), 7.3 (p. 63 y 67); Vía clínica VIH 2024, tabla 5 (p. 25).");
};
window.cuadro(47, 48);
</script></body></html>
