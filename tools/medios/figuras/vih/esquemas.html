<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Esquemas de inicio: Vía clínica VIH 2024, tablas 10 y 11 (p. 35-37); GPC 2021, recomendaciones 12-13.
lienzo("Esquemas de inicio de la TAR", "Adultos sin experiencia previa con antirretrovirales",
  `<div style="border:2.5px solid ${VERDE};background:${tinte(VERDE, 14)};border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between">
     <div><div style="font-weight:900;color:${VERDE};font-size:18px">Preferido: DLT</div><div style="font-size:14px;margin-top:2px">Dolutegravir + tenofovir disoproxil + lamivudina, <b>1 tableta al día</b></div></div>
     <div style="font-size:30px;font-weight:900;color:${VERDE}">1×</div></div>` +
  filaC(
    tarjeta(AZUL, "Otros preferidos", ["DTG + <b>TAF</b>/FTC", "DTG + TDF/FTC", "DTG/<b>ABC</b>/3TC", "DTG/3TC (dual)", "BIC/TAF/FTC"], { alto: 236 }) +
    tarjeta(MORADO, "Alternativos", ["RAL + ABC/3TC", "RAL + TDF/FTC o TAF/FTC", "EVG/c/TAF/FTC", "DOR/3TC/TDF"], { alto: 236 }) +
    tarjeta(ROJO, "Evitar si…", ["Riesgo CV alto: <b>ABC</b>, DRV/r", "Riñón u osteoporosis: <b>TDF</b>", "Hepatitis B: <b>3TC</b> como único análogo", "Neuropsiquiatría: <b>EFV</b>"], { alto: 236 })
  ) +
  banda(`Antes del abacavir, <b style="color:#5EEAD4">HLA-B*5701</b> negativo. Con rifampicina, DTG <b style="color:#FCD34D">cada 12 horas</b>.`),
  "Esquema de Empirica. Fuentes: Vía clínica VIH 2024 (MinSalud), tablas 10 y 11 (p. 35-37); GPC VIH 2021, recomendaciones 12, 13 y 41.");
</script></body></html>
