<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Cambio por efecto adverso: Vía clínica VIH 2024, tabla 13 (p. 39-46).
lienzo("Efecto adverso → cambio preferido", "Con carga viral indetectable, cambiar el fármaco culpable",
  filaC(
    tarjeta(NARANJA, "TDF", ["<b>Riñón</b>: Fanconi, proteinuria, creatinina", "<b>Hueso</b>: osteoporosis, FRAX >3 %", "→ <b>TAF</b>, DTG + ABC/3TC o DTG/3TC"], { alto: 168 }) +
    tarjeta(AMBAR, "Dolutegravir", ["<b>Peso</b>: dieta y ejercicio 3-6 meses → RPV o DOR", "<b>Cefalea</b> o insomnio → RAL, EVG/c o BIC"], { alto: 168 }) +
    tarjeta(MORADO, "Efavirenz", ["Sueños, mareo, <b>depresión</b>", "Suele ceder en <b>2-4 semanas</b>", "→ RPV, DOR o integrasa"], { alto: 168 })
  ) +
  filaC(
    tarjeta(ROJO, "Abacavir", ["<b>Hipersensibilidad</b> con HLA-B*5701", "→ TDF o TAF con 3TC/FTC, o DTG/3TC"], { alto: 150 }) +
    tarjeta(ROSA_C, "DRV/r", ["Brote con alergia a <b>sulfonamidas</b>", "→ otro IP (no FPV/r) o integrasa"], { alto: 150 }) +
    tarjeta(AZUL, "TAF", ["<b>Lípidos</b> o peso que no mejoran en 3-6 meses", "→ TDF o DTG/3TC"], { alto: 150 })
  ) +
  banda(`Brote por un <b style="color:#FCA5A5">no nucleósido</b> (EFV, NVP, ETR, DOR): no pasar a otro no nucleósido. Tras el cambio, <b style="color:#5EEAD4">carga viral</b> a los 2 meses.`),
  "Esquema de Empirica. Fuente: Vía clínica VIH 2024 (MinSalud), tabla 13 (p. 39-46), y algoritmo 7 (p. 50).");
</script></body></html>
