<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="comun.js"></script></head><body><script>
// Escalera de prevención de la IVU recurrente: AUA 2025 (agua, estrógeno, metenamina, arándano, profilaxis, autotratamiento); ACIN 2015 (esquemas).
const P = [
  [CIS, "1. Sin antibiótico", ["**Agua** si toma menos de **1,5 L** al día", "**Estrógeno vaginal** en la peri y la posmenopausia", "**Metenamina** hipurato", "**Arándano**"]],
  [PRO, "2. Profilaxis antibiótica", ["**Poscoital** si se liga a las relaciones", "**Continua** con **2 o más** al año, por **6 meses** o más", "**¼ a ½** de la dosis de tratamiento"]],
  [PIE, "3. Autotratamiento", ["En pacientes **seleccionadas**", "Con **urocultivo** antes de empezar"]],
];
const pasos = P.map(([c, t, items], i) => `<div style="flex:1;display:flex;flex-direction:column;gap:7px;margin-top:${(2 - i) * 34}px">
  <div style="background:${c};color:#fff;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:800">${t}</div>
  ${items.map((x) => pastilla(c, x)).join("")}</div>`).join("");
const pie = `<div class="caja" style="background:#F7F8FA;border:1.5px solid #E5E7EB">Cada episodio, con <b>urocultivo</b> y el ciclo <b>más corto</b> posible. Las quinolonas y la fosfomicina se <b>reservan</b> para tratar.</div>`;
lienzo("Prevenir la IVU recurrente", "Se sube un peldaño si las recurrencias siguen",
  `<div style="display:flex;gap:12px;align-items:flex-start">${pasos}</div>` + pie,
  "Esquema. Fuente: AUA/CUA/SUFU 2025; ACIN 2015 (esquemas de profilaxis).");
</script></body></html>
