<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="comun.js"></script></head><body><script>
// Sensibilidad de E. coli urinaria en estudios colombianos (rango mínimo-máximo): ACIN 2023, p. 62.
const F = [
  ["Fosfomicina", 88, 97, CIS], ["Amikacina", 88.2, 100, PIE], ["Nitrofurantoína", 78.8, 97.12, CIS], ["Gentamicina", 71.5, 92.3, PIE],
  ["Ciprofloxacina", 57.1, 86.0, ROJO], ["Ampicilina-sulbactam", 27.9, 87.5, ROJO], ["Trimetoprim-sulfametoxazol", 5.7, 60.8, ROJO],
];
const fmt = (v) => String(v).replace(".", ",");
const X0 = 210, W = 420;
const x = (v) => X0 + (v / 100) * W;
const filas = F.map(([n, a, z, c], i) => {
  const y = 30 + i * 44;
  return `<text x="${X0 - 12}" y="${y + 6}" text-anchor="end" font-size="14" font-weight="700" fill="${TINTA}">${n}</text>
    <rect x="${x(a)}" y="${y - 9}" width="${x(z) - x(a)}" height="18" rx="9" fill="${c}"/>
    <text x="${x(a) - 6}" y="${y + 5}" text-anchor="end" font-size="12.5" font-weight="800" fill="${c}">${fmt(a)}</text>
    <text x="${x(z) + 6}" y="${y + 5}" font-size="12.5" font-weight="800" fill="${c}">${fmt(z)}</text>`;
}).join("");
const ejes = [0, 20, 40, 60, 80, 100].map((v) => `<line x1="${x(v)}" y1="10" x2="${x(v)}" y2="${30 + F.length * 44 - 20}" stroke="#E5E7EB"/>
  <text x="${x(v)}" y="${30 + F.length * 44 - 4}" text-anchor="middle" font-size="12" fill="#6B7280">${v} %</text>`).join("");
const leyenda = [[CIS, "Orales para la **IVU baja**"], [PIE, "**Aminoglucósidos**"], [ROJO, "**No empíricos** en Colombia"]]
  .map(([c, t]) => `<div class="item" style="background:#F7F8FA;flex:1"><b style="color:${c}">●</b> ${b(t)}</div>`).join("");
lienzo("Sensibilidad de la E. coli urinaria en Colombia", "Rango entre los estudios colombianos, en porcentaje",
  `<svg width="668" height="${30 + F.length * 44}" viewBox="0 0 668 ${30 + F.length * 44}">${ejes}${filas}</svg><div style="display:flex;gap:8px">${leyenda}</div>`,
  "Gráfico. Fuente: ACIN 2023, p. 62 (resumen de los estudios colombianos de sensibilidad).");
</script></body></html>
