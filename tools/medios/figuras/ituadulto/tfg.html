<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="comun.js"></script></head><body><script>
// Antibióticos de la cistitis según la TFGe: ACIN 2023, tabla 2.
const MAX = 90, X0 = 175, W = 455;
const x = (v) => X0 + (Math.min(v, MAX) / MAX) * W;
const F = [
  ["Nitrofurantoína", [[0, 45, ROJO, "Contraindicada"], [45, MAX, VERDE, "Sí"]]],
  ["Fosfomicina", [[0, 10, AMBAR, "Precaución"], [10, MAX, VERDE, "Sí"]]],
  ["Cefazolina IV", [[0, 50, AMBAR, "Ajustar la dosis"], [50, MAX, VERDE, "Dosis plena"]]],
];
const filas = F.map(([n, seg], i) => {
  const y = 40 + i * 78;
  return `<text x="${X0 - 14}" y="${y + 6}" text-anchor="end" font-size="16" font-weight="800" fill="${TINTA}">${n}</text>` +
    seg.map(([a, z, c, t]) => `<rect x="${x(a)}" y="${y - 16}" width="${x(z) - x(a) - 2}" height="32" rx="8" fill="${c}"/>
      <text x="${(x(a) + x(z)) / 2}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${x(z) - x(a) > 70 ? t : ""}</text>`).join("") +
    (seg[0][1] < 20 ? `<text x="${x(seg[0][1]) + 4}" y="${y - 22}" font-size="12" font-weight="800" fill="#B4690E">${seg[0][3]} con menos de ${seg[0][1]}</text>` : "");
}).join("");
const cortes = [10, 45, 50].map((v) => `<line x1="${x(v)}" y1="14" x2="${x(v)}" y2="262" stroke="#94A3B8" stroke-dasharray="4 4"/>
  <text x="${x(v)}" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="${TINTA}">${v}</text>`).join("");
const eje = `<text x="${x(0)}" y="282" text-anchor="middle" font-size="12" fill="#6B7280">0</text><text x="${x(MAX)}" y="282" text-anchor="end" font-size="12" fill="#6B7280">90 o más mL/min</text>`;
const pie = `<div class="caja" style="background:${tinte(ROJO, 9)};border:1.5px solid ${tinte(ROJO, 40)}">Con TFGe <b>menor de 45 mL/min</b>, la nitrofurantoína no sirve: la opción oral es la <b>fosfomicina</b> en dosis única.</div>`;
lienzo("Antibióticos de la cistitis según la TFGe", "Qué cambia con la función renal (mL/min)",
  `<svg width="668" height="290" viewBox="0 0 668 290">${cortes}${filas}${eje}</svg>` + pie,
  "Gráfico. Fuente: ACIN 2023, tabla 2 (antimicrobianos y dosis para el manejo de la IVU complicada).");
</script></body></html>
