<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Estrategia farmacoinvasiva del IAMCEST (ESC 2023, fig. 7 p. 27 y recomendaciones p. 31; suplemento, tabla S10 p. 19):
// bolo y traslado, ECG a los 60-90 min y, según la resolución del ST, angiografía a las 2-24 h o ICP de rescate.
// GIF: cada etapa se enciende en orden y un marcador recorre la línea de tiempo.
const ETAPAS = [
  { x: 70, t: "0 min", c: AMBAR, tit: "Bolo fibrinolítico", txt: "En <b>&lt;10 min</b> del diagnóstico; traslado <b>inmediato</b> a un centro con ICP" },
  { x: 290, t: "60-90 min", c: AZUL, tit: "ECG de control", txt: "¿Bajó el ST <b>50 % o más</b>? ¿Mejoraron el dolor y la estabilidad?" },
];
const RAMAS = [
  { c: VERDE, tit: "Sí: fibrinólisis eficaz", txt: "Angiografía e ICP de la arteria culpable entre <b>2 y 24 h</b>" },
  { c: ROJO, tit: "No, o inestable", txt: "<b>ICP de rescate</b> inmediata; no repetir el fibrinolítico" },
];
function caja(e, op, ancho) {
  return `<div style="opacity:${op};transition:none;border:2px solid ${e.c};background:${tinte(e.c, 12)};border-radius:12px;padding:9px 11px;width:${ancho}px">
    <div style="font-weight:900;color:${e.c};font-size:15px">${e.tit}</div><div style="font-size:12.8px;line-height:1.3;margin-top:2px">${e.txt}</div></div>`;
}
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const op = (a) => 0.18 + 0.82 * suave(tramo(t, a, a + 0.08));
  // el marcador avanza con las cajas: 0 min con el bolo, 60-90 min con el ECG, 2-24 h con las ramas
  const xm = 40 + 195 * suave(tramo(t, 0.2, 0.27)) + 285 * suave(tramo(t, 0.45, 0.52));
  const linea = `<svg width="668" height="64" viewBox="0 0 668 64">
    <line x1="40" y1="30" x2="600" y2="30" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="${xm}" y2="30" stroke="${TEAL}" stroke-width="6" stroke-linecap="round"/>
    ${[[40, "0 min"], [235, "60-90 min"], [420, "2 h"], [600, "24 h"]].map(([x, s]) => `<circle cx="${x}" cy="30" r="7" fill="#fff" stroke="#94A3B8" stroke-width="3"/>
      <text x="${x}" y="58" text-anchor="middle" font-size="12.5" font-weight="800" fill="#374151">${s}</text>`).join("")}
    <circle cx="${xm}" cy="30" r="11" fill="${TEAL}" stroke="#fff" stroke-width="3"/>
  </svg>`;
  const html = `${linea}
    <div style="display:flex;gap:12px;justify-content:center">${caja(ETAPAS[0], op(0.02), 300)}${caja(ETAPAS[1], op(0.25), 300)}</div>
    <div style="display:flex;gap:12px;justify-content:center">${caja(RAMAS[0], op(0.5), 300)}${caja(RAMAS[1], op(0.68), 300)}</div>
    <div class="caja" style="opacity:${op(0.84)};background:#1F2A37;color:#fff;font-weight:700">Falla cardíaca o choque tras la fibrinólisis: angiografía <b style="color:#FCA5A5">urgente</b>, sin esperar.</div>`;
  lienzo("Estrategia farmacoinvasiva", "Cuando la ICP primaria no llega en 120 minutos",
    html, "Esquema. Fuente: Guía ESC 2023 de SCA (Eur Heart J 2023;44:3720-3826), fig. 7, p. 27, y recomendaciones de la p. 31.");
};
window.cuadro(39, 40);
</script></body></html>
