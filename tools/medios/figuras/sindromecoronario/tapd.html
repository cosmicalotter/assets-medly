<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Esquemas antitrombóticos durante los 12 meses tras el SCA (ESC 2023, tablas de recomendaciones 5 y 6, p. 39-40).
// Colores de las ramas del nodo: verde sin alto riesgo de sangrado, naranja alto riesgo, morado anticoagulación oral.
const X0 = 170, X1 = 615, mes = (m) => X0 + (X1 - X0) * m / 12;
const barra = (y, m0, m1, c, txt, claro = false) => `<rect x="${mes(m0)}" y="${y}" width="${mes(m1) - mes(m0) - 2}" height="34" rx="8" fill="${claro ? tinte(c, 25) : c}"/>
  <text x="${(mes(m0) + mes(m1)) / 2}" y="${y + 22}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${claro ? c : "#fff"}">${txt}</text>`;
const nombre = (y, c, t, s) => `<text x="8" y="${y + 15}" font-size="14" font-weight="800" fill="${c}">${t}</text><text x="8" y="${y + 31}" font-size="11.5" fill="#6B7280">${s}</text>`;
const ejes = [[0, "0", "end"], [1, "1 mes", "start"], [3, "3 meses", "middle"], [6, "6 meses", "middle"], [12, "12 meses", "middle"]].map(([m, t, a]) => `<line x1="${mes(m)}" y1="20" x2="${mes(m)}" y2="300" stroke="#E5E7EB"/>
  <text x="${mes(m) + (a === "end" ? -3 : a === "start" ? 3 : 0)}" y="318" text-anchor="${a}" font-size="12.5" font-weight="700" fill="#374151">${t}</text>`).join("");
const svg = `<svg width="668" height="325" viewBox="0 0 668 325">${ejes}
  ${nombre(40, VERDE, "Sin alto riesgo", "de sangrado")}
  ${barra(40, 0, 12, VERDE, "Aspirina + prasugrel o ticagrelor")}
  ${barra(80, 3, 12, VERDE, "Sin eventos: un antiagregante", true)}
  ${nombre(140, NARANJA, "Alto riesgo", "de sangrado (ARC-HBR)")}
  ${barra(140, 0, 1, NARANJA, "Doble")}
  ${barra(140, 1, 12, NARANJA, "Un antiagregante: aspirina o P2Y12", true)}
  ${nombre(210, MORADO, "Anticoagulación", "oral (FA)")}
  <rect x="${mes(0)}" y="210" width="16" height="34" rx="5" fill="${MORADO}"/>
  <text x="${mes(0) + 22}" y="203" font-size="11.5" font-weight="800" fill="${MORADO}">triple ≤1 semana</text>
  ${barra(210, 0.4, 12, MORADO, "ACOD + clopidogrel", true)}
  <text x="${mes(12) - 4}" y="268" text-anchor="end" font-size="12" font-weight="800" fill="${MORADO}">desde los 12 meses: sólo el anticoagulante</text>
</svg>`;
lienzo("Antiagregación tras el SCA", "Los 12 meses siguientes, según el riesgo de sangrado y la anticoagulación",
  svg + `<div class="caja" style="background:#F1F5F9">Nunca se <b>desescala</b> en los primeros 30 días; con riesgo digestivo alto, siempre <b>IBP</b>.</div>`,
  "Esquema. Fuente: Guía ESC 2023 de SCA (Eur Heart J 2023;44:3720-3826), recomendaciones de las p. 39-40.");
</script></body></html>
