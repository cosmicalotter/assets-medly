<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Volumen de los días 1 a 5 por grupo: ESPGHAN 2018 (líquidos), tabla 1.
const G = [
  ["A término", AZUL, [[40, 60], [50, 70], [60, 80], [60, 100], [100, 140]]],
  ["Pretérmino >1500 g", TEAL, [[60, 80], [80, 100], [100, 120], [120, 140], [140, 160]]],
  ["Pretérmino 1000-1500 g", MORADO, [[70, 90], [90, 110], [110, 130], [130, 150], [160, 180]]],
  ["Pretérmino <1000 g", ROJO, [[80, 100], [100, 120], [120, 140], [140, 160], [160, 180]]],
];
const X0 = 60, W = 590, Y0 = 10, H = 300, VM = 190;
const xd = (d, g) => X0 + ((d - 0.5) / 5) * W + (g - 1.5) * 22, yv = (v) => Y0 + H - (v / VM) * H;
let s = `<svg width="668" height="${H + 44}" style="flex:none">`;
for (let v = 0; v <= 180; v += 30) s += `<line x1="${X0}" y1="${yv(v)}" x2="${X0 + W}" y2="${yv(v)}" stroke="#EEF0F3"/><text x="${X0 - 8}" y="${yv(v) + 4}" text-anchor="end" font-size="11" fill="${GRIS}">${v}</text>`;
for (let d = 1; d <= 5; d++) s += `<text x="${X0 + ((d - 0.5) / 5) * W}" y="${H + Y0 + 22}" text-anchor="middle" font-size="13" font-weight="700" fill="${TINTA}">Día ${d}</text>`;
G.forEach(([n, c, r], g) => r.forEach(([a, b], d) => {
  s += `<rect x="${xd(d + 1, g) - 8}" y="${yv(b)}" width="16" height="${yv(a) - yv(b)}" rx="5" fill="${c}" opacity=".85"/>`;
}));
s += `<text x="${X0 + 4}" y="${Y0 + 12}" font-size="11" font-weight="700" fill="${GRIS}">mL/kg/día</text></svg>`;
const ley = `<div style="display:flex;gap:8px;flex-wrap:wrap">${G.map(([n, c]) => `<div class="item" style="background:${tinte(c, 14)};display:flex;gap:6px;align-items:center"><span style="width:11px;height:11px;border-radius:3px;background:${c}"></span><span>${n}</span></div>`).join("")}</div>`;
lienzo("Recién nacido: el volumen sube día a día", "Rango recomendado en los días 1 a 5, por grupo; cada barra va del mínimo al máximo",
  s + ley, "Datos: ESPGHAN 2018 (líquidos), tabla 1. Elaboración de Empirica.");
</script></body></html>
