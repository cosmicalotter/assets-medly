<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Hiponatremia del recién nacido: ESPGHAN 2018 (líquidos), sección 9.2.
const RAMAS = [
  ["Exceso", "No pierde o gana peso", NARANJA, "<b>Sobrecarga de agua</b>", "Oliguria y sodio urinario <b>>20 mEq/L</b>: pensar en <b>lesión renal aguda</b>"],
  ["Contracción", "Pierde peso o no crece", AMBAR, "<b>Depleción de sodio</b>", "Sodio urinario <b><20 mEq/L</b>; anemia aguda o deshidratación posnatal"],
  ["Prematuro", "Menos de 34 semanas", MORADO, "<b>Pérdida renal primaria</b>", "El túbulo reabsorbe mal el sodio; la agravan <b>cafeína</b> y diuréticos"],
];
const col = RAMAS.map(([t, s, c, d, n]) => `<div style="flex:1;display:flex;flex-direction:column;gap:8px">
  <div style="background:${c};color:#fff;border-radius:12px;padding:9px;text-align:center"><div style="font-size:16px;font-weight:800">${t}</div><div style="font-size:12px">${s}</div></div>
  <div style="text-align:center;color:${GRIS};font-size:20px">↓</div>
  <div class="caja" style="background:${tinte(c, 14)};text-align:center;font-size:14px"><span>${d}</span></div>
  <div class="caja" style="background:#F7F8FA;font-size:14px"><span>${n}</span></div></div>`).join("");
lienzo("Hiponatremia del recién nacido: tres caminos", "Sodio <135 mEq/L: mirar el volumen extracelular, el peso y el sodio urinario",
  `<div class="caja" style="background:${tinte(AZUL, 12)};text-align:center;font-size:14px"><span>Es un <b>exceso de agua</b>, absoluto o relativo; el sodio corporal puede estar bajo, normal o alto</span></div>
   <div style="display:flex;gap:10px">${col}</div>
   <div class="caja" style="background:#F7F8FA"><span>Corregir la hiponatremia grave en <b>48-72 h</b> o más: más rápido se asocia a <b>mielinólisis</b>.</span></div>`,
  "Datos: ESPGHAN 2018 (líquidos), sección 9.2. Elaboración de Empirica.");
</script></body></html>
