<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Las cuatro fases de la terapia IV: AAP 2018.
const FASES = [
  ["1", "Reanimación", ROJO, "Restablecer la <b>perfusión</b> y evitar el daño de órganos"],
  ["2", "Titulación", AMBAR, "Pasar de los <b>bolos</b> al mantenimiento; medir lo repuesto"],
  ["3", "Mantenimiento", AZUL, "<b>Balance exacto</b> entre necesidades y pérdidas"],
  ["4", "Convalecencia", VERDE, "Se <b>suspenden</b> los líquidos IV: vuelve a su propia regulación"],
];
const cajas = FASES.map(([n, t, c, d], i) => `<div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:stretch">
  <div style="background:${c};color:#fff;border-radius:12px;padding:12px 10px;text-align:center"><div style="font-size:28px;font-weight:800">${n}</div><div style="font-size:15px;font-weight:800">${t}</div></div>
  <div class="caja" style="background:${tinte(c, 12)};flex:1;font-size:14.5px"><span>${d}</span></div></div>${i < 3 ? `<div style="align-self:center;font-size:26px;color:${GRIS}">→</div>` : ""}`).join("");
lienzo("Las cuatro fases de la terapia IV", "La dosis de líquido cambia en cada fase y en cada paciente",
  `<div style="display:flex;gap:6px;height:235px">${cajas}</div>
   <div class="caja" style="background:#F7F8FA"><span>Los líquidos IV se <b>prescriben</b> como cualquier fármaco: sólo cuando están <b>indicados</b>.</span></div>`,
  "Datos: AAP 2018 (Feld LG et al., Pediatrics), antecedentes. Elaboración de Empirica.");
</script></body></html>
