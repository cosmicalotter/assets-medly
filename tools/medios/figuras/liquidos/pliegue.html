<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Signo del pliegue cutáneo: pellizcar y soltar. Fotos: DRobert, Wikimedia Commons, CC BY-SA 4.0.
// Cortes de la GPC de EDA (MinSalud 2013) y OMS/AIEPI, que cita el algoritmo.
const F1 = "fuentes/commons_SkinTurgorExamination.jpg", F2 = "fuentes/commons_LowSkinTurgor.jpg", REC = [60, 150, 860, 1000];
const PASOS = [
  [F1, "1.", "Pellizcar la piel con dos dedos y <b>soltar</b>"],
  [F2, "2.", "Contar cuánto tarda en volver: aquí el pliegue <b>persiste</b>"],
  [F2, "3.", "Clasificar según el tiempo"],
];
window.cuadro = function (i, n) {
  const [src, num, txt] = PASOS[Math.min(i, PASOS.length - 1)];
  const k = 388 / REC[3], w = Math.round(REC[2] * k);
  const pliegue = i >= 1 ? `<ellipse cx="380" cy="430" rx="230" ry="95" transform="rotate(-28 380 420)" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="${8 / k}"/><ellipse cx="380" cy="430" rx="230" ry="95" transform="rotate(-28 380 420)" fill="none" stroke="${AMBAR}" stroke-width="${4 / k}"/>` : "";
  const pasos = PASOS.map(([, nn, t], j) => `<div class="item" style="opacity:${j <= i ? 1 : 0.25};background:${j === Math.min(i, 2) ? tinte(TEAL, 14) : "#F7F8FA"};border:1.5px solid ${j === Math.min(i, 2) ? TEAL : "transparent"}"><span><b style="color:${TEAL}">${nn}</b> ${t}</span></div>`).join("");
  const cortes = i >= 2 ? `<div class="item" style="background:${tinte(ROJO, 12)};border:1.5px solid ${ROJO}"><span><b style="color:${ROJO}">Muy lento, más de 2 s</b>: signo de deshidratación <b>grave</b></span></div>
    <div class="item" style="background:${tinte(NARANJA, 12)};border:1.5px solid ${NARANJA}"><span><b style="color:${NARANJA}">Lento, menos de 2 s</b>: signo de <b>algún grado</b></span></div>
    <div class="item" style="background:#F7F8FA"><span>Cuenta como un signo: hacen falta <b>2 o más</b> para clasificar</span></div>` : "";
  lienzo("Signo del pliegue cutáneo", "Se pellizca la piel, se suelta y se cuenta lo que tarda en volver",
    `<div style="display:flex;gap:16px;align-items:center"><div style="flex:none"><svg width="${w}" height="388" viewBox="${REC.join(" ")}" style="display:block;border-radius:12px"><image href="${src}" x="0" y="0" width="1000" height="1333"/>${pliegue}</svg></div>
     <div style="flex:1;display:flex;flex-direction:column;gap:7px">${pasos}${cortes}</div></div>`,
    "Fotos: DRobert, Wikimedia Commons, CC BY-SA 4.0. Cortes: GPC de EDA (MinSalud 2013) y escala de la OMS y AIEPI. Rotuladas por Empirica.");
};
window.cuadro(2, 3);
</script></body></html>
