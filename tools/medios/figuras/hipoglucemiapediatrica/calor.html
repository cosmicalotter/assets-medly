<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
 .fila{flex:1;display:flex;gap:12px;min-height:0}
 .il{flex:1.1;min-height:0}
 .pasos{flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center}
 .p{border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,white);padding:9px 12px;font-size:14px;line-height:1.3}
 .p b{color:var(--c)}
</style></head><body>
<script>
// Bebé en prono sobre el pecho de la madre, con gorro y manta.
const ilus = `<svg class="il" viewBox="0 0 360 380">
  <path d="M30 380 Q40 170 180 150 Q320 170 330 380 Z" fill="#F3C9A8"/>
  <circle cx="180" cy="95" r="58" fill="#F3C9A8"/>
  <path d="M122 92 Q125 30 180 30 Q238 30 238 92 Q230 60 180 58 Q132 60 122 92Z" fill="#7C4A2D"/>
  <ellipse cx="180" cy="262" rx="88" ry="62" fill="#F7D6BD" stroke="#E8B48F" stroke-width="2"/>
  <circle cx="186" cy="196" r="40" fill="#F7D6BD" stroke="#E8B48F" stroke-width="2"/>
  <path d="M146 190 Q150 150 188 150 Q226 152 226 190 Q206 178 186 178 Q164 178 146 190Z" fill="${AZUL}"/>
  <circle cx="188" cy="146" r="9" fill="${AZUL}"/>
  <path d="M84 250 Q180 210 276 250 L280 330 Q180 360 80 330 Z" fill="${tinte(TEAL, 55)}" stroke="${TEAL}" stroke-width="3"/>
  <path d="M100 262 Q180 236 262 262" stroke="#fff" stroke-width="3" fill="none" opacity=".8"/>
  <text x="300" y="168" font-size="15" font-weight="800" fill="${AZUL}">gorro</text>
  <path d="M296 163 L232 172" stroke="${AZUL}" stroke-width="2.5"/>
  <text x="18" y="236" font-size="15" font-weight="800" fill="${TEAL}">manta</text>
  <path d="M66 240 L100 262" stroke="${TEAL}" stroke-width="2.5"/>
  <text x="180" y="374" text-anchor="middle" font-size="15" font-weight="800" fill="${NARANJA}">piel con piel</text>
</svg>`;
const p = (c, t) => `<div class="p" style="--c:${c}">${t}</div>`;
lienzo("Recién nacido de riesgo: calor y toma temprana", "Restricción del crecimiento, madre con diabetes o con betabloqueadores",
  `<div class="fila">${ilus}<div class="pasos">
    ${p(AZUL, "<b>Al nacer:</b> secar, gorro y piel con piel en un cuarto cálido y sin corrientes.")}
    ${p(TEAL, "<b>Primeros 60 min:</b> ofrecer el pecho; con fórmula, 40-60 mL/kg/día el primer día.")}
    ${p(AMBAR, "<b>Cada 3 h como máximo:</b> tomas hasta tener 2 glucosas seguidas de 36 mg/dL o más.")}
    ${p(VERDE, "<b>2-4 h:</b> primera glucosa, antes de la segunda toma.")}
  </div></div>`, F_BAPM + " (p. 10-12, flujograma A).");
</script></body></html>
