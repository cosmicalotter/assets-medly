<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
 .fila{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}
 .c{width:190px;height:190px;border-radius:50%;border:4px solid var(--c);background:color-mix(in srgb,var(--c) 9%,white);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:6px}
 .c .n{font-size:30px;font-weight:800;color:var(--c)}
 .c h3{font-size:18px;color:var(--c)}
 .c p{font-size:13px;line-height:1.3}
 .mas{font-size:38px;font-weight:800;color:#94A3B8}
 .pie{border-radius:12px;background:#F8FAFC;border:2px dashed #CBD5E1;padding:10px 14px;font-size:14px;line-height:1.35;text-align:center}
</style></head><body>
<script>
const c = (col, n, t, p) => `<div class="c" style="--c:${col}"><div class="n">${n}</div><h3>${t}</h3><p>${p}</p></div>`;
lienzo("La tríada de Whipple", "Niño que comunica sus síntomas: se estudia sólo si están las tres",
  `<div class="fila">${c(NARANJA, "1", "Síntomas o signos", "temblor, sudor, hambre, confusión, convulsión")}<div class="mas">+</div>
   ${c(ROJO, "2", "Glucosa baja", "medida con un método de laboratorio")}<div class="mas">+</div>
   ${c(VERDE, "3", "Alivio", "al normalizar la glucosa")}</div>
   <div class="pie">Si <b>no puede comunicarlos</b> (lactante, niño pequeño): basta una glucosa plasmática de laboratorio <b>&lt;60 mg/dL</b>.</div>`,
  F_PES + " (p. 2, recomendaciones 1.1 y 1.2).");
</script></body></html>
