<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
 .col{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
 .n{display:flex;align-items:center;gap:14px;border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,white);padding:14px 16px}
 .n .v{flex:none;width:150px;font-size:30px;font-weight:800;color:var(--c);text-align:center}
 .n h3{font-size:19px;color:var(--c)}
 .n p{font-size:14.5px;line-height:1.3;margin-top:3px}
</style></head><body>
<script>
const n = (c, v, t, p) => `<div class="n" style="--c:${c}"><div class="v">${v}</div><div><h3>${t}</h3><p>${p}</p></div></div>`;
lienzo("Niño con diabetes: niveles de hipoglucemia", "Los tres niveles de ISPAD",
  `<div class="col">
    ${n(AMBAR, "&lt;70", "Nivel 1 · alerta (mg/dL)", "Tratar ya con glucosa oral: puede seguir bajando.")}
    ${n(NARANJA, "&lt;54", "Nivel 2 · importante (mg/dL)", "Aparecen síntomas y disfunción cognitiva. Tratar con glucosa oral.")}
    ${n(ROJO, "Sin cifra", "Nivel 3 · grave", "Coma, convulsión o necesita que otra persona le dé glucosa, glucagón o dextrosa IV.")}
  </div>`, F_ISPAD + " (tabla 1).");
</script></body></html>
