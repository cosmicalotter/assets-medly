<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
 .g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
 .k{border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 7%,white);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center}
 .k h3{font-size:18px;color:var(--c)}
 .d{font-size:30px;font-weight:800;color:var(--c);line-height:1.05}
 .u{font-size:14px;line-height:1.3}
 .ic{height:92px}
 .nota{border-radius:12px;background:#F8FAFC;padding:9px 12px;font-size:13.5px;line-height:1.3}
</style></head><body>
<script>
const jer = (c) => `<svg class="ic" viewBox="0 0 120 90"><rect x="18" y="38" width="70" height="18" rx="4" fill="#fff" stroke="${c}" stroke-width="4"/><rect x="24" y="41" width="30" height="12" fill="${tinte(c, 40)}"/><path d="M88 47 H112" stroke="${c}" stroke-width="3"/><path d="M4 40 V54 M4 47 H18" stroke="${c}" stroke-width="4"/></svg>`;
const nasal = (c) => `<svg class="ic" viewBox="0 0 120 90"><rect x="44" y="40" width="32" height="40" rx="8" fill="#fff" stroke="${c}" stroke-width="4"/><path d="M52 40 Q60 6 68 40" fill="${tinte(c, 40)}" stroke="${c}" stroke-width="4"/><rect x="36" y="60" width="48" height="8" rx="3" fill="${c}"/></svg>`;
const pluma = (c) => `<svg class="ic" viewBox="0 0 120 90"><rect x="14" y="36" width="80" height="22" rx="11" fill="#fff" stroke="${c}" stroke-width="4"/><rect x="94" y="41" width="14" height="12" rx="3" fill="${c}"/><rect x="30" y="41" width="28" height="12" rx="4" fill="${tinte(c, 40)}"/></svg>`;
const k = (c, ic, t, d, u) => `<div class="k" style="--c:${c}">${ic(c)}<h3>${t}</h3><div class="d">${d}</div><div class="u">${u}</div></div>`;
lienzo("Glucagón según la edad", "Hipoglucemia grave sin vía IV: niño que no traga, convulsiona o está inconsciente",
  `<div class="g">
    ${k(AZUL, jer, "IM o SC", "1 o 0,5 mg", "<b>1 mg</b> desde <b>25 kg</b>; <b>0,5 mg</b> si pesa menos")}
    ${k(TEAL, nasal, "Nasal", "3 mg", "Desde los <b>4 años</b>; dosis única")}
    ${k(MORADO, pluma, "Dasiglucagón SC", "0,6 mg", "Desde los <b>6 años</b>; pluma lista para usar")}
  </div>
  <div class="nota">El nasal y el dasiglucagón están aprobados para la diabetes. Sin diabetes, el glucagón <b>no sirve en la glucogenosis I</b> y puede fallar tras un ayuno largo.</div>`,
  F_ISPAD + " (tabla 4); Casertano 2021, Front Endocrinol (p. 4, 10). Disponibilidad variable según el país.");
</script></body></html>
