<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// Razones de verosimilitud del hemograma tras 4 horas de vida (GPC Colombia 2013, tabla de la pregunta 10; Newman 2010).
const G = [
  { g: "Leucocitos (/µL)", c: AZUL, v: [["<5000", 80.5], ["5000-9999", 6.4], ["10 000-14 999", 1.0], ["15 000-19 999", 0.41], ["≥20 000", 0.16]] },
  { g: "Neutrófilos (/µL)", c: MORADO, v: [["<1000", 115], ["1000-1999", 51.7], ["2000-4999", 6.9], ["5000-9999", 0.64], ["≥10 000", 0.31]] },
  { g: "Razón I/T", c: NARANJA, v: [["≥0,6", 10.7], ["0,45-0,599", 8.8], ["0,3-0,449", 3.1], ["0,15-0,299", 1.2], ["<0,15", 0.25]] },
];
const L0 = Math.log10(0.1), L1 = Math.log10(200), X0 = 230, X1 = 680;
const xl = (v) => X0 + (X1 - X0) * (Math.log10(v) - L0) / (L1 - L0);
let y = 18, filas = "";
for (const g of G) {
  filas += `<text x="0" y="${y + 12}" font-size="14" font-weight="900" fill="${g.c}">${g.g}</text>`;
  y += 20;
  for (const [r, v] of g.v) {
    const sube = v >= 1;
    filas += `<text x="${X0 - 10}" y="${y + 12}" text-anchor="end" font-size="12.5" fill="#374151">${r}</text>
      <rect x="${Math.min(xl(1), xl(v))}" y="${y}" width="${Math.abs(xl(v) - xl(1))}" height="15" rx="4" fill="${sube ? g.c : "#94A3B8"}"/>
      <text x="${sube ? xl(v) + 6 : xl(v) - 6}" y="${y + 12}" text-anchor="${sube ? "start" : "end"}" font-size="12" font-weight="800" fill="${TINTA}">${String(v).replace(".", ",")}</text>`;
    y += 19;
  }
  y += 8;
}
const eje = [0.1, 1, 10, 100].map((v) => `<line x1="${xl(v)}" y1="10" x2="${xl(v)}" y2="${y}" stroke="${v === 1 ? TINTA : "#E5E7EB"}" stroke-width="${v === 1 ? 2 : 1}"/>
  <text x="${xl(v)}" y="${y + 16}" text-anchor="middle" font-size="12" fill="#6B7280">${String(v).replace(".", ",")}</text>`).join("");
lienzo("El hemograma después de 4 horas", "Razón de verosimilitud de sepsis temprana según el valor (escala logarítmica)",
  `<svg width="668" height="${y + 26}" viewBox="0 0 700 ${y + 26}">${eje}${filas}
     <text x="${xl(1) + 6}" y="${y + 16}" font-size="12" font-weight="800" fill="${TINTA}">1 = no cambia</text></svg>
   <div class="caja" style="background:#1F2A37;color:#fff;font-weight:700;font-size:13.5px">Leucocitos o neutrófilos <b style="color:#FCA5A5">muy bajos</b> suben mucho el riesgo; si los valores no coinciden, actuar según el <b style="color:#FCD34D">peor</b>.</div>`,
  "Gráfico de Empirica con los datos de la GPC Colombia 2013 (pregunta 10, según Newman 2010).");
</script></body></html>
