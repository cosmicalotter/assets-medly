<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="base.js"></script></head><body><script>
// GIF de flujo: la observación clínica al lado de la madre (GPC Colombia 2013, recomendación 1-A y su nota).
const HITOS = [1, 2, 4, 6, 8, 10, 12, 16, 20, 24];
window.cuadro = function (i, n) {
  const t = n > 1 ? i / (n - 1) : 1;
  const x0 = 40, x1 = 628, xh = (h) => x0 + (x1 - x0) * h / 24, hm = 24 * suave(tramo(t, 0.05, 0.8));
  const linea = `<svg width="668" height="96" viewBox="0 0 668 96">
    <rect x="${x0}" y="24" width="${xh(12) - x0}" height="20" rx="8" fill="${tinte(AZUL, 22)}"/>
    <rect x="${xh(12)}" y="24" width="${x1 - xh(12)}" height="20" rx="8" fill="${tinte(TEAL, 22)}"/>
    ${HITOS.map((h) => { const on = hm >= h - 0.01; return `<circle cx="${xh(h)}" cy="34" r="${on ? 9 : 6}" fill="${on ? (h <= 12 ? AZUL : TEAL) : "#CBD5E1"}"/>
      <text x="${xh(h)}" y="68" text-anchor="middle" font-size="12.5" font-weight="800" fill="#374151">${h} h</text>`; }).join("")}
    <line x1="${xh(hm)}" y1="12" x2="${xh(hm)}" y2="56" stroke="${TINTA}" stroke-width="3"/><circle cx="${xh(hm)}" cy="34" r="6" fill="#fff" stroke="${TINTA}" stroke-width="3"/></svg>`;
  const o1 = suave(tramo(t, 0.05, 0.2)), o2 = suave(tramo(t, 0.45, 0.58)), o3 = suave(tramo(t, 0.82, 0.94));
  const caja = (c, tit, txt, o) => `<div style="flex:1;opacity:${0.18 + 0.82 * o};border:2px solid ${c};background:${tinte(c, 12)};border-radius:12px;padding:14px 14px">
      <div style="font-weight:900;color:${c};font-size:18px">${tit}</div><div style="font-size:16px;line-height:1.4;margin-top:6px">${txt}</div></div>`;
  lienzo("La observación al lado de la madre", "Bebé de buen aspecto con un solo factor de riesgo, 12 a 24 horas", `${linea}
    <div style="display:flex;gap:10px">${caja(AZUL, "Primeras 12 horas", "A la <b>hora</b>, a las <b>2 horas</b> y luego cada <b>2 horas</b>", o1)}${caja(TEAL, "De 12 a 24 horas", "Cada <b>4 horas</b>", o2)}</div>
    <div class="caja" style="opacity:${0.18 + 0.82 * o3};background:#F7F8FA;font-size:15.5px;line-height:1.45;padding:14px">En cada valoración: frecuencia <b>cardiaca</b> y <b>respiratoria</b>, saturación, <b>temperatura</b>, tolerancia a la alimentación, patrón respiratorio y estado de <b>conciencia</b>.</div>
    <div class="caja" style="background:#1F2A37;color:#fff;font-weight:700;font-size:13.5px;opacity:${0.18 + 0.82 * o3}">Si aparece un signo de infección: <b style="color:#FCA5A5">hemocultivo y antibiótico</b>.</div>`,
    "Esquema de Empirica. Fuentes: GPC Colombia 2013 (recomendación 1-A); NICE NG195 (1.10.3).");
};
window.cuadro(39, 40);
</script></body></html>
