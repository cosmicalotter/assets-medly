<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1}
  .pn{border-radius:14px;background:#F7F8FA;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .nm{font-size:15px;font-weight:800;text-align:center}
  .qu{font-size:12.5px;text-align:center;line-height:1.3}
  .nota{border-radius:12px;background:#F7F8FA;padding:8px 12px;font-size:13.5px;line-height:1.35}
</style></head><body>
<script>
// Cortes ecográficos esquemáticos: riñón normal, hidronefrosis y vejiga distendida.
const eco = (dentro) => `<svg width="200" height="190" viewBox="0 0 200 190">
  <path d="M100 6 L196 150 A110 110 0 0 1 4 150 Z" fill="#1E2328"/>${dentro}</svg>`;
const rinon = (pelvis) => `
  <ellipse cx="100" cy="112" rx="66" ry="36" fill="#6B7280"/>
  <ellipse cx="100" cy="112" rx="48" ry="22" fill="#B8BEC6"/>
  ${pelvis}`;
const normal = eco(rinon(`<path d="M80 110 Q100 104 122 110 Q100 116 80 110" fill="#D9DDE2"/>`));
const hidro = eco(rinon(`
  <ellipse cx="104" cy="112" rx="24" ry="13" fill="#0B0D10"/>
  <ellipse cx="72" cy="104" rx="11" ry="8" fill="#0B0D10"/><ellipse cx="78" cy="124" rx="10" ry="7" fill="#0B0D10"/>
  <ellipse cx="128" cy="100" rx="10" ry="7" fill="#0B0D10"/><ellipse cx="130" cy="124" rx="10" ry="7" fill="#0B0D10"/>
  <circle cx="104" cy="112" r="34" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="7 5"/>`));
const vejiga = eco(`<path d="M42 70 Q100 40 158 70 Q176 120 140 160 Q100 178 60 160 Q24 120 42 70 Z" fill="#0B0D10" stroke="#9CA3AF" stroke-width="5"/>
  <path d="M86 150 Q100 172 114 150" fill="#6B7280"/>
  <circle cx="100" cy="112" r="64" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="7 5"/>`);
lienzo(
  "Ecografía en la sospecha de obstrucción",
  "Esquema de cortes ecográficos. Negro: líquido (orina).",
  `<div class="fila">
     <div class="pn">${normal}<div class="nm" style="color:var(--verde)">Riñón normal</div><div class="qu">Seno renal ecogénico, sin cavidades dilatadas</div></div>
     <div class="pn">${hidro}<div class="nm" style="color:#B45309">Hidronefrosis</div><div class="qu">Pelvis y cálices dilatados, llenos de orina (anecoicos)</div></div>
     <div class="pn">${vejiga}<div class="nm" style="color:#B45309">Obstrucción de salida</div><div class="qu">Vejiga distendida: próstata, sonda obstruida, vejiga neurógena</div></div>
   </div>
   <div class="nota">Pedirla ante anuria u oliguria, síntomas urinarios, litiasis, próstata, tumor pélvico o sonda que no drena: la desobstrucción precoz salva riñón.</div>`,
  KDIGO("p. 112-113 y tabla 8")
);
</script></body></html>
