<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .g{display:grid;grid-template-columns:70px 1fr 1fr 150px;grid-template-rows:auto 1fr 1fr 1fr auto;gap:6px;flex:1}
  .h{font-size:13px;font-weight:800;color:var(--suave);text-align:center;align-self:end;padding-bottom:2px}
  .e{border-radius:12px;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
  .c{border-radius:12px;background:#F7F8FA;padding:8px 10px;font-size:14px;line-height:1.35;display:flex;align-items:center}
  .c span{display:block}
  .b{grid-column:4;grid-row:2 / span 3;border-radius:12px;background:#F7F8FA;padding:10px;display:flex;flex-direction:column;gap:10px;justify-content:center;font-size:13.5px;line-height:1.3}
  .ej{grid-column:1 / span 4;border-radius:12px;border:2px dashed var(--teal);padding:8px 12px;font-size:14px}
</style></head><body>
<script>
const F = [
  [1, "↑ <b>≥0,3 mg/dL</b> o <b>1,5-1,9 ×</b> la basal", "<b>&lt;0,5 mL/kg/h</b> durante <b>6-12 h</b>"],
  [2, "<b>2-2,9 ×</b> la basal", "<b>&lt;0,5 mL/kg/h</b> durante <b>&gt;12 h</b>"],
  [3, "<b>≥3 ×</b> la basal, <b>≥4 mg/dL</b> o inicio de TRR", "<b>&lt;0,3 mL/kg/h</b> <b>&gt;24 h</b> o anuria <b>&gt;12 h</b>"],
];
lienzo(
  "Estadio de la LRA: C, U y B",
  "Cada componente se estadifica por separado y se informan juntos.",
  `<div class="g">
     <div></div><div class="h">Creatinina (C)</div><div class="h">Diuresis (U)</div><div class="h">Biomarcador (B)</div>
     ${F.map(([n, c, u], i) => `<div class="e" style="background:${ESTADIO[n]}">${n}</div><div class="c"><span><b>C${n}</b>: ${c}</span></div><div class="c"><span><b>U${n}</b>: ${u}</span></div>${i === 0 ? `<div class="b"><div>${pill("#2FB36D", "B0")} negativo</div><div>${pill("#EF5454", "B1")} positivo: daño estructural, peor pronóstico</div><div style="color:var(--suave);font-size:12px">Sólo en su indicación validada</div></div>` : ""}`).join("")}
     <div class="ej">Ejemplo: <b>C1 U2 B1</b> → creatinina en estadio 1, diuresis en estadio 2 y biomarcador positivo. Diuresis por kg de <b>peso ideal</b>.</div>
   </div>`,
  KDIGO("tabla 6, p. 50")
);
</script></body></html>
