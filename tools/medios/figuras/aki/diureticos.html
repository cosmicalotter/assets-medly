<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .esc{flex:1;display:flex;flex-direction:column;gap:5px}
  .r{display:grid;grid-template-columns:120px 1fr 190px;gap:10px;align-items:center;border-radius:12px;padding:8px 12px;background:#F3F4F6;color:var(--suave);transition:none}
  .r .e{font-weight:800;font-size:15px}
  .r .d{font-size:14px;line-height:1.3}
  .r .m{font-size:12.5px;line-height:1.3}
  .r.on{background:color-mix(in srgb,var(--c) 16%,white);color:var(--tinta);outline:2.5px solid var(--c)}
  .r.on .e{color:var(--c)}
  .r.hecho{background:#F7F8FA;color:var(--tinta)}
  .nr{font-size:12px;color:var(--suave);padding-left:130px;line-height:1}
</style></head><body>
<script>
const R = [
  ["#18B9A9", "1 · Valorar", "Furosemida <b>1 mg/kg</b> IV en bolo; <b>1,5 mg/kg</b> si ya tomaba diuréticos", "Meta: <b>&gt;200 mL</b> en 2 h; si se cumple, pautar"],
  ["#4F8CF6", "2 · Escalar", "Doblar la dosis (p. ej., <b>160-200 mg</b> IV) cada <b>6-12 h</b>", "Bolo máximo <b>200 mg</b> antes de pasar a infusión"],
  ["#7B6CF6", "3 · Sinergia", "Añadir metolazona <b>5-10 mg</b> VO o clorotiazida <b>500 mg</b> IV", "<b>30-60 min</b> antes del diurético de asa"],
  ["#F07F3C", "4 · Intensificar", "Infusión continua: empezar a <b>5-10 mg/h</b>", "Ajustar hasta <b>20 mg/h</b>"],
  ["#EF5454", "5 · Fallo", "Valorar TRR", "Sin balance negativo con el máximo, o K⁺ o pH alterados"],
];
window.cuadro = function (i, total) {
  const t = total > 1 ? i / (total - 1) : 1;
  const on = Math.min(R.length - 1, Math.floor(t * R.length));
  lienzo(
    "Sobrecarga de volumen: escalada de diuréticos",
    "Adulto con LRA y sobrecarga, sin otra indicación de TRR. Se sube un escalón si no responde.",
    `<div class="esc">${R.map(([c, e, d, m], k) => `${k ? '<div class="nr">↓ no responde</div>' : ""}<div class="r ${k === on ? "on" : k < on ? "hecho" : ""}" style="--c:${c}"><div class="e">${e}</div><div class="d">${d}</div><div class="m">${m}</div></div>`).join("")}</div>`,
    KDIGO("tabla 22, p. 152")
  );
};
window.cuadro(4, 5);
</script></body></html>
