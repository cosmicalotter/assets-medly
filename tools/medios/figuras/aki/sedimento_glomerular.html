<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script><script src="sedimento.js"></script></head><body>
<script>
function lleno(l, h, n, fn, seed) { const r = rnd(seed); let s = ""; for (let i = 0; i < n; i++) s += fn(-l / 2 + 12 + r() * (l - 24), -h / 2 + 9 + r() * (h - 18)); return s; }
const hemCil = campo(cilindro(100, 78, 150, 40, -14, "rgba(240,200,190,.55)", "#B5463A", lleno(150, 40, 16, (x, y) => hematie(x.toFixed(1), y.toFixed(1), 6.5, "#E07A6B"), 5)), "d");
const dismorf = campo(acantocito(65, 60) + acantocito(125, 70) + acantocito(90, 115) + acantocito(140, 120) + hematie(55, 112, 10, "#E07A6B"), "e");
const leuCil = campo(cilindro(100, 78, 150, 42, 10, "rgba(225,222,240,.6)", "#6B63A8", lleno(150, 42, 9, (x, y) => leucocito(x.toFixed(1), y.toFixed(1)), 11)) + leucocito(60, 130) + leucocito(140, 132), "f");
lienzo(
  "Sedimento: glomerular o intersticial",
  "Esquema del campo al microscopio, con su lectura clínica.",
  `<div class="fila">
     ${panel(hemCil, "Cilindros hemáticos", "Orientan a <b>enfermedad glomerular</b> (síndrome nefrítico)", "#B5463A")}
     ${panel(dismorf, "Hematíes dismórficos", "Acantocitos: hematíes con vesículas; también <b>glomerular</b>", "#B5463A")}
     ${panel(leuCil, "Leucocitos y cilindros leucocitarios", "Apoyan <b>nefritis intersticial aguda</b>", "#6B63A8")}
   </div>
   <div class="nota">Con estos hallazgos: serologías, estudio hematológico y valorar <b>biopsia renal</b>. Los eosinófilos en orina no descartan una nefritis intersticial.</div>`,
  KDIGO("tabla 18, p. 104-106")
);
</script></body></html>
