<script>
const hialino = campo(cilindro(100, 80, 130, 30, -18, "rgba(235,240,245,.65)", "#B9C2CC") + cilindro(70, 125, 80, 22, 12, "rgba(235,240,245,.6)", "#C3CBD3"), "a");

  KDIGO("tabla 18 y p. 104-105")
