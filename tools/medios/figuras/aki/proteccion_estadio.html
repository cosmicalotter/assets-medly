<!doctype html>
<html lang="es"><head><meta charset="utf-8"><script src="base.js"></script>
<style>
  .g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px;flex:1;align-content:start}
  .h{text-align:center;font-weight:800;font-size:15px;padding:6px 0;border-radius:10px;color:#fff}
  .m{border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.3;display:flex;align-items:center}
  .nota{border-radius:12px;background:#F7F8FA;padding:8px 12px;font-size:13.5px;line-height:1.35;margin-top:4px}
</style></head><body>
<script>
// [texto, desde columna (0 = alto riesgo), color]
const M = [
  ["Suspender todos los nefrotóxicos que se pueda", 0, "#FEF3C7"],
  ["Optimizar la volemia y la presión de perfusión", 0, "#FEF3C7"],
  ["Valorar monitorización hemodinámica avanzada", 0, "#FEF3C7"],
  ["Vigilar a menudo diuresis, creatinina y biomarcadores", 0, "#FEF3C7"],
  ["Revisar la dosis de los fármacos", 1, "#FDE1C7"],
  ["Estudio diagnóstico según el caso", 1, "#FDE1C7"],
  ["Valorar TRR si persiste o aparecen indicaciones", 3, "#FBCFCF"],
];
const H = [["Alto riesgo", "#6B7280"], ["Estadio 1", ESTADIO[1]], ["Estadio 2", ESTADIO[2]], ["Estadio 3", ESTADIO[3]]];
lienzo(
  "Protección renal según el estadio",
  "Cada medida empieza en su columna y sigue en los estadios más graves.",
  `<div class="g">${H.map(([t, c]) => `<div class="h" style="background:${c}">${t}</div>`).join("")}
     ${M.map(([t, d, c]) => `<div class="m" style="grid-column:${d + 1} / 5;background:${c}">${t}</div>`).join("")}
   </div>
   <div class="nota">Además: glucemia <b>140-180 mg/dL</b> con insulina, nutrición enteral sin restringir proteínas y alternativas al contraste yodado cuando se pueda.</div>`,
  KDIGO("figura 9 y p. 144, 155 y 175")
);
</script></body></html>
