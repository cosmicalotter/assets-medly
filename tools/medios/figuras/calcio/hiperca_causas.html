// Hipercalcemia: mediada o no por la PTH (Zieg 2024, tabla 10). Esquema propio.
const caja = (t, d, c) => `<div class="caja" style="flex:1;background:${tinte(c, 12)};border-left:5px solid ${c};display:flex;flex-direction:column;gap:4px;font-size:13px"><b style="color:${c};font-size:14.5px">${t}</b><span>${d}</span></div>`;
const cab = (t, s, c) => `<div style="background:${c};color:#fff;border-radius:12px;padding:9px 10px;text-align:center"><div style="font-size:17px;font-weight:800">${t}</div><div style="font-size:12.5px;opacity:.92">${s}</div></div>`;
lienzo("Hipercalcemia: ¿la causa la PTH?", "El 90 % de los casos son hiperparatiroidismo primario o cáncer",
  `<div style="display:flex;gap:12px;flex:1">
     <div style="flex:1;display:flex;flex-direction:column;gap:8px">${cab("Mediada por la PTH", "PTH alta o normal", MORADO)}
       ${caja("Hiperparatiroidismo primario", "Aislado o sindrómico (MEN, tumor de la mandíbula); terciario", MORADO)}
       ${caja("Hipercalcemia hipocalciúrica familiar", "Y el hiperparatiroidismo neonatal por mutaciones del receptor del calcio", AZUL)}</div>
     <div style="flex:2;display:flex;flex-direction:column;gap:8px">${cab("No mediada por la PTH", "PTH baja", NARANJA)}
       <div style="display:flex;gap:8px;flex:1">
         <div style="flex:1;display:flex;flex-direction:column;gap:8px">
           ${caja("Cáncer", "Osteólisis, hipercalcemia humoral, vitamina D o PTH ectópicas", ROJO)}
           ${caja("Granulomas", "Tuberculosis, sarcoidosis, enfermedad por arañazo de gato", AMBAR)}</div>
         <div style="flex:1;display:flex;flex-direction:column;gap:8px">
           ${caja("Fármacos", "Tiazidas, litio, vitaminas A y D, teofilina, antifúngicos", NARANJA)}
           ${caja("Otras", "Inmovilización, tirotoxicosis, insuficiencia suprarrenal, síndrome de Williams, leche y álcalis", GRIS)}</div></div></div>
   </div>`,
  "Datos: Zieg J et al. BMC Nephrol 2024, texto y tabla 10 (CC BY-NC-ND 4.0), citados sin reproducir figuras. Elaboración de Empirica.");
</script></body></html>
