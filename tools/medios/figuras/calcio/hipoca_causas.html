<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="../liquidos/base.js"></script></head><body><script>
// Hipocalcemia: la PTH y el fósforo separan las causas (Zieg 2024, tabla 9; Kim 2015). Esquema propio.
const caja = (t, s, d, c) => `<div class="caja" style="flex:1;background:${tinte(c, 12)};border-left:5px solid ${c};display:flex;flex-direction:column;gap:4px;font-size:13px"><b style="color:${c};font-size:11.5px">${s}</b><b style="font-size:14.5px">${t}</b><span>${d}</span></div>`;
lienzo("Hipocalcemia: ¿falta la PTH o la vitamina D?", "La PTH y el fósforo separan los grupos de causas",
  `<div style="display:flex;gap:10px;flex:1">
     <div style="flex:1;display:flex;flex-direction:column;gap:8px">
       ${caja("Hipoparatiroidismo", "PTH baja · fósforo alto", "DiGeorge, autoinmune, posquirúrgico, depósito de hierro o cobre, hipocalcemia autosómica con hipercalciuria", MORADO)}
       ${caja("Recién nacido", "Transitoria", "Hipocalcemia neonatal precoz o tardía", CELESTE)}</div>
     <div style="flex:1;display:flex;flex-direction:column;gap:8px">
       ${caja("Déficit de vitamina D o de calcio", "PTH alta · fósforo bajo · fosfatasa alcalina alta", "Poca ingesta o sol, malabsorción, enfermedad hepática o renal; raquitismo", NARANJA)}
       ${caja("Pseudohipoparatiroidismo", "PTH alta · fósforo alto", "El riñón y el hueso no responden a la PTH", ROJO)}</div>
     <div style="flex:1;display:flex;flex-direction:column;gap:8px">
       ${caja("Fármacos", "Revisar siempre", "Bisfosfonatos, bicarbonato, diuréticos de asa, denosumab, cinacalcet, productos con citrato", AMBAR)}
       ${caja("Otras", "Revisar también", "<b>Hipomagnesemia</b>, fósforo alto (lisis tumoral, rabdomiólisis), hueso hambriento, sepsis, pancreatitis, choque, alcalosis", GRIS)}</div>
   </div>`,
  "Datos: Zieg J et al. BMC Nephrol 2024, tabla 9, y Kim SY. Ann Pediatr Endocrinol Metab 2015, citados. Elaboración de Empirica.");
</script></body></html>
