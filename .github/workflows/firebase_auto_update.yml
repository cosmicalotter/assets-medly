name: Publicar en Firebase (índices y fecha)

on:
  push:
    branches:
      - main
      - master
    # Vigila JSON (algoritmos, calculadoras e indices/) y todos los formatos de imagen comunes
    paths:
      - '**.json'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.webp'
      - '**.gif'
      - '**.svg'
      - 'update_firebase_date.js'

concurrency:
  group: firebase-remote-config
  cancel-in-progress: false

jobs:
  update-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar los índices
        run: node update_firebase_date.js --validar

      - name: Instalar dependencias
        run: npm install firebase-admin

      - name: Publicar índices y fecha en Remote Config
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PREV_SHA: ${{ github.event.before }}
        run: node update_firebase_date.js
